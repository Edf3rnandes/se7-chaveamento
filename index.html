<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaveamento • Dupla Eliminatória</title>
<style>
:root{
  --bg:#f4f7fc;
  --card:#ffffff;
  --primary:#2554e0;
  --primary-dark:#1a3ea6;
  --accent:#ff7a45;
  --success:#2e9e5b;
  --success-bg:#e6f6ec;
  --text:#25333a;
  --muted:#83949c;
  --muted2:#7c8b93;
  --border:#e1e6ef;
  --radius:14px;
  --chip-blue:#2554e0;
  --chip-blue-dark:#1a3ea6;
  --chip-orange:#ff7a45;
  --team-bg:#eef1f5;
  --winner-bg:#e8f0fe;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:40px;
}
a{color:inherit;}
button{font-family:inherit;}
.app-header{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(120deg,var(--primary),var(--primary-dark));
  color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
  padding-top:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.app-header .row{display:flex; align-items:center; gap:10px;}
.app-header .back{
  background:rgba(255,255,255,.18); border:none; color:#fff; width:34px;height:34px;border-radius:10px;
  font-size:18px; display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer;
}
.app-header h1{font-size:17px; margin:0; font-weight:700; flex:1; line-height:1.25;}
.app-header .sub{font-size:12px; opacity:.85; margin-top:2px;}
.wrap{max-width:640px; margin:0 auto; padding:14px;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(20,30,30,.04);
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--primary); color:#fff; border:none; border-radius:11px;
  padding:12px 16px; font-size:15px; font-weight:600; cursor:pointer;
  width:100%;
}
.btn:active{transform:scale(.98);}
.btn.secondary{background:#fff; color:var(--primary); border:1.5px solid var(--primary);}
.btn.accent{background:var(--accent);}
.btn.ghost{background:transparent; color:var(--muted2); border:1px solid var(--border); font-weight:500;}
.btn.small{padding:8px 12px; font-size:13px; width:auto;}
.btn.block{width:100%;}
.btn[disabled]{opacity:.4; cursor:not-allowed;}
label{font-size:13px; font-weight:600; color:var(--muted2); display:block; margin:10px 0 6px;}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],input[type=time]{
  width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--border);
  font-size:16px; background:#fff; color:var(--text);
}
input[type=number]{text-align:center;}
.size-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:10px 0;}
.size-btn{
  padding:10px 0; text-align:center; border-radius:10px; border:1.5px solid var(--border);
  background:#fff; font-weight:700; font-size:14px; cursor:pointer; color:var(--text);
}
.size-btn.selected{background:var(--primary); color:#fff; border-color:var(--primary);}
.empty{
  text-align:center; padding:40px 16px; color:var(--muted2);
}
.empty .big{font-size:40px; margin-bottom:8px;}
.chave-item{
  display:flex; align-items:center; gap:12px; padding:14px; background:var(--card);
  border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; cursor:pointer;
}
.chave-item .info{flex:1; min-width:0;}
.chave-item .nome{font-weight:700; font-size:15px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.chave-item .meta{font-size:12.5px; color:var(--muted2);}
.progress-pill{
  font-size:12px; font-weight:700; padding:5px 10px; border-radius:20px; background:var(--success-bg); color:var(--success); flex:none;
}
.progress-pill.zero{background:#f1eee2; color:var(--muted2);}
.del-btn{background:none; border:none; color:#c65b4a; font-size:18px; padding:4px 6px; cursor:pointer; flex:none;}
.field-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.field-row .rk{
  width:34px; height:34px; border-radius:9px; background:var(--primary); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none;
}
.hint{font-size:12.5px; color:var(--muted2); margin-top:4px; line-height:1.4;}
.fmt-choice{display:flex; gap:8px; margin:10px 0;}
.fmt-choice label{margin:0; flex:1;}
.fmt-opt{
  border:1.5px solid var(--border); border-radius:11px; padding:12px 10px; text-align:center; cursor:pointer; font-size:13px; font-weight:600;
}
.fmt-opt.selected{border-color:var(--primary); background:#eaf0fe; color:var(--primary-dark);}
.progress-bar-wrap{background:rgba(255,255,255,.25); border-radius:20px; height:6px; margin-top:10px; overflow:hidden;}
.progress-bar-fill{background:#fff; height:100%; border-radius:20px; transition:width .3s;}
.tabs{display:flex; gap:6px; overflow-x:auto; padding:4px 0 10px; -webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:none; padding:8px 14px; border-radius:20px; background:#fff; border:1.5px solid var(--border);
  font-size:13px; font-weight:600; color:var(--muted2); cursor:pointer; white-space:nowrap;
}
.tab.active{background:var(--primary); border-color:var(--primary); color:#fff;}
.podium{
  background:linear-gradient(135deg,#fff6e8,#fdeee0); border:1px solid #f3ddb8; border-radius:var(--radius);
  padding:14px; margin-bottom:14px;
}
.podium h3{margin:0 0 10px; font-size:14px; color:#8a5a12; display:flex; align-items:center; gap:6px;}
.podium-row{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:14px;}
.podium-row .pos{
  width:26px; height:26px; border-radius:50%; background:#f2c14e; color:#5a3d00; font-weight:800; font-size:12px;
  display:flex; align-items:center; justify-content:center; flex:none;
}
.podium-row .pos.p1{background:#f2c14e;}
.podium-row .pos.p2{background:#d6d9dd;}
.podium-row .pos.p3{background:#e2a86f;}
.podium-row .pos.p5{background:#dbe6fb; color:var(--primary-dark);}
.podium-row .name{font-weight:600;}
.ranking-link{
  display:flex; align-items:center; justify-content:center; gap:6px; font-size:12.5px; font-weight:700;
  color:#8a5a12; background:#fff6e8; border:1.3px solid #f0d9a8; border-radius:20px; padding:7px 10px;
  margin-bottom:12px; cursor:pointer;
}
.phase-section{margin-bottom:16px;}
.phase-title{
  display:flex; align-items:center; justify-content:space-between; padding:6px 2px 10px;
  font-size:13px; font-weight:800; color:var(--primary-dark); text-transform:uppercase; letter-spacing:.03em;
}
.phase-title .count{font-size:11.5px; font-weight:700; color:var(--muted2); text-transform:none; letter-spacing:0;}
.match-card{
  background:var(--card); border:1.5px solid var(--border); border-radius:11px; padding:8px 10px; margin-bottom:7px;
  box-shadow:0 1px 3px rgba(20,30,30,.05);
}
.match-card.done{border-color:var(--border);}
.match-card.pending{opacity:.55;}
.match-card.live-now{border-color:var(--chip-blue); background:#eef3ff; box-shadow:0 1px 6px rgba(37,84,224,.15);}
.match-top{display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap;}
.match-num{font-size:10.5px; font-weight:800; color:var(--muted2); border:1.3px solid var(--border); border-radius:20px; padding:2px 8px; flex:none;}
.chave-chip{font-size:10px; font-weight:800; padding:3px 9px; border-radius:20px; color:#fff; flex:none;}
.chave-chip.principal{background:var(--chip-blue);}
.chave-chip.repescagem{background:var(--chip-orange);}
.chave-chip.neutral{background:#eef2f2; color:var(--muted2);}
.match-round{font-size:11px; color:var(--muted2); flex:none;}
.match-top .spacer{flex:1;}
.match-badge{font-size:10px; font-weight:800; padding:3px 8px; border-radius:20px; background:#eef2f2; color:var(--muted2); flex:none; white-space:nowrap;}
.match-badge.wait{background:#f3efe2; color:#a68e4f;}
.match-badge.ready{background:var(--chip-blue); color:#fff;}
.match-badge.done{background:var(--success-bg); color:var(--success);}
.team-row{
  display:flex; align-items:center; gap:7px; padding:6px 10px; margin-bottom:4px; border-radius:9px;
  background:var(--team-bg);
}
.team-row:last-of-type{margin-bottom:0;}
.team-row .tname{flex:1; font-size:13.5px; font-weight:600; min-width:0; line-height:1.25; word-break:break-word;}
.team-row.placeholder .tname{color:var(--muted2); font-weight:500; font-style:italic;}
.team-row.winner{background:var(--winner-bg);}
.team-row.winner .tname{color:var(--primary-dark); font-weight:800;}
.team-row .score-pill{
  flex:none; min-width:26px; text-align:center; font-size:12.5px; font-weight:800; padding:3px 10px; border-radius:20px;
  background:#fff; border:1.3px solid var(--border); color:var(--text);
}
.team-row.winner .score-pill{background:var(--chip-blue); border-color:var(--chip-blue); color:#fff;}
.team-row .score-in{width:52px; flex:none;}
.vs{font-size:11px; color:var(--muted2); text-align:center; padding:1px 0;}
.match-actions{display:flex; gap:8px; margin-top:10px;}
.match-actions .btn{flex:1;}
.set-picker{display:flex; gap:6px; margin-top:8px;}
.set-picker .set-opt{
  flex:1; text-align:center; padding:8px 4px; border:1.5px solid var(--border); border-radius:9px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--muted2);
}
.set-picker .set-opt.selected{border-color:var(--primary); background:#eaf0fe; color:var(--primary-dark);}
.wo-link{font-size:12px; color:var(--muted2); text-decoration:underline; cursor:pointer; text-align:center; margin-top:8px;}
.footer-actions{display:flex; gap:8px; margin-top:18px;}
.footer-actions .btn{flex:1;}
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#23333a; color:#fff;
  padding:10px 18px; border-radius:30px; font-size:13.5px; z-index:99; box-shadow:0 4px 14px rgba(0,0,0,.2);
  opacity:0; pointer-events:none; transition:opacity .25s, bottom .25s;
}
.toast.show{opacity:1; bottom:34px;}
.section-note{font-size:12.5px; color:var(--muted2); background:#f5f1e4; border-radius:10px; padding:8px 10px; margin-bottom:10px;}
.status-badge{font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:8px; margin-left:6px; vertical-align:middle; white-space:nowrap;}
.status-badge.status-pending{background:#f1eee2; color:var(--muted2);}
.status-badge.status-live{background:#fff6e8; color:#8a5a12;}
.status-badge.status-done{background:var(--success-bg); color:var(--success);}
.cat-actions{display:flex; align-items:center; gap:4px; flex:none;}
.cat-actions select{border:1px solid var(--border); border-radius:8px; font-size:11.5px; color:var(--muted2); background:#fff; padding:4px 2px; max-width:78px;}
.cat-switcher{margin-top:8px;}
.cat-switcher select{width:100%; padding:9px 10px; border-radius:10px; border:none; background:rgba(255,255,255,.18); color:#fff; font-size:13px; font-weight:600;}
.cat-switcher select option{color:#23333a;}
.pub-badge{display:inline-block; font-size:11px; font-weight:800; padding:4px 10px; border-radius:20px; background:rgba(255,255,255,.2); color:#fff; margin-top:4px;}
.view-toggle{display:flex; gap:6px; margin-bottom:10px;}
.view-toggle .vt-opt{
  flex:1; text-align:center; padding:9px 4px; border-radius:11px; border:1.5px solid var(--border);
  background:#fff; font-size:13px; font-weight:700; color:var(--muted2); cursor:pointer;
}
.view-toggle .vt-opt.selected{border-color:var(--primary); background:#eaf0fe; color:var(--primary-dark);}
.tree-wrap{border:1px solid var(--border); border-radius:13px; overflow:hidden; background:#fbfbf9; margin-bottom:14px;}
/* Vencedores/Repescagem — static section pills over the canvas, both sides
   always render together now, so these are labels, not tabs. */
.tree-side-labels{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:8px 10px; background:#fff; border-bottom:1px solid var(--border); flex-wrap:wrap;
}
.tsl{font-size:11.5px; font-weight:800; padding:5px 12px; border-radius:20px; color:#fff;}
.tsl.principal{background:var(--chip-blue);}
.tsl.repescagem{background:var(--chip-orange);}
.tree-zoom-bar{
  display:flex; align-items:center; gap:8px; padding:8px 10px; background:#fff; border-bottom:1px solid var(--border);
  font-size:11px; color:var(--muted2);
}
.tree-zoom-bar button{
  width:30px; height:30px; border-radius:9px; border:1.3px solid var(--border); background:#fff;
  font-size:16px; font-weight:800; color:var(--primary-dark); cursor:pointer; flex:none; padding:0;
}
.tree-zoom-bar span#treeZoomPct{font-weight:800; color:var(--text); flex:none;}
.tree-zoom-bar .hint{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tree-scroll{overflow:auto; max-height:min(70vh,560px); cursor:grab; touch-action:pan-x pan-y;}
.tree-canvas{position:relative; zoom:100%;}
.tree-svg{position:absolute; top:0; left:0; pointer-events:none;}
.tree-line{fill:none; stroke:var(--border); stroke-width:2;}
.tree-midline{
  position:absolute; left:0; height:1px; border-top:1px dashed var(--border); pointer-events:none;
}
.tree-match{
  position:absolute; background:#fff; border:1.5px solid var(--border); border-radius:9px;
  padding:6px 8px; font-size:12px; cursor:pointer; box-shadow:0 1px 2px rgba(20,30,30,.05);
  box-sizing:border-box; z-index:1;
}
.tree-match.final{
  border:2px solid var(--primary); box-shadow:0 3px 12px rgba(37,84,224,.22); z-index:2;
}
.tree-match.terceiro{
  border:2px solid var(--chip-orange); box-shadow:0 3px 12px rgba(255,122,69,.22); z-index:2;
}
.tree-final-ribbon{
  background:var(--primary); color:#fff; font-size:9.5px; font-weight:800; text-align:center;
  border-radius:6px; padding:3px 4px; margin:-3px -5px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tree-match.terceiro .tree-final-ribbon{ background:var(--chip-orange); }
.tree-match-tag{font-size:9.5px; color:var(--muted2); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tree-match .tree-num{font-weight:800; color:var(--muted2);}
.tree-team-block{border-top:1px solid var(--border); margin-top:3px;}
.tree-team-row{
  display:flex; align-items:center; justify-content:space-between; gap:6px;
  padding:7px 1px; font-weight:600; font-size:12.5px;
}
.tree-team-row:first-child{border-bottom:1px solid var(--border);}
.tree-team-row.win{color:var(--primary-dark); font-weight:800;}
.tree-tname{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
.tree-score{font-size:11px; font-weight:800; color:var(--muted2); flex:none;}
.tree-team-row.win .tree-score{color:var(--primary-dark);}
/* Semifinal — the one wide, two-cell box (spec §7.1). Left cell = invicto
   (arrives from the chave dos vencedores, on the left); right cell =
   repescado (arrives from the repescagem, on the right). No connector ever
   leaves this box toward Final/3º-4º — the box text already says why. */
.tree-semi{
  position:absolute; background:#fff; border:2px solid var(--success,#2f8f5b); border-radius:11px;
  box-sizing:border-box; cursor:pointer; box-shadow:0 2px 8px rgba(20,30,30,.08); z-index:2;
  overflow:hidden;
}
.tree-semi-title{
  text-align:center; font-weight:800; font-size:11px; letter-spacing:.3px; color:var(--text);
  padding:7px 4px 5px; background:#f3f9f5;
}
.tree-semi-cells{display:flex; height:calc(100% - 30px);}
.tree-semi-cell{
  flex:1; min-width:0; padding:7px 9px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-align:center;
}
.tree-semi-cell.inv{border-right:1px dashed var(--border);}
.tree-semi-cell .status{font-size:8.8px; font-weight:800; letter-spacing:.2px;}
.tree-semi-cell.inv .status{color:var(--chip-blue);}
.tree-semi-cell.rep .status{color:var(--chip-orange);}
.tree-semi-cell .origin{
  font-size:14px; font-weight:800; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;
}
.tree-semi-cell.win .origin{color:var(--primary-dark);}
.tree-semi-score{font-size:10.5px; font-weight:800; color:var(--muted2);}
.tree-semi-cell.win .tree-semi-score{color:var(--primary-dark);}

/* Section titles + per-column round/bloco headers, repeated above each half
   (CIMA then BAIXO), mirroring Ed's own printed reference sheet. */
.tree-section-titles{
  position:absolute; left:0; display:flex; justify-content:space-between; align-items:center;
  gap:8px; box-sizing:border-box; padding:0 8px;
}
.tst{font-size:11px; font-weight:800; white-space:nowrap;}
.tst.chave{color:var(--chip-blue);}
.tst.rep{color:var(--chip-orange);}
.tree-col-heads{position:absolute; left:0; height:40px;}
.tree-col-head{
  position:absolute; top:0; box-sizing:border-box; padding:0 6px; text-align:center;
}
.tree-col-head-r{font-size:9.5px; font-weight:800; color:var(--muted2);}
.tree-col-head-b{font-size:8.8px; color:var(--muted2); margin-top:1px;}
.tree-col-head.center .tree-col-head-r{color:var(--success,#2f8f5b);}
.tree-col-head.center .tree-col-head-b{color:var(--success,#2f8f5b);}

/* quadra + status do jogo */
.match-badge.live{background:var(--chip-orange); color:#fff;}
.match-meta-row{display:flex; align-items:center; gap:6px; margin-bottom:9px; flex-wrap:wrap;}
.match-court{
  font-size:10.5px; font-weight:700; color:var(--muted2); background:#eef2f2; border-radius:8px;
  padding:4px 8px; display:flex; align-items:center; gap:4px; flex:none;
}
.match-court input{
  border:none; background:transparent; font-size:10.5px; font-weight:700; color:var(--text);
  width:64px; padding:0; text-align:left;
}
.andamento-btn{
  flex:none; border:1.5px solid var(--chip-orange); color:var(--chip-orange); background:#fff;
  border-radius:20px; padding:4px 10px; font-size:11px; font-weight:800; cursor:pointer;
}
.andamento-btn.on{background:var(--chip-orange); color:#fff;}

/* foto do evento */
.evento-photo{width:100%; height:130px; object-fit:cover; border-radius:12px; margin-bottom:10px; display:block; background:#eef2f2;}
.evento-hero{width:100%; height:auto; max-height:320px; object-fit:contain; display:block; background:#eef2f2;}
.chave-item .thumb{width:52px; height:52px; border-radius:10px; object-fit:cover; flex:none; background:#eef2f2;}
.foto-upload-preview{width:100%; height:110px; object-fit:cover; border-radius:10px; margin-top:8px; display:block;}
.foto-upload-btn{margin-top:8px;}
textarea{
  width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--border);
  font-size:15px; background:#fff; color:var(--text); font-family:inherit; min-height:80px; resize:vertical;
}

/* página pública do evento (estilo arevo) */
.evt-title-row{display:flex; align-items:center; gap:8px; margin-top:14px; flex-wrap:wrap;}
.evt-title-row h1{font-size:21px; margin:0; font-weight:800; color:var(--text); line-height:1.25;}
.evt-meta-row{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted2); font-weight:600; margin-top:6px;}
.card-title{font-weight:800; font-size:14px; color:var(--primary-dark); margin-bottom:10px; display:flex; align-items:center; gap:6px;}
.info-row{display:flex; align-items:flex-start; gap:10px; margin-bottom:10px;}
.info-row:last-of-type{margin-bottom:0;}
.info-row .ico{font-size:16px; flex:none; line-height:1.4;}
.info-row .ir-label{font-size:11.5px; color:var(--muted2); font-weight:700; text-transform:uppercase; letter-spacing:.02em;}
.info-row .ir-value{font-size:14px; font-weight:600; color:var(--text); margin-top:1px;}
.section-title{
  font-size:15px; font-weight:800; color:var(--primary-dark); margin:18px 0 10px;
  display:flex; align-items:center; gap:6px;
}
.cat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:10px;}
.cat-grid-item{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px;
  cursor:pointer; box-shadow:0 1px 3px rgba(20,30,30,.04);
}
.cgi-nome{font-weight:700; font-size:14px; margin-bottom:4px; line-height:1.25;}

// Generic algorithm for every bracket size from 8 to 30, replacing both the
// hand-extracted spreadsheet tables (7-26) and the old ad-hoc 27-30 filler.
// This is Ed's own spec (ago/2026): everyone starts in the "chave dos
// vencedores", split into two mirrored halves (CIMA/BAIXO). Whoever loses
// falls into the repescagem of the OPPOSITE half — the crossover rule — so
// nobody can face the same opponent again before the final. A 2nd loss
// eliminates. Each half delivers 2 survivors (1 invicto + 1 repescado) who
// cross in two semifinals (SF-CIMA, SF-BAIXO); winners play the final,
// losers play 3rd place. Pads N up to the next power of two (min 8, byes to
// the best seeds) then PRUNES every W.O. game out of the final list and
// renumbers what's left in sequence, so a chave of 11 looks like a chave of
// 11 — never a chave of 16 with half its boxes crossed out. Produces the
// exact same {fase,num,a,b} shape (plain rank numbers or "Venc J N"/"Perd J
// N" references) as every hand-built table above, so nothing else in the
// app (computeBracketMeta, a árvore, o ranking) needs to know this exists.
function bracketSeedOrder(P){
  let order = [1];
  while(order.length < P){
    const n = order.length * 2;
    const next = [];
    order.forEach(s => { next.push(s); next.push(n + 1 - s); });
    order = next;
  }
  return order;

  const terceiro = { id:'3-LUGAR', fase:'TERCEIRO', lado:null, rodada:1, a:{type:'P',val:'SF-CIMA'}, b:{type:'P',val:'SF-BAIXO'} };

      // 1) looks structurally identical to a genuine round-1 game once
      // pruned (both inputs are bare seed numbers either way), but it isn't
      // played at the same time: it's scheduled alongside round 2. Keeping
      // the real round here is what lets the árvore column the two
      // correctly instead of aliasing them together.
      out.push({ fase: faseFor(g), num: novoNum, a: formatRef(effective(g.a)), b: formatRef(effective(g.b)), rodada: g.rodada });
    });
  }
  blocoDescs.forEach(desc => numerarBloco(gamesForBloco(desc)));
  numerarBloco([sfCima, sfBaixo]);
  numerarBloco([final, terceiro]);
  return out;
}
// N=8 a 30 usam sempre o algoritmo genérico acima (substitui tanto as tabelas
// extraídas da planilha quanto o antigo gerador de 27-30) — assim toda chave
// de 8+ segue a mesma espinha de peixe espelhada, e o tamanho máximo dá pra
// esticar só mudando esse limite.
for(let n = 8; n <= 30; n++){
  BRACKETS[n] = buildDuplaCruzada(n);
}

const SIZES = Object.keys(BRACKETS).map(Number).sort((a,b)=>a-b);

const PHASE_LABELS = {
  "GP ÚNICO":"Grupo único (todos x todos)",
  "GRUPO":"Fase de grupos / chave",
  "Grupo A":"Grupo A",
  "Grupo B":"Grupo B",
  "S/Final":"Semifinal",
  "3º/4º":"Disputa 3º / 4º lugar",
  "Final":"Final",
};
function phaseLabel(f){
  if(PHASE_LABELS[f]) return PHASE_LABELS[f];
  if(/^Rodada \d+$/.test(f)) return 'Chave — ' + f;
  if(/^LB Rodada \d+$/.test(f)) return 'Repescagem — ' + f.replace('LB ','');
  return "Colocação " + f;
}

// Structural classification: which games belong to the "Chave dos Vencedores"
// (principal) vs the "Chave de Repescagem" (losers bracket) vs are the single
// merge point ("final"). This is derived purely from the a/b references — a
// game is tainted "repescagem" the moment any input traces back to a "Perd J N"
// (loser-of) reference; "Venc J N" (winner-of) inherits its source game's
// classification; a plain rank number or {grp,pos} group standing is a fresh
// seed (principal). A game whose two inputs disagree (one principal-lineage,
// one repescagem-lineage) is the merge/"final" game. This works uniformly for
// the hand-built tables (3-6), the extracted spreadsheet tables (7-26) and the
// generated tables (27-30) without trusting any fase label text — those vary a
// lot between sources (see brackets.json vs generateDoubleElim's "Rodada N").
// "round" is the longest structural path from a fresh seed, used as the column
// a game belongs to in the árvore (tree) view.
const bracketMetaCache = {};
function computeBracketMeta(numTimes){
  if(bracketMetaCache[numTimes]) return bracketMetaCache[numTimes];
  const games = BRACKETS[numTimes];
  const byNum = {};
  games.forEach(g => { byNum[g.num] = g; });
  const memo = {};

  // "touched" = this survivor's lineage has a loss somewhere in its history
  // (fresh rank seeds / group standings are untouched; the winner side of a
  // "Perd J N" reference is always touched; the winner of "Venc J N" inherits
  // whatever that source game already was).
  function touched(gnum){
    if(memo[gnum] && memo[gnum].touched !== undefined) return memo[gnum].touched;
    const g = byNum[gnum];
    const inputTouched = (ref) => {
      if(typeof ref === 'string'){
        const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
        if(m) return m[1] === 'Perd' ? true : touched(parseInt(m[2], 10));
      }
      return false; // rank number or {grp,pos}: fresh seed, never lost
    };
    const t = inputTouched(g.a) || inputTouched(g.b);
    memo[gnum] = Object.assign(memo[gnum] || {}, { touched: t });
    return t;
  }

  function classify(gnum){
    const g = byNum[gnum];
    const sideTouched = (ref) => {
      if(typeof ref === 'string'){
        const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
        if(m) return m[1] === 'Perd' ? true : touched(parseInt(m[2], 10));
      }
      return false;
    };
    const ta = sideTouched(g.a), tb = sideTouched(g.b);
    if(!ta && !tb) return 'principal';       // both sides still fully undefeated
    if(ta && tb) return 'repescagem';        // both sides already carry a loss
    return 'crossover';                       // one undefeated side meets one touched side
  }

  function depth(gnum){
    if(memo[gnum] && memo[gnum].depth !== undefined) return memo[gnum].depth;
    const g = byNum[gnum];
    const inputDepth = (ref) => {
      if(typeof ref === 'string'){
        const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
        if(m) return depth(parseInt(m[2], 10));
      }
      return 0;
    };
    const d = 1 + Math.max(inputDepth(g.a), inputDepth(g.b));
    memo[gnum] = Object.assign(memo[gnum] || {}, { depth: d });
    return d;
  }

  games.forEach(g => { touched(g.num); depth(g.num); });
  const meta = {};
  games.forEach(g => { meta[g.num] = { bracket: classify(g.num), round: memo[g.num].depth }; });
  const crossovers = games.filter(g => meta[g.num].bracket === 'crossover');
  const hasRepescagem = games.some(g => meta[g.num].bracket === 'repescagem' || meta[g.num].bracket === 'crossover');
  // "clean" = the two lineages only ever meet once (the real grand final) — only
  // then does a strict "Chave dos Vencedores" / "Chave de Repescagem" 2-view
  // split make sense. Sizes with several crossover/placement games throughout
  // (common in the CBV-style tables for 7-26) don't decompose that way.
  const isClean = hasRepescagem && crossovers.length === 1;
  const result = { meta, hasRepescagem, isClean, crossovers: crossovers.map(g=>g.num) };
  bracketMetaCache[numTimes] = result;
  return result;
}

// Semifinal, final and the 3rd-place dispute can use a different set format
// (e.g. melhor de 3) than the rest of the chave (e.g. set único).
const DECISIVE_FASES = new Set(['S/Final', 'Final', '3º/4º']);
function formatForGame(chave, g){
  if(DECISIVE_FASES.has(g.fase)) return chave.formatoDecisivo || chave.formato;
  return chave.formato;
}

// ---------- Firestore-backed data layer ----------
// eventos/categorias/chaves now live in Firestore. Realtime listeners
// (onSnapshot) mirror each collection into a plain in-memory array below, so
// every load*/get* function stays a synchronous read exactly like it was with
// localStorage — only update*/delete* now also fire off a Firestore write.
// The local array is updated optimistically (immediately) on every write so
// the screen right after saving always shows fresh data without waiting for

function diasOfEvento(evento){
  const days = [];
  if(!evento.dataInicio || !evento.dataFim) return days;
  let d = new Date(evento.dataInicio + 'T00:00:00');
  const end = new Date(evento.dataFim + 'T00:00:00');
  let guard = 0;
  while(d <= end && guard < 60){
    days.push(d.toISOString().slice(0,10));
    d.setDate(d.getDate() + 1);
    guard++;
  }
  return days;
}
function formatDiaLabel(dataStr){
  const d = new Date(dataStr + 'T00:00:00');
  const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  return dias[d.getDay()] + ' ' + String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}
// Full day-of-week name for the evento's day tabs/list, e.g. "Sexta – 21/08".
function formatDiaLabelFull(dataStr){
  const d = new Date(dataStr + 'T00:00:00');
  const dias = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  return dias[d.getDay()] + ' – ' + String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}
// "31 de julho de 2026" — usado na página pública do evento (estilo arevo).
function formatDateLong(dataStr){
  const d = new Date(dataStr + 'T00:00:00');
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return String(d.getDate()).padStart(2,'0') + ' de ' + meses[d.getMonth()] + ' de ' + d.getFullYear();
}
function formatPeriodoLong(dataInicio, dataFim){
  if(!dataInicio) return '';
  if(!dataFim || dataFim === dataInicio) return formatDateLong(dataInicio);
  return formatDateLong(dataInicio) + ' - ' + formatDateLong(dataFim);
}

// Status do evento como um todo (badge na página pública), derivado do
// progresso agregado de todas as categorias — não temos inscrição pelo site,
// então "Aberto" (como no arevo) não se aplica; usamos o mesmo vocabulário de
// status já usado nas chaves (Programado / Em andamento / Concluído).
function eventoStatusInfo(ev){
  const items = categoriasOfEvento(ev.id);
  if(!items.length) return { label:'Programado', cls:'status-pending' };
  let anyStarted = false, allDone = true;
  items.forEach(({chave}) => {
    const st = chaveStatus(chave);
    if(st.done > 0) anyStarted = true;
    if(!st.concluded) allDone = false;
  });
  if(allDone) return { label:'Concluído', cls:'status-done' };
  if(anyStarted) return { label:'Em andamento', cls:'status-live' };
  return { label:'Programado', cls:'status-pending' };
}
// Status of a chave's games, used for the at-a-glance badges in both UIs.
function chaveStatus(chave){
  const games = effectiveGames(chave);
  const total = games.length;
  const done = games.filter(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot).length;
  // "Concluída" is based on every game having a result, not on the ranking having
  // zero pending rows — a handful of bracket sizes carry a harmless "não determinado"
  // placeholder row from the source data (flagged dataQuirk) that would otherwise
  // keep the status stuck on "Em andamento" forever even once every match is played.
  const concluded = total > 0 && done === total;
  let label, cls;
  if(done === 0){ label = 'Não iniciada'; cls = 'status-pending'; }
  else if(concluded){ label = 'Concluída'; cls = 'status-done'; }
  else { label = 'Em andamento'; cls = 'status-live'; }
  return { total, done, concluded, label, cls };
}
// Where the back button / breadcrumb from a chave should go: back to its evento

  if(cat) return '/evento/' + cat.eventoId + '/' + cat.data;
  return '/organizador';

// ---------- quadra + status do jogo (próximo / em andamento / finalizado) ----------
// "quadra" (which court) and "andamento" (organizer manually marking a game as

function setQuadra(chaveId, gnum, valor){

  if(!chave) return;
  chave.quadras = Object.assign({}, chave.quadras);
  if(valor && valor.trim()) chave.quadras[gnum] = valor.trim(); else delete chave.quadras[gnum];
  updateChave(chave);
}
function toggleAndamento(chaveId, gnum){
  const chave = getChave(chaveId);
  if(!chave) return;
  chave.andamento = Object.assign({}, chave.andamento);
  if(chave.andamento[gnum]) delete chave.andamento[gnum]; else chave.andamento[gnum] = true;
  updateChave(chave);
}
// Clears the manual "em andamento" flag once a jogo gets a resultado — a
// finished game shouldn't keep showing as "em andamento".
function clearAndamento(chave, gnum){
  if(chave.andamento && chave.andamento[gnum]){
    chave.andamento = Object.assign({}, chave.andamento);
    delete chave.andamento[gnum];

// Single source of truth for the 4-state badge shown on both the organizador
// and público match cards: finalizado (tem resultado) > em andamento (marcado
// manualmente pelo organizador) > próximo (os dois times já são conhecidos,
// pronto pra jogar) > aguardando (ainda depende de outro jogo).
function matchStatus(chave, g, info, res){
  const done = !!(res && res.vencedorSlot);
  if(done) return { key:'finalizado', label:'Finalizado', cls:'done' };
  if(chave.andamento && chave.andamento[g.num]) return { key:'andamento', label:'● Em andamento', cls:'live' };
  if(info.ready) return { key:'proximo', label:'Próximo', cls:'ready' };
  return { key:'aguardando', label:'Aguardando', cls:'wait' };
}

// ---------- team modality (dupla / quarteto) ----------
function emptyTeam(modalidade){
  if(modalidade === 'quarteto') return { nome:'', atletas:['','','','','',''] };
  return { atleta1:'', atleta2:'' };
}
// Returns the display label for team at index idx, or null if not filled in yet.
function teamLabel(chave, idx){
  const t = chave.times[idx];
  if(!t) return null;
  if(typeof t === 'string') return t.trim() ? t.trim() : null; // legacy format safety net
  if(chave.modalidade === 'quarteto'){
    return (t.nome && t.nome.trim()) ? t.nome.trim() : null;
  }
  const a1 = (t.atleta1||'').trim(), a2 = (t.atleta2||'').trim();
  if(a1 && a2) return a1 + ' / ' + a2;
  if(a1) return a1;
  if(a2) return a2;
  return null;
}

// ---------- bracket resolution ----------
function resolveTeam(chave, ref){
  // ref: number (rank), "Venc J N" / "Perd J N", or {grp,pos} (group standing)
  if(typeof ref === 'number'){
    const label = teamLabel(chave, ref-1);
    return { label: label || ('Rank ' + ref), resolved: !!label, teamKey: 'R'+ref };
  }
  if(ref && typeof ref === 'object' && ref.grp){
    const st = groupStandings(chave, ref.grp);
    if(!st.complete){
      return { label: (ref.pos===1?'1º':'2º') + ' do Grupo ' + ref.grp, resolved:false, teamKey:null };
    }
    const row = st.rows[ref.pos-1];
    if(!row) return { label:'?', resolved:false, teamKey:null };
    return { label: row.label, resolved:true, teamKey:'R'+row.rank };
  }
  const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
  if(!m) return { label: String(ref), resolved:false, teamKey:null };
  const kind = m[1]; const gnum = parseInt(m[2],10);
  const res = chave.resultados[gnum];
  if(!res || !res.vencedorSlot){
    return { label: (kind==='Venc' ? 'Vencedor Jogo ' : 'Perdedor Jogo ') + gnum, resolved:false, teamKey:null };
  }
  const games = BRACKETS[chave.numTimes];
  const g = games.find(x => x.num === gnum);
  const winnerRef = res.vencedorSlot === 'a' ? g.a : g.b;
  const loserRef  = res.vencedorSlot === 'a' ? g.b : g.a;
  return resolveTeam(chave, kind === 'Venc' ? winnerRef : loserRef);
}

// ---------- group-stage standings (average de pontos) ----------
function groupGames(numTimes, grp){
  return BRACKETS[numTimes].filter(g => g.grupo === grp);
}
function groupRanks(numTimes, grp){
  const games = groupGames(numTimes, grp);
  const set = new Set();
  games.forEach(g=>{ if(typeof g.a==='number') set.add(g.a); if(typeof g.b==='number') set.add(g.b); });
  return Array.from(set).sort((x,y)=>x-y);
}
function groupStandings(chave, grp){
  const games = groupGames(chave.numTimes, grp);
  const ranks = groupRanks(chave.numTimes, grp);
  const stats = {};
  ranks.forEach(r => stats[r] = { rank:r, feitos:0, sofridos:0, jogos:0, label: resolveTeam(chave, r).label });
  let playedCount = 0;
  games.forEach(g=>{
    const res = chave.resultados[g.num];
    if(!res || !res.vencedorSlot) return;
    playedCount++;
    let fa=0, fb=0;
    (res.sets||[]).forEach(s=>{ fa+=s[0]; fb+=s[1]; });
    stats[g.a].feitos += fa; stats[g.a].sofridos += fb; stats[g.a].jogos++;
    stats[g.b].feitos += fb; stats[g.b].sofridos += fa; stats[g.b].jogos++;
  });
  const arr = ranks.map(r=>{
    const s = stats[r];
    const average = s.sofridos>0 ? s.feitos/s.sofridos : (s.feitos>0 ? Infinity : 0);
    return Object.assign({}, s, { average });
  });
  arr.sort((x,y)=>{
    if(y.average !== x.average) return y.average - x.average;
    if(y.feitos !== x.feitos) return y.feitos - x.feitos;
    return 0;
  });
  return { rows: arr, complete: playedCount === games.length, totalGames: games.length, played: playedCount };
}

function matchInfo(chave, g){
  const A = resolveTeam(chave, g.a);
  const B = resolveTeam(chave, g.b);
  const res = chave.resultados[g.num] || null;
  return { A, B, res, ready: A.resolved && B.resolved };
}

// ---------- score logic ----------
function setWinner(scoreA, scoreB){
  const a = parseInt(scoreA,10), b = parseInt(scoreB,10);
  if(isNaN(a) || isNaN(b) || a === b) return null;
  return a > b ? 'a' : 'b';
}
function computeMatchWinner(formato, sets){
  // sets: [[a,b], ...]
  if(formato === 'unico'){
    if(sets.length < 1) return null;
    return setWinner(sets[0][0], sets[0][1]);
  }
  // melhorDe3
  let wa=0, wb=0;
  for(const s of sets){
    const w = setWinner(s[0], s[1]);
    if(w === 'a') wa++; else if(w === 'b') wb++;
  }
  if(wa >= 2) return 'a';
  if(wb >= 2) return 'b';
  return null;
}

// ---------- standings ----------
function computeStandings(chave){
  const games = effectiveGames(chave);
  const byFase = {};
  games.forEach(g => { (byFase[g.fase] = byFase[g.fase] || []).push(g); });
  const rows = [];
  function decided(fase){
    const arr = byFase[fase];
    if(!arr || arr.length !== 1) return null;
    const g = arr[0];
    const res = chave.resultados[g.num];
    if(!res || !res.vencedorSlot) return null;
    const info = matchInfo(chave, g);
    return { winner: res.vencedorSlot==='a'?info.A:info.B, loser: res.vencedorSlot==='a'?info.B:info.A };
  }
  const final = decided('Final');
  if(final){
    rows.push({pos:'1º', cls:'p1', name: final.winner.label});
    rows.push({pos:'2º', cls:'p2', name: final.loser.label});
  }
  const isSmall = String(chave.numTimes) === '4' || String(chave.numTimes) === '5';
  const semDisputa3 = isSmall && chave.disputa3 === false;
  const terceiro = decided('3º/4º');
  if(terceiro){
    rows.push({pos:'3º', cls:'p3', name: terceiro.winner.label});
    rows.push({pos:'4º', cls:'p3', name: terceiro.loser.label});
  } else if(semDisputa3){
    const stU = groupStandings(chave, 'UNICO');
    if(stU.complete && stU.rows.length >= 4){
      rows.push({pos:'3º', cls:'p3', name: stU.rows[2].label});
      rows.push({pos:'4º', cls:'p3', name: stU.rows[3].label});
    }
  }
  const quinto = decided('5º/6º');
  if(quinto){
    rows.push({pos:'5º', cls:'p5', name: quinto.winner.label});
    rows.push({pos:'6º', cls:'p5', name: quinto.loser.label});
  }
  const setimo = decided('7º/8º');
  if(setimo){
    rows.push({pos:'7º', cls:'p5', name: setimo.winner.label});
    rows.push({pos:'8º', cls:'p5', name: setimo.loser.label});
  }
  if(String(chave.numTimes) === '6'){
    const stA = groupStandings(chave, 'A');
    const stB = groupStandings(chave, 'B');
    if(stA.complete && stB.complete){
      const c1 = stA.rows[2], c2 = stB.rows[2];
      const pair = [c1, c2].sort((x,y)=> y.average - x.average);
      rows.push({pos:'5º', cls:'p5', name: pair[0].label});
      rows.push({pos:'6º', cls:'p5', name: pair[1].label});
    }
  }
  if(String(chave.numTimes) === '5'){
    const stU = groupStandings(chave, 'UNICO');
    if(stU.complete && rows.some(r=>r.pos==='4º') && stU.rows.length > 4){
      rows.push({pos:'5º', cls:'p5', name: stU.rows[4].label});
    }
  }
  if(String(chave.numTimes) === '3'){
    const stU = groupStandings(chave, 'UNICO');
    if(stU.complete && stU.rows.length >= 3){
      rows.push({pos:'3º', cls:'p3', name: stU.rows[2].label});
    }
  }
  if(String(chave.numTimes) === '7'){
    const stA = groupStandings(chave, 'A');
    const stB = groupStandings(chave, 'B');
    if(stA.complete && stB.complete){
      const cand = [stA.rows[2], stB.rows[2], stB.rows[3]].filter(Boolean);
      cand.sort((x,y) => y.average - x.average);
      const labels = ['5º','6º','7º'];
      cand.forEach((c,i) => rows.push({pos:labels[i], cls:'p5', name:c.label}));
    }
  }
  return rows;
}

// ---------- full 1..N final ranking (progressive: fills in as duplas are eliminated) ----------
function ordinal(n){ return n + 'º'; }
function posNumFromLabel(posStr){ return parseInt(String(posStr).replace('º',''), 10); }

// Structural template: for a given bracket size, which games decide which position
// (or position range, when several teams end up tied). This depends only on the
// bracket's shape — never on results — so it's computed once and cached.
const rankTemplateCache = {};
function buildRankTemplate(numTimes){
  if(rankTemplateCache[numTimes]) return rankTemplateCache[numTimes];
  const games = BRACKETS[numTimes];
  const referencedVenc = new Set(), referencedPerd = new Set();
  games.forEach(g => {
    [g.a, g.b].forEach(ref => {
      if(typeof ref === 'string'){
        const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
        if(m){ (m[1]==='Venc' ? referencedVenc : referencedPerd).add(parseInt(m[2],10)); }
      }
    });
  });
  const cohortsMap = {};
  games.forEach(g => {
    if(!referencedVenc.has(g.num)){
      const key = g.fase + '|venc';
      if(!cohortsMap[key]) cohortsMap[key] = { fase:g.fase, outcome:'venc', maxNum:-1, gameNums:[] };
      cohortsMap[key].maxNum = Math.max(cohortsMap[key].maxNum, g.num);
      cohortsMap[key].gameNums.push(g.num);
    }
    if(!referencedPerd.has(g.num)){
      const key = g.fase + '|perd';
      if(!cohortsMap[key]) cohortsMap[key] = { fase:g.fase, outcome:'perd', maxNum:-1, gameNums:[] };
      cohortsMap[key].maxNum = Math.max(cohortsMap[key].maxNum, g.num);
      cohortsMap[key].gameNums.push(g.num);
    }
  });
  const cohorts = Object.values(cohortsMap).sort((a,b)=>{
    if(b.maxNum !== a.maxNum) return b.maxNum - a.maxNum;
    if(a.outcome !== b.outcome) return a.outcome === 'venc' ? -1 : 1;
    return 0;
  });
  let pos = 1;
  cohorts.forEach(c => {
    c.posStart = pos;
    c.posEnd = pos + c.gameNums.length - 1;
    c.posLabel = c.posStart === c.posEnd ? ordinal(c.posStart) : (ordinal(c.posStart) + '–' + ordinal(c.posEnd));
    pos = c.posEnd + 1;
  });
  rankTemplateCache[numTimes] = cohorts;
  return cohorts;
}

function computeFullRanking(chave){
  const games = BRACKETS[chave.numTimes];
  const hasGroups = games.some(g => g.grupo);
  const N = Number(chave.numTimes);
  if(hasGroups){
    const standingsRows = computeStandings(chave);
    const known = {};
    standingsRows.forEach(r => { known[posNumFromLabel(r.pos)] = r.name; });
    const rows = [];
    for(let p = 1; p <= N; p++){
      if(known[p] !== undefined) rows.push({ posLabel: ordinal(p), posStart:p, name: known[p], tied:false, pending:false });
      else rows.push({ posLabel: ordinal(p), posStart:p, name:null, tied:false, pending:true });
    }
    return rows;
  }
  return computeFinalRankingChain(chave);
}

function computeFinalRankingChain(chave){
  const template = buildRankTemplate(chave.numTimes);
  const games = BRACKETS[chave.numTimes];
  let rows = [];
  template.forEach(c => {
    const allPlayed = c.gameNums.every(gn => chave.resultados[gn] && chave.resultados[gn].vencedorSlot);
    if(!allPlayed){
      rows.push({ posLabel:c.posLabel, posStart:c.posStart, name:null, tied:false, pending:true });
      return;
    }
    const teams = c.gameNums.map(gn => {
      const g = games.find(x => x.num === gn);
      const res = chave.resultados[gn];
      const info = matchInfo(chave, g);
      return c.outcome === 'venc' ? (res.vencedorSlot==='a'?info.A:info.B) : (res.vencedorSlot==='a'?info.B:info.A);
    });
    teams.sort((x,y)=>{
      const rx = parseInt(String(x.teamKey||'R999').replace('R',''),10);
      const ry = parseInt(String(y.teamKey||'R999').replace('R',''),10);
      return rx - ry;
    });
    teams.forEach(team => rows.push({ posLabel:c.posLabel, posStart:c.posStart, name:team.label, teamKey:team.teamKey, tied: teams.length>1, pending:false }));
  });

  // Safety net: a couple of the source spreadsheet's larger tables have a duplicated
  // internal reference that can resolve the same dupla into two different slots.
  // Keep only its best (lowest posStart) slot; the other slot is left without a name.
  const best = {};
  rows.forEach(r => {
    if(r.pending) return;
    const key = r.teamKey || r.name;
    if(!best[key] || r.posStart < best[key].posStart) best[key] = r;
  });
  rows = rows.map(r => {
    if(r.pending) return r;
    const key = r.teamKey || r.name;
    if(best[key] !== r) return { posLabel:r.posLabel, posStart:r.posStart, name:null, tied:false, pending:true, dataQuirk:true };
    return r;
  });

  // Once every game is played, any real dupla still missing from the decided rows
  // (a rarer knock-on effect of the same source-table inconsistency) gets an explicit
  // placeholder so it's never silently absent from the ranking.
  const allPlayed = games.every(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot);
  if(allPlayed){
    const decidedNames = new Set(rows.filter(r=>!r.pending).map(r=>r.name));
    chave.times.forEach((t, i) => {
      const label = teamLabel(chave, i) || ('Rank ' + (i+1));
      if(!decidedNames.has(label)){
        rows.push({ posLabel:'?', posStart:9999, name:null, altName:label, tied:false, pending:true, dataQuirk:true });
      }
    });
  }
  return rows;
}

// For 4/5 duplas the organizer can skip the 3º/4º dispute (goes straight to the
// final, 3º/4º decided by group average instead). This returns the game list a
// given chave should actually use.
function effectiveGames(chave){
  const games = BRACKETS[chave.numTimes];
  const isSmall = String(chave.numTimes) === '4' || String(chave.numTimes) === '5';
  if(isSmall && chave.disputa3 === false){
    return games.filter(g => g.fase !== '3º/4º');
  }
  return games;
}

function route(){
  const hash = location.hash.slice(1) || '/';
  const parts = hash.split('/').filter(Boolean);
  // A raiz "/" agora É o modo público (lista de eventos publicados) — quem
  // acessa o link do evento cai direto lá, sem precisar logar. "/pub" continua
  // funcionando como sinônimo (links/QR codes antigos). Só "/organizador" e as
  // telas de edição (evento, categoria, chave...) exigem login.
  const isPub = hash === '/' || hash === '/pub' || parts[0] === 'pub';

  if(!isPub){
    if(!_authInitialized){
      app.innerHTML = `${header('Chaveamento', null, null)}<div class="wrap"><div class="empty"><div class="big">⏳</div><div style="font-weight:700;">Carregando…</div></div></div>`;
      return; // onAuthStateChanged calls route() again once Firebase reports the auth state
    }
    if(!_authUser) return renderLoginGate();
  }

  // ---- organizador (autenticado) ----
  if(hash === '/organizador') return renderEventosHome();
  if(hash === '/novo-evento') return renderEventoSetup();
  if(parts[0] === 'editar-evento') return renderEventoSetup(parts[1]);
  if(parts[0] === 'evento') return renderEventoView(parts[1], parts[2] ? decodeURIComponent(parts[2]) : null);
  if(parts[0] === 'nova-categoria') return renderSetup(null, { eventoId:parts[1], data:decodeURIComponent(parts[2]) });
  if(parts[0] === 'chave') return renderChaveView(parts[1]);
  if(parts[0] === 'editar') return renderSetup(parts[1]);

  // ---- público (somente leitura, sem login) ----
  if(hash === '/' || hash === '/pub') return renderPubEventos();
  if(parts[0] === 'pub' && parts[1] === 'evento' && parts.length === 3) return renderPubEventoView(parts[2]);
  if(parts[0] === 'pub' && parts[1] === 'evento' && parts.length >= 4) return renderPubDiaView(parts[2], decodeURIComponent(parts[3]));
  if(parts[0] === 'pub' && parts[1] === 'chave') return renderPubChaveView(parts[2]);

  return renderPubEventos();
}
window.addEventListener('hashchange', route);
// Live-ish updates for the read-only público screens: pick up changes saved by
// the organizador in another tab/window of the same browser (storage event),
// plus a light poll as a fallback so a screen left open keeps refreshing.
window.addEventListener('storage', (e) => {
  if(String(e.key||'').indexOf('chaveamento_v1_') === 0) route();
});
// This is a defensive fallback, not the primary update mechanism — Firestore's
// onSnapshot listeners already push route() reactively the instant data
// changes, in real time. Re-rendering the whole screen from scratch every 4s
// regardless of whether anything changed was wasteful (and visibly janky —
// it could interrupt a scroll or an in-progress pinch-zoom on the árvore), so
// this now just runs occasionally in case a snapshot listener ever misses
// something (dropped connection, etc), not as the normal update path.
setInterval(() => {
  const h = location.hash.slice(1) || '/';
  if(h === '/' || h.indexOf('/pub') === 0) route();
}, 20000);

// Redimensiona no navegador (máx. 640px de largura, JPEG) antes de salvar —
// evita estourar o limite de 1MB por documento do Firestore com foto em base64
// (não usamos Firebase Storage aqui pra não somar mais um SDK/configuração).
function onEventoFotoSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 640;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      eventoSetupState.fotoUrl = canvas.toDataURL('image/jpeg', 0.72);
      renderEventoSetup(eventoSetupState._editId || '');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
function saveEventoSetup(editId){
  const s = eventoSetupState;
  if(!s.nome || !s.nome.trim()){ toast('Dê um nome para o evento'); return; }
  if(!s.dataInicio || !s.dataFim){ toast('Informe a data inicial e final'); return; }
  if(s.dataFim < s.dataInicio){ toast('A data final não pode ser antes da inicial'); return; }
  if(editId){
    const ev = getEvento(editId);
    ev.nome = s.nome.trim(); ev.edicao = s.edicao.trim(); ev.dataInicio = s.dataInicio; ev.dataFim = s.dataFim; ev.fotoUrl = s.fotoUrl || null;
    ev.local = s.local.trim(); ev.contato = s.contato.trim(); ev.regras = s.regras.trim();
    updateEvento(ev);
    toast('Evento atualizado');
    location.hash = '/evento/' + ev.id;
  } else {
    // Nasce em rascunho — só o organizador vê até clicar em "Publicar evento".
    const ev = {
      id:uid('e'), nome:s.nome.trim(), edicao:s.edicao.trim(), dataInicio:s.dataInicio, dataFim:s.dataFim,
      fotoUrl:s.fotoUrl||null, local:s.local.trim(), contato:s.contato.trim(), regras:s.regras.trim(),
      publicado:false, criadoEm:Date.now()
    };
    updateEvento(ev);
    eventoSetupState = null;
    toast('Evento criado em rascunho — publique quando estiver pronto');
    location.hash = '/evento/' + ev.id;
  }
}

  activeDia[eventoId] = dia;

  const dayTabs = `<div class="tabs" style="overflow-x:auto;">

    </div>`;
  } else {
    body = items.map(({cat, chave}) => {
      const st = chaveStatus(chave);
      const otherDias = dias.filter(d => d !== dia);
      const moveOptions = otherDias.map(d => `<option value="${d}">${escapeHtml(formatDiaLabel(d))}</option>`).join('');
      const horaTag = cat.horaInicio ? `⏰ ${escapeHtml(cat.horaInicio)} • ` : '';

          <button class="btn ghost small" onclick="renameCategoria('${chave.id}')" title="Renomear">✎</button>
          <button class="btn ghost small" onclick="duplicateCategoria('${cat.id}')" title="Duplicar">⧉</button>
          ${otherDias.length ? `<select title="Mover para outro dia" onchange="if(this.value) moveCategoriaToDia('${cat.id}', this.value)">
            <option value="">Mover…</option>${moveOptions}
          </select>` : ''}
          <button class="del-btn" onclick="deleteCategoriaConfirm('${cat.id}')">✕</button>
        </div>
      </div>`;
    }).join('');
  }

  app.innerHTML = `
    ${header(escapeHtml(ev.nome) + (publicado ? '' : ' <span class="rascunho-badge">RASCUNHO</span>'), ev.edicao ? escapeHtml(ev.edicao) : null, '/organizador', publishRow)}

      ${dayTabs}
      ${body}
      <button class="btn accent" style="margin-top:6px;" onclick="location.hash='/nova-categoria/${eventoId}/'+encodeURIComponent('${dia}')">+ Nova categoria</button>
    </div>`;
}
function togglePublicarEvento(id){
  const ev = getEvento(id);
  if(!ev) return;
  ev.publicado = !(ev.publicado === true);
  updateEvento(ev);
  toast(ev.publicado ? 'Evento publicado — já aparece pro público' : 'Evento voltou a ser rascunho');
  renderEventoView(id, activeDia[id]);
}

function renameCategoria(chaveId){
  const c = getChave(chaveId);
  if(!c) return;
  const novoNome = prompt('Novo nome da categoria:', c.nome);
  if(novoNome === null) return;
  if(!novoNome.trim()){ toast('O nome não pode ficar em branco'); return; }
  c.nome = novoNome.trim();
  updateChave(c);
  const cat = categoriaByChaveId(chaveId);
  toast('Categoria renomeada');
  if(cat) renderEventoView(cat.eventoId, cat.data); else route();
}
function duplicateCategoria(catId){
  const cat = getCategoria(catId);
  if(!cat) return;
  const orig = getChave(cat.chaveId);
  if(!orig) return;
  const novo = JSON.parse(JSON.stringify(orig));
  novo.id = uid('c');
  novo.nome = orig.nome + ' (cópia)';
  novo.resultados = {};
  novo.criadoEm = Date.now();
  updateChave(novo);
  const novaCat = { id:uid('cat'), eventoId:cat.eventoId, data:cat.data, chaveId:novo.id, criadoEm:Date.now() };
  updateCategoria(novaCat);
  toast('Categoria duplicada');
  renderEventoView(cat.eventoId, cat.data);
}
function moveCategoriaToDia(catId, novaData){
  const cat = getCategoria(catId);
  if(!cat) return;
  cat.data = novaData;
  updateCategoria(cat);
  toast('Categoria movida');
  renderEventoView(cat.eventoId, novaData);
}
function deleteCategoriaConfirm(catId){
  const cat = getCategoria(catId);
  if(!cat) return;
  const chave = getChave(cat.chaveId);
  const nome = chave ? chave.nome : 'esta categoria';
  if(confirm(`Excluir a categoria "${nome}"? Essa ação não pode ser desfeita.`)){
    const eventoId = cat.eventoId, dia = cat.data;
    deleteCategoria(catId);
    toast('Categoria excluída');
    renderEventoView(eventoId, dia);
  }
}

function renderPubMatchCard(chave, g){
  const info = matchInfo(chave, g);
  const res = chave.resultados[g.num];
  const done = !!(res && res.vencedorSlot);
  const st = matchStatus(chave, g, info, res);
  const cardClass = done ? 'done' : (st.key==='andamento' || st.key==='proximo' ? 'live-now' : 'pending');
  const badge = `<span class="match-badge ${st.cls}">${st.label}</span>`;
  const chip = chaveBadgeInfo(chave, g);
  const quadra = (chave.quadras || {})[g.num] || '';
  const rowA = teamRow(info.A, done && res.vencedorSlot==='a', scorePillValue(res,'a'));
  const rowB = teamRow(info.B, done && res.vencedorSlot==='b', scorePillValue(res,'b'));
  let scoreArea = '';
  if(done && res.wo){
    scoreArea = `<div class="hint" style="text-align:center;">W.O.</div>`;
  } else if(done && (res.sets||[]).length > 1){
    scoreArea = `<div class="hint" style="text-align:center;">${formatSetsSummary(res.sets)}</div>`;
  }
  const metaRow = (quadra && !done) ? `<div class="match-meta-row"><div class="match-court">🏐 ${escapeHtml(quadra)}</div></div>` : '';
  return `<div class="match-card ${cardClass}">
    <div class="match-top">
      <span class="match-num">#${g.num}</span>
      <span class="chave-chip ${chip.cls}">${escapeHtml(chip.label)}</span>
      ${chip.round ? `<span class="match-round">R${chip.round}</span>` : ''}
      <span class="spacer"></span>
      ${badge}
    </div>
    ${metaRow}
    ${rowA}
    ${rowB}
    ${scoreArea}
  </div>`;
}
let pubActiveTab = {};
function setPubTab(id, tab){ pubActiveTab[id] = tab; renderPubChaveView(id); }
function renderPubChaveView(id){
  const chave = getChave(id);
  if(!chave){ location.hash='/'; return; }
  const cat = categoriaByChaveId(id);
  if(cat && !isEventoPublicado(getEvento(cat.eventoId))){ location.hash='/'; return; }
  const backHash = cat ? ('/pub/evento/'+cat.eventoId+'/'+encodeURIComponent(cat.data)) : '/';
  const games = effectiveGames(chave);
  const total = games.length;
  const done = games.filter(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot).length;
  const pct = total ? Math.round((done/total)*100) : 0;

  const order = [];
  const byFase = {};
  games.forEach(g => { if(!byFase[g.fase]){ byFase[g.fase]=[]; order.push(g.fase); } byFase[g.fase].push(g); });

  if(pubActiveTab[id] === undefined) pubActiveTab[id] = 'todas';
  const tab = pubActiveTab[id];
  const fullRanking = computeFullRanking(chave);

  const rankingLink = `<div class="ranking-link" onclick="setPubTab('${id}','__ranking__')">🏁 Ver ranking final</div>`;

  const headerExtra = `<span class="pub-badge">👁 Modo público — só leitura</span>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;

  const viewToggle = viewToggleHtml(id, true);

  if(tab === '__ranking__'){
    app.innerHTML = `
      ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (chave.modalidade==='quarteto' ? 'quartetos' : 'duplas') + ' • dupla eliminatória', backHash, headerExtra)}
      <div class="wrap">
        <div class="ranking-link" onclick="setPubTab('${id}','todas')">⬅ Voltar à lista de jogos</div>
        ${renderFinalRankingView(chave, fullRanking, total, done)}
      </div>`;
    return;
  }

  if(getViewMode() === 'arvore'){
    app.innerHTML = `
      ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (chave.modalidade==='quarteto' ? 'quartetos' : 'duplas') + ' • dupla eliminatória', backHash, headerExtra)}
      <div class="wrap">
        ${viewToggle}
        ${treeSectionHtml(chave, true)}
      </div>`;
    setTimeout(setupTreePanZoom, 0);
    return;
  }

  const standings = computeStandings(chave);
  const podium = standings.length ? `<div class="podium">
    <h3>🏆 Classificação (parcial)</h3>
    ${standings.map(r=>`<div class="podium-row"><div class="pos ${r.cls}">${r.pos}</div><div class="name">${escapeHtml(r.name)}</div></div>`).join('')}
  </div>` : '';

  const groupCard = renderGroupCard(chave);

  const sections = order.map(fase => {
    const arr = byFase[fase];
    const doneCount = arr.filter(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot).length;
    return `<div class="phase-section">
      <div class="phase-title"><span>${phaseLabel(fase)}</span><span class="count">${doneCount}/${arr.length}</span></div>
      ${arr.map(g => renderPubMatchCard(chave, g)).join('')}
    </div>`;
  }).join('');

  app.innerHTML = `
    ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (chave.modalidade==='quarteto' ? 'quartetos' : 'duplas') + ' • dupla eliminatória', backHash, headerExtra)}
    <div class="wrap">
      ${viewToggle}
      ${rankingLink}
      ${podium}
      ${groupCard}
      ${sections}
    </div>`;
}

function teamRowHasData(t, modalidade){
  if(!t) return false;
  if(modalidade === 'quarteto') return !!(t.nome && t.nome.trim()) || (t.atletas||[]).some(a => a && a.trim());
  return !!(t.atleta1 && t.atleta1.trim()) || !!(t.atleta2 && t.atleta2.trim());
}

function setModalidade(m){
  if(m === setupState.modalidade) return;
  if(setupState.times.some(t => teamRowHasData(t, setupState.modalidade)) && !confirm('Trocar a modalidade vai limpar os times já preenchidos. Continuar?')) return;
  setupState.modalidade = m;
  setupState.times = setupState.times.map(()=> emptyTeam(m));
  renderSetup(setupState._editId || '');
}
function addTeamRow(){
  setupState.times.push(emptyTeam(setupState.modalidade));
  renderSetup(setupState._editId || '');
}
function removeTeamRow(idx){
  setupState.times.splice(idx,1);
  renderSetup(setupState._editId || '');
}
function moveTeamRow(idx, dir){
  const arr = setupState.times;
  const j = idx + dir;
  if(j < 0 || j >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[j]; arr[j] = tmp;
  renderSetup(setupState._editId || '');
}
function shuffleTeams(){
  const arr = setupState.times;
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  renderSetup(setupState._editId || '');
  toast('Ordem sorteada');
}
function pickSize(n){
  const arr = setupState.times;
  if(n > arr.length){
    while(arr.length < n) arr.push(emptyTeam(setupState.modalidade));
  } else if(n < arr.length){
    const losingData = arr.slice(n).some(t => teamRowHasData(t, setupState.modalidade));
    if(losingData && !confirm('Isso vai remover times já preenchidos do final da lista. Continuar?')) return;
    setupState.times = arr.slice(0, n);
  }
  renderSetup(setupState._editId || '');
}
function autoFillTeams(){
  setupState.times.forEach((t,i) => {
    if(setupState.modalidade === 'quarteto'){
      if(!t.nome || !t.nome.trim()) t.nome = 'Time ' + (i+1);
    } else {
      if(!t.atleta1 || !t.atleta1.trim()) t.atleta1 = 'Atleta ' + (i+1) + 'A';
      if(!t.atleta2 || !t.atleta2.trim()) t.atleta2 = 'Atleta ' + (i+1) + 'B';
    }
  });
  renderSetup(setupState._editId || '');
}

// ---------- importar times de uma planilha (.xlsx/.csv) ----------
// SheetJS (~1MB) is only needed on this one screen, so it's fetched on
// demand the first time someone actually clicks "Importar planilha" instead
// of being loaded on every single page view — that unconditional <script>
// tag was adding real weight to every load, público included, for a feature
// almost nobody touches on any given visit.
let xlsxLoadPromise = null;
function ensureXlsxLoaded(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => resolve();
    s.onerror = () => { xlsxLoadPromise = null; reject(new Error('xlsx load failed')); };
    document.head.appendChild(s);
  });
  return xlsxLoadPromise;
}
function triggerImportPlanilha(){
  toast('Carregando leitor de planilha…');
  ensureXlsxLoaded()
    .then(() => document.getElementById('importPlanilhaInput').click())
    .catch(() => toast('Não consegui carregar o leitor de planilha — confira sua internet'));
}
// ---------- colar lista de times (texto simples, sem planilha) ----------
// Pra quando o Ed já tem a lista de times em mãos (mandada por WhatsApp,
// copiada de outro lugar etc.) e não quer digitar time por time nos campos
// separados. Uma linha = um time, com os "campos" dessa linha (nomes das
// pessoas — cada um podendo vir com nome e sobrenome — e, no quarteto, o
// nome do time também) separados por "/" ou por um "x" isolado (com espaço
// dos dois lados, pra não confundir com um "x" que faça parte de um nome
// como "Alex" ou "Max").
function toggleColarLista(){
  setupState._pasteOpen = !setupState._pasteOpen;
  if(!setupState._pasteOpen) setupState._pasteText = '';
  renderSetup(setupState._editId || '');
}
// Pure parser (no DOM, no setupState) so it's independently testable: one
// line in -> one team out. Every field within a line (person names — first
// + last name allowed, since we only split on "/" or a standalone " x ",
// never on internal spaces — and, for quarteto, the team name too) is
// separated the same way. Dupla: "Nome Sobrenome / Nome Sobrenome" -> Atleta
// 1 / Atleta 2 (no separator -> whole line goes to Atleta 1, Atleta 2 blank).
// Quarteto: "Nome do Time / Atleta 1 / Atleta 2 / ..." -> first field is the
// team name, the rest fill the athlete slots in order (no separator -> whole
// line is just the team name, athlete slots blank, same as before).
function parseListaTimes(text, modalidade){
  const linhas = String(text||'').split(/\r?\n/).map(l => l.trim()).filter(l => l);
  return linhas.map(linha => {
    const partes = linha.split(/\s*\/\s*|\s+x\s+/i).map(p => p.trim());
    if(modalidade === 'quarteto'){
      const nome = partes[0] || '';
      const atletas = [1,2,3,4,5,6].map(j => partes[j] || '');
      return { nome, atletas };
    }
    return { atleta1: partes[0]||'', atleta2: partes[1]||'' };
  });
}
function processarListaColada(){
  const ta = document.getElementById('colarListaInput');
  const text = (ta && ta.value) ? ta.value : (setupState._pasteText || '');
  const novosTimes = parseListaTimes(text, setupState.modalidade);
  if(!novosTimes.length){ toast('Cole a lista de times primeiro'); return; }
  setupState.times = novosTimes;
  setupState._pasteOpen = false;
  setupState._pasteText = '';
  renderSetup(setupState._editId || '');
  toast(novosTimes.length + ' times adicionados a partir da lista — confira antes de salvar');
}
// Lê a planilha inteira no navegador (via SheetJS) e tenta reconhecer colunas
// pelo cabeçalho ("Atleta 1", "Nome do time", "Categoria" etc). Se não achar
// um cabeçalho reconhecível, assume que as colunas já vêm na ordem esperada.
function normHeader(s){
  return String(s==null?'':s).trim().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'');
}
function onImportPlanilhaSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'', blankrows:false });
      importTeamsFromRows(rows);
    } catch(err){
      console.error('importPlanilha', err);
      toast('Não deu pra ler essa planilha — confira o formato (.xlsx ou .csv)');
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}
function importTeamsFromRows(rows){
  if(!rows || !rows.length){ toast('Planilha vazia'); return; }
  const headerRow = rows[0].map(normHeader);
  const looksLikeHeader = headerRow.some(h => /atleta|jogador|dupla|time|equipe|categoria|nome/.test(h));
  let dataRows = looksLikeHeader ? rows.slice(1) : rows;

  let colA1=-1, colA2=-1, colNome=-1, colCategoria=-1;
  const atletaCols = [];
  if(looksLikeHeader){
    headerRow.forEach((h,i) => {
      if(/categoria/.test(h)){ colCategoria=i; return; }
      if(/(nome do time|^equipe$|^time$|^dupla$)/.test(h)){ colNome=i; return; }
      if(/(atleta|jogador|nome)\s*1\b|^atleta$|^jogador$/.test(h)){ colA1=i; atletaCols.push(i); return; }
      if(/(atleta|jogador|nome)\s*2\b/.test(h)){ colA2=i; atletaCols.push(i); return; }
      if(/atleta|jogador/.test(h)) atletaCols.push(i);
    });
  } else {
    colA1 = 0; colA2 = 1; colNome = 0; atletaCols.push(0,1,2,3,4,5);
  }

  if(colCategoria>=0 && setupState.nome && setupState.nome.trim()){
    const wanted = normHeader(setupState.nome);
    const filtered = dataRows.filter(r => {
      const v = normHeader(r[colCategoria]);
      return v && (v.includes(wanted) || wanted.includes(v));
    });
    if(filtered.length) dataRows = filtered;
  }

  const modalidade = setupState.modalidade;
  const novosTimes = [];
  dataRows.forEach(r => {
    if(!r.some(c => String(c||'').trim())) return; // linha vazia
    if(modalidade === 'quarteto'){
      const nome = colNome>=0 ? String(r[colNome]||'').trim() : '';
      const atletas = [0,1,2,3,4,5].map(j => atletaCols[j]!==undefined ? String(r[atletaCols[j]]||'').trim() : '');
      if(nome || atletas.some(a=>a)) novosTimes.push({ nome: nome || ('Time ' + (novosTimes.length+1)), atletas });
    } else {
      const a1 = colA1>=0 ? String(r[colA1]||'').trim() : '';
      const a2 = colA2>=0 ? String(r[colA2]||'').trim() : '';
      if(a1 || a2) novosTimes.push({ atleta1:a1, atleta2:a2 });
    }
  });
  if(!novosTimes.length){ toast('Não encontrei times nessa planilha'); return; }
  setupState.times = novosTimes;
  renderSetup(setupState._editId || '');
  toast(novosTimes.length + ' times importados — confira a lista antes de salvar');
}
function saveSetup(editId){
  const s = setupState;
  const numTimes = s.times.length;
  if(!s.nome || !s.nome.trim()){ toast('Dê um nome para a categoria'); return; }
  if(!SIZES.includes(numTimes)){ toast('Ajuste o número de times para um tamanho de chave disponível'); return; }
  if(editId){
    const c = getChave(editId);
    c.nome = s.nome.trim();
    if(c.numTimes !== numTimes){
      // resize changes the bracket shape, so old results no longer line up
      c.numTimes = numTimes;
      c.resultados = {};
    }
    c.disputa3 = s.disputa3;
    c.formato = s.formato;
    c.formatoDecisivo = s.formatoDecisivo;
    c.times = s.times;
    updateChave(c);
    const existingCat = categoriaByChaveId(c.id);
    if(existingCat){ existingCat.horaInicio = s.horaInicio || null; updateCategoria(existingCat); }
    toast('Chave atualizada');
    location.hash = '/chave/' + c.id;
  } else {
    const c = {
      id: uid('c'),
      nome: s.nome.trim(),
      modalidade: s.modalidade,
      numTimes: numTimes,
      formato: s.formato,
      formatoDecisivo: s.formatoDecisivo,
      disputa3: s.disputa3,
      times: s.times,
      resultados: {},
      criadoEm: Date.now()
    };
    updateChave(c);
    const ctx = s._categoriaCtx;
    if(ctx){
      const cat = { id:uid('cat'), eventoId:ctx.eventoId, data:ctx.data, chaveId:c.id, horaInicio: s.horaInicio || null, criadoEm:Date.now() };
      updateCategoria(cat);
    }
    setupState = null;
    toast('Categoria criada!');
    location.hash = '/chave/' + c.id;
  }
}

function categorySwitcherHtml(chaveId){
  const cat = categoriaByChaveId(chaveId);
  if(!cat) return '';
  const ev = getEvento(cat.eventoId);
  if(!ev) return '';
  const dias = diasOfEvento(ev);
  let optionsHtml = '';
  dias.forEach(dia => {
    const items = categoriasOfDia(ev.id, dia);
    if(!items.length) return;
    optionsHtml += `<optgroup label="${escapeHtml(formatDiaLabel(dia))}">`;
    items.forEach(({cat:c, chave:ch}) => {
      optionsHtml += `<option value="${ch.id}" ${ch.id===chaveId?'selected':''}>${escapeHtml(ch.nome)}</option>`;
    });
    optionsHtml += `</optgroup>`;
  });
  return `<div class="cat-switcher">
    <select onchange="location.hash='/chave/'+this.value">${optionsHtml}</select>
  </div>`;
}

let activeTab = {};
function renderChaveView(id){
  const chave = getChave(id);
  if(!chave){ location.hash='/organizador'; return; }
  const backHash = chaveBackHash(id);
  const switcher = categorySwitcherHtml(id);
  const games = effectiveGames(chave);
  const total = games.length;
  const done = games.filter(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot).length;
  const pct = Math.round((done/total)*100);

  // group by phase, preserving first-appearance order
  const order = [];
  const byFase = {};
  games.forEach(g => {
    if(!byFase[g.fase]){ byFase[g.fase]=[]; order.push(g.fase); }
    byFase[g.fase].push(g);
  });

  if(activeTab[id] === undefined) activeTab[id] = 'todas';
  const tab = activeTab[id];
  const fullRanking = computeFullRanking(chave);

  const rankingLink = `<div class="ranking-link" onclick="setTab('${id}','__ranking__')">🏁 Ver ranking final</div>`;

  if(tab === '__ranking__'){
    app.innerHTML = `
      ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (chave.modalidade==='quarteto' ? 'quartetos' : 'duplas') + ' • dupla eliminatória', backHash, `
        ${switcher}
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      `)}
      <div class="wrap">
        <div class="ranking-link" onclick="setTab('${id}','todas')">⬅ Voltar à lista de jogos</div>
        ${renderFinalRankingView(chave, fullRanking, total, done)}
        <div class="footer-actions">
          <button class="btn secondary" onclick="location.hash='/editar/${chave.id}'">Editar times</button>
          <button class="btn ghost" onclick="resetResults('${chave.id}')">Zerar placares</button>
        </div>
      </div>`;
    return;
  }

  const viewToggle = viewToggleHtml(id, false);

  if(getViewMode() === 'arvore'){
    app.innerHTML = `
      ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (chave.modalidade==='quarteto' ? 'quartetos' : 'duplas') + ' • dupla eliminatória', backHash, `
        ${switcher}
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      `)}
      <div class="wrap">
        ${viewToggle}
        ${treeSectionHtml(chave, false)}
        <div class="footer-actions">
          <button class="btn secondary" onclick="location.hash='/editar/${chave.id}'">Editar duplas</button>
          <button class="btn ghost" onclick="resetResults('${chave.id}')">Zerar placares</button>
        </div>
      </div>`;
    setTimeout(setupTreePanZoom, 0);
    return;
  }

  const standings = computeStandings(chave);
  const podium = standings.length ? `<div class="podium">
    <h3>🏆 Classificação (parcial)</h3>
    ${standings.map(r=>`<div class="podium-row"><div class="pos ${r.cls}">${r.pos}</div><div class="name">${escapeHtml(r.name)}</div></div>`).join('')}
  </div>` : '';

  const groupCard = renderGroupCard(chave);

  const sections = order.map(fase => {
    const arr = byFase[fase];
    const doneCount = arr.filter(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot).length;
    return `<div class="phase-section">
      <div class="phase-title"><span>${phaseLabel(fase)}</span><span class="count">${doneCount}/${arr.length}</span></div>
      ${arr.map(g => renderMatchCard(chave, g)).join('')}
    </div>`;
  }).join('');

  app.innerHTML = `
    ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (chave.modalidade==='quarteto' ? 'quartetos' : 'duplas') + ' • dupla eliminatória', backHash, `
      ${switcher}
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    `)}
    <div class="wrap">
      ${viewToggle}
      ${rankingLink}
      ${podium}
      ${groupCard}
      ${sections}
      <div class="footer-actions">
        <button class="btn secondary" onclick="location.hash='/editar/${chave.id}'">Editar duplas</button>
        <button class="btn ghost" onclick="resetResults('${chave.id}')">Zerar placares</button>
      </div>
    </div>`;
}

function renderFinalRankingView(chave, ranking, total, done){
  const decidedCount = ranking.filter(r => !r.pending).length;
  const hasDataQuirk = ranking.some(r => r.dataQuirk);
  const allDecided = decidedCount === ranking.length;
  return `<div class="card">
    <div style="font-weight:800;font-size:14px;color:#8a5a12;margin-bottom:2px;">🏁 Classificação ${allDecided ? 'final' : '(atualiza conforme as duplas são eliminadas)'}</div>
