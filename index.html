// Compares two match results for "is this actually a different outcome"
// (ignores bookkeeping fields like lastEditedBy/lastEditedAt).
function resultadosIguais(a, b){
  if(!a || !b) return a === b;
  if(!!a.wo !== !!b.wo) return false;
  if(a.vencedorSlot !== b.vencedorSlot) return false;
  const sa = a.sets || [], sb = b.sets || [];
  if(sa.length !== sb.length) return false;
  return sa.every((s,i) => String(s[0])===String(sb[i][0]) && String(s[1])===String(sb[i][1]));
}
// Writes ONE game's result through a Firestore transaction instead of a
// blind full-chave overwrite. This is what makes it safe for 3-4
// organizadores to lançar placar at the same time: two different games in
// the same chave never clobber each other (the transaction reads-modifies-
// writes just the resultados map, retried automatically by Firestore if
// another write lands in between), and if the SAME jogo already has a
// different result from someone else, we ask before overwriting instead of
// silently replacing it. The same check runs again if this was queued while
// offline and only reaches the server later, so a stale offline edit can't
// quietly clobber a newer one either.
function salvarResultado(chaveId, gnum, novoResultado, opts){
  const force = !!(opts && opts.force);
  const ref = fbDb.collection('chaves').doc(chaveId);
  const localChave = getChave(chaveId);
  const localBackup = localChave ? Object.assign({}, localChave.resultados) : {};

  if(localChave){
    localChave.resultados = Object.assign({}, localChave.resultados, { [gnum]: novoResultado });
    clearAndamento(localChave, gnum); // um jogo com resultado não é mais "em andamento"
    renderChaveView(chaveId);
  }

  return fbDb.runTransaction(tx => tx.get(ref).then(snap => {
    if(!snap.exists) throw new Error('CHAVE_SUMIU');
    const data = snap.data();
    const resultados = Object.assign({}, data.resultados || {});
    // existing comes straight off the server document — still in the
    // Firestore-safe {a,b} wire shape, not the [a,b] tuples resultadosIguais
    // expects — normalize before comparing.
    const existing = resultados[gnum] ? Object.assign({}, resultados[gnum], { sets: setsFromFirestore(resultados[gnum].sets) }) : resultados[gnum];
    if(existing && existing.vencedorSlot && !force && !resultadosIguais(existing, novoResultado)){
      const err = new Error('CONFLICT');
      err.existing = existing;
      throw err;
    }
    resultados[gnum] = resultadoToFirestore(Object.assign({}, novoResultado, {
      lastEditedBy: (fbAuth.currentUser && fbAuth.currentUser.email) || null,
      lastEditedAt: firebase.firestore.FieldValue.serverTimestamp()
    }));
    const update = { resultados };
    if(data.andamento && data.andamento[gnum]) update['andamento.'+gnum] = firebase.firestore.FieldValue.delete();
    tx.update(ref, update);
  })).catch(err => {
    if(err && err.message === 'CONFLICT'){
      if(localChave){ localChave.resultados = localBackup; renderChaveView(chaveId); }
      const quem = err.existing.lastEditedBy || 'outra pessoa';
      if(confirm(`Esse jogo já foi lançado por ${quem}. Sobrescrever com o novo placar?`)){
        return salvarResultado(chaveId, gnum, novoResultado, { force:true });
      }
      return;
    }
    if(err && err.message === 'CHAVE_SUMIU'){
      toast('Essa chave não existe mais');
      return;
    }
    // Any other failure — a network blip, a temporarily unreachable server,
    // etc. A transação can't be queued for offline retry: Firestore
    // transactions need a live round trip and simply fail outright the
    // instant the connection hiccups, even for a couple of seconds (this is
    // documented Firestore behavior, not a bug on our side) — confirmed as
    // the actual cause of the 15/08/2026 incidente, where placares looked
    // saved on-screen (the optimistic local update above) but never reached
    // the server, and the old message here ("vai sincronizar sozinho")
    // wasn't true for this case, since nothing had been queued anywhere.
    // Falling back to a plain field update instead DOES get queued by the
    // SDK's own offline persistence and resolves itself once the connection
    // is back — no extra retry loop needed on our side. This fallback skips
    // the same-jogo conflict check (a rare simultaneous-edit collision is a
    // much smaller risk than losing the placar outright).
    console.error('salvarResultado (transação falhou, tentando gravação direta)', err);
    return salvarResultadoDireto(chaveId, gnum, novoResultado, localChave, localBackup);
  });
}

function salvarResultadoDireto(chaveId, gnum, novoResultado, localChave, localBackup){
  const ref = fbDb.collection('chaves').doc(chaveId);
  const update = {};
  update['resultados.' + gnum] = resultadoToFirestore(Object.assign({}, novoResultado, {
    lastEditedBy: (fbAuth.currentUser && fbAuth.currentUser.email) || null,
    lastEditedAt: firebase.firestore.FieldValue.serverTimestamp()
  }));
  update['andamento.' + gnum] = firebase.firestore.FieldValue.delete();
  markSyncPending(1);
  return ref.update(update).then(() => {
    markSyncPending(-1);
  }).catch(err => {
    markSyncPending(-1);
    console.error('salvarResultadoDireto', err);
    // permission-denied/unauthenticated are PERMANENT — they will never
    // resolve on their own (no amount of waiting fixes a login problem), so
    // undo the optimistic update instead of leaving a placar on screen that
    // was never actually saved anywhere, and say so plainly.
    if(err && (err.code === 'permission-denied' || err.code === 'unauthenticated')){
      if(localChave){ localChave.resultados = localBackup; renderChaveView(chaveId); }
      toast('Sem permissão pra salvar — faça login de novo');
      return;
    }
    toast('Ainda sem conexão com o servidor — vai tentar de novo sozinho em segundo plano');
  });
}

function resetResults(id){
  if(!confirm('Zerar todos os placares desta chave? Os nomes das duplas serão mantidos.')) return;
  const c = getChave(id);
  if(c) c.resultados = {};
  fbDb.collection('chaves').doc(id).update({ resultados: {} }).catch(err => {
    console.error('resetResults', err);
    toast('Não deu pra zerar agora — vai sincronizar quando a internet voltar');
  });
  renderChaveView(id);
  toast('Placares zerados');
}

// Short label used inside the fase chip on a match card — distinct from
// phaseLabel() (which is the longer text used as a section header elsewhere).
function shortPhaseChip(f){
  if(f === 'GP ÚNICO' || f === 'GRUPO') return 'Grupo';
  if(f === 'Grupo A' || f === 'Grupo B') return f;
  if(f === 'S/Final') return 'Semifinal';
  if(/^Rodada \d+$/.test(f)) return f.replace('Rodada', 'R.');
  if(/^LB Rodada \d+$/.test(f)) return 'Rep. ' + f.replace('LB Rodada', 'R.');
  return f; // "3º/4º", "Final", "5º/6º", "9º/12º", etc. are already short
}

// The colored "chave" chip (Principal / Repescagem) + round text, shown on
// every match card. Only bracket sizes whose winners/losers lineages meet
// exactly once (see computeBracketMeta) get the true Principal/Repescagem
// classification; everything else (round-robin group sizes, and the CBV-table
// sizes with several placement crossovers) shows a neutral chip with the
// game's real fase name instead, which is more informative for those anyway.
function chaveBadgeInfo(chave, g){
  const bm = computeBracketMeta(chave.numTimes);
  const info = bm.meta[g.num];
  if(bm.isClean && info){
    if(info.bracket === 'principal') return { label:'Principal', cls:'principal', round:info.round };
    if(info.bracket === 'repescagem') return { label:'Repescagem', cls:'repescagem', round:info.round };
    return { label:'Final', cls:'principal', round:info.round };
  }
  return { label: shortPhaseChip(g.fase), cls:'neutral', round: (info && !bm.isClean && bm.hasRepescagem) ? info.round : null };
}

// Single display value for a team's score pill: the set score directly for a
// single-set match, or the count of sets won for melhor-de-3 (with the
// set-by-set breakdown still available via the "editar" link below the card).
function scorePillValue(res, slot){
  if(!res || !res.vencedorSlot || res.wo) return null;
  const sets = res.sets || [];
  if(sets.length === 0) return null;
  if(sets.length === 1){
    const s = sets[0];
    return slot === 'a' ? s[0] : s[1];
  }
  let winsA = 0, winsB = 0;
  sets.forEach(s => { const a = Number(s[0])||0, b = Number(s[1])||0; if(a>b) winsA++; else if(b>a) winsB++; });
  return slot === 'a' ? winsA : winsB;
}

// ---------- Espinha de peixe (árvore) ----------
// Small tag shown above each tree box telling you where the two teams came
// from: "V7" = winner of jogo 7, "P7" = loser of jogo 7, "R3" = seed/rank 3,
// "A1" = 1º do Grupo A.
function originTag(ref){
  if(typeof ref === 'string'){
    const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
    if(m) return (m[1]==='Venc' ? 'V' : 'P') + m[2];
  }
  if(typeof ref === 'number') return 'R' + ref;
  if(ref && typeof ref === 'object' && ref.grp) return ref.grp + ref.pos;
  return '?';
}

// Which display mode the árvore should use for this chave size:
//  - 'grouped': 3-6 duplas (round-robin group phase) — group standings table
//    plus the merged bracket for whatever comes after (semis/final/etc).
//  - 'bracket': everything else — one continuous canvas laid out as two
//    mirrored halves (top/bottom) converging on the Final + 3º/4º in the
//    middle (see computeTreeCanvas / computeTreeHalves).
function treeModeFor(chave){
  const games = BRACKETS[chave.numTimes];
  return games.some(g => g.grupo) ? 'grouped' : 'bracket';
}

// Turns a "Venc J N" / "Perd J N" ref into the source game number N, or null
// for refs that don't point at another game (plain seed ranks, grupo standings).
function refGameNum(ref){
  if(typeof ref === 'string'){
    const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
    if(m) return parseInt(m[2],10);
  }
  return null;
}

// Same as refGameNum, but only matches "Venc J N" — used to decide which
// connector lines actually get drawn in the árvore. The loser's path
// ("Perd J N") still feeds the Y-position math (layoutHalfRows keeps using
// refGameNum for that) so the repescagem box still nests near its structural
// feeder, it just doesn't get a traced line — Ed only wants to visually
// follow the winner's route through the bracket.
function refWinnerGameNum(ref){
  if(typeof ref === 'string'){
    const m = /^Venc J (\d+)$/.exec(ref);
    if(m) return parseInt(m[1],10);
  }
  return null;
}

// Abbreviates the descriptive "aguardando" label resolveTeam() already
// produces for an unresolved slot ("Vencedor Jogo 7", "Perdedor Jogo 2", "1º
// do Grupo A"...) into something short enough to read inside a narrow tree
// box, e.g. "Venc jogo 7" / "Perd jogo 2". Replaces the old generic "TBD".
function treePlaceholderLabel(label){
  return (label || '')
    .replace(/^Vencedor Jogo /, 'Venc jogo ')
    .replace(/^Perdedor Jogo /, 'Perd jogo ');
}

// All non-grupo games of the chave, bucketed by their structural round
// (computeBracketMeta's "round" — longest path from a fresh seed). Shared by
// both the Y-position math and the display-column builder below so they never
// disagree on which round a game belongs to.
function computeTreeRoundBuckets(chave){
  const games = effectiveGames(chave).filter(g => !g.grupo);
  const bm = computeBracketMeta(chave.numTimes);
  const byRound = {};
  games.forEach(g => {
    const r = (bm.meta[g.num] && bm.meta[g.num].round) || 1;
    (byRound[r] = byRound[r] || []).push(g);
  });
  return { games, bm, byRound };
}

// Determines which "half" of the printed CBV-style sheet a game belongs to.
// Real double-elimination-with-full-ranking sheets aren't drawn as three
// zones (vencedores / cruzamento / repescagem) — they're drawn as TWO
// symmetric halves that each flow left-to-right and converge in the middle
// on the Final + 3º/4º dispute, with each half's OWN repescagem chain nested
// alongside its own winners' chain (not pulled into a separate zone), even
// though that chain absorbs a loser thrown over from the OTHER half partway
// through (that's how the sheet avoids a rematch too early). The rule that
// reproduces this: follow each game's WINNER forward (whichever later game
// consumes "Venc J {num}") until you land on one of the two games that feed
// the real Final directly — that tells you which half's column it prints
// in. Returns null when the chave doesn't have this shape at all (very
// small sizes where the Final is fed directly by group standings, not by
// two converging games — see n=3/4/5, handled by a simpler fallback render).
function computeTreeHalves(chave){
  const { games } = computeTreeRoundBuckets(chave);
  const finalGame = games.find(g => g.fase === 'Final');
  if(!finalGame) return null;
  const semiTop = refWinnerGameNum(finalGame.a);
  const semiBottom = refWinnerGameNum(finalGame.b);
  if(semiTop === null || semiBottom === null) return null;
  const vencForward = {};
  games.forEach(g => {
    const an = refWinnerGameNum(g.a), bn = refWinnerGameNum(g.b);
    if(an !== null) vencForward[an] = g.num;
    if(bn !== null) vencForward[bn] = g.num;
  });
  const halfOf = {};
  games.forEach(g => {
    if(g.fase === 'Final' || g.fase === '3º/4º'){ halfOf[g.num] = 'final'; return; }
    let cur = g.num, guard = 0;
    while(cur !== semiTop && cur !== semiBottom && vencForward[cur] !== undefined && guard < 500){
      cur = vencForward[cur];
      guard++;
    }
    halfOf[g.num] = cur === semiBottom ? 'bottom' : 'top';
  });
  return { halfOf, semiTop, semiBottom, finalGame };
}

// Fractional-average-then-de-collide layout (a game centers on the average
// row-unit of its two feeders; ties within the same round get pushed apart
// by at least one unit so nothing ever renders on top of another box),
// scoped to a single group of games and offset by yBase. Returns both the
// row units and the highest one used, so the caller can stack the next
// group right below this one.
function layoutRowGroup(groupGames, bm, yBase, roundOf){
  const rOf = roundOf || (gnum => (bm.meta[gnum] && bm.meta[gnum].round) || 1);
  const byRound = {};
  groupGames.forEach(g => {
    const r = rOf(g.num);
    (byRound[r] = byRound[r] || []).push(g);
  });
  const rounds = Object.keys(byRound).map(Number).sort((a,b) => a-b);
  const selected = new Set(groupGames.map(g => g.num));
  const y = {};
  rounds.forEach(r => {
    let seq = 0;
    const sorted = byRound[r].slice().sort((a,b) => a.num - b.num);
    sorted.forEach(g => {
      const pa = refGameNum(g.a), pb = refGameNum(g.b);
      const ys = [pa, pb].filter(n => n !== null && selected.has(n) && y[n] !== undefined).map(n => y[n]);
      if(ys.length) y[g.num] = ys.reduce((s,v) => s+v, 0) / ys.length;
      else y[g.num] = seq++;
    });
    // Walk the gap-enforcement pass in NUM order (not sorted by the just-
    // computed y-average) — a game whose average happens to land near an
    // earlier game's slot (e.g. a "seed 1 waits for the preliminary's
    // winner" game landing near the preliminary itself) would otherwise get
    // threaded in between lower-numbered games instead of after all of
    // them, breaking the top-to-bottom reading order within a round (Ed
    // flagged this directly on a 17-duplas árvore: jogo 9 was printed above
    // jogo 7 and 8). The y-average is still used for round 2+ boxes to bias
    // them toward sitting between their two parent boxes — this only
    // changes which row order the enforcement loop nudges them in.
    const order = sorted;
    for(let i = 1; i < order.length; i++){
      const prev = order[i-1], cur = order[i];
      if(y[cur.num] < y[prev.num] + 1) y[cur.num] = y[prev.num] + 1;
    }
  });
  let maxY = yBase - 1;
  groupGames.forEach(g => { y[g.num] += yBase; if(y[g.num] > maxY) maxY = y[g.num]; });
  return { y, maxY };
}

// Lays out one half's games: the winners' chain and the repescagem chain
// get INDEPENDENT row sequences (each starting at row 0) rather than one
// stacked below the other — because as of this version they're no longer
// sharing a column either (see computeTreeCanvas: winners sit in the LEFT
// zone, repescagem in the RIGHT zone), so there's no need to offset them
// vertically apart anymore; they just need to occupy roughly the same
// vertical band so the half reads as one coherent row on the page. The
// game that merges the two locally (classified 'crossover' by
// computeBracketMeta — this half's own semifinal-equivalent) sits wherever
// the average of its two feeders' rows naturally lands.
function layoutHalfRows(halfGames, bm, roundOf){
  const bracketOf = g => (bm.meta[g.num] || {}).bracket;
  const principal = halfGames.filter(g => bracketOf(g) !== 'repescagem' && bracketOf(g) !== 'crossover');
  const repescagem = halfGames.filter(g => bracketOf(g) === 'repescagem');
  const crossover = halfGames.filter(g => bracketOf(g) === 'crossover').slice().sort((a,b) => a.num - b.num);

  const pResult = layoutRowGroup(principal, bm, 0, roundOf);
  const rResult = layoutRowGroup(repescagem, bm, 0, roundOf);
  const y = Object.assign({}, pResult.y, rResult.y);

  let seqC = Math.max(pResult.maxY, rResult.maxY) + 1;
  crossover.forEach(g => {
    const pa = refGameNum(g.a), pb = refGameNum(g.b);
    const ys = [pa, pb].filter(n => n !== null && y[n] !== undefined).map(n => y[n]);
    y[g.num] = ys.length ? ys.reduce((s,v) => s+v, 0) / ys.length : seqC++;
  });
  const maxY = Math.max(pResult.maxY, rResult.maxY, ...crossover.map(g => y[g.num]), -1);
  return { y, maxY };
}

// Builds the full árvore canvas — reproduces the real printed sheet from
// Ed's own spec (§2, §7.1):
//   [Fase 1, 2, 3... ascending] [semifinal — Final/3º-4º stacked INSIDE it] [Perdedores N, N-1... descending]
// The winners' chain occupies the LEFT columns, the repescagem chain is
// pushed out to its OWN columns on the FAR RIGHT ("quem perde jogo fica do
// lado direito"), and both chains split into a top half and a bottom half
// (two mirrored rows) that converge on a single shared CENTER column. That
// center column holds the semifinal (a wide two-cell box — see
// treeSemiBoxHtml) for each half, plus the Final and 3º/4º dispute stacked
// between the two semifinals — Final and 3º/4º do NOT get their own
// columns; per §2 "Total de colunas = k + 1 (semifinal) + (2k−2)", the
// semifinal column is the only center column there is. Falls back to a
// single flat row (no halves/zones) for the tiny sizes where
// computeTreeHalves can't find a two-semifinal shape (n=3/4/5, where the
// Final is fed directly by group standings).
function computeTreeCanvas(chave){
  const { games, bm } = computeTreeRoundBuckets(chave);
  const byNum = {}; games.forEach(g => { byNum[g.num] = g; });
  // Prefer the game's own TRUE round number (buildDuplaCruzada's pre-poda
  // "rodada", carried straight through onto the game) over bm.meta's
  // structural depth. Depth is computed from the a/b references AFTER
  // pruning, so a game whose both seeds skipped round 1 on a bye (its
  // inputs are bare seed numbers either way) looks exactly like a genuine
  // round-1 game to depth — but it's actually scheduled alongside round 2.
  // Falls back to depth for chaves that don't carry "rodada" (the small
  // group formats, which don't use this column logic anyway).
  const roundOf = gnum => {
    const g = byNum[gnum];
    if(g && typeof g.rodada === 'number') return g.rodada;
    return (bm.meta[gnum] && bm.meta[gnum].round) || 1;
  };
  const bracketOf = gnum => (bm.meta[gnum] || {}).bracket;
  const halves = computeTreeHalves(chave);
  const yOf = {}, halfOf = {}, colOf = {};
  let numCols, crossoverCol = null, leftRounds = [], rightRounds = [];
  if(!halves){
    games.forEach((g,i) => { yOf[g.num] = i; halfOf[g.num] = 'top'; colOf[g.num] = 0; });
    numCols = 1;
  } else {
    Object.assign(halfOf, halves.halfOf);
    // A semifinal (fase 'S/Final') always renders as the wide two-cell box in
    // the shared center column (see renderTreeView), regardless of what
    // computeBracketMeta's principal/repescagem/crossover classification says
    // about it. For the cascading N>=8 format that classification always
    // agrees (a semifinal pits one undefeated side against one touched side,
    // i.e. 'crossover') — but for the small group-only formats (N=6/7,
    // semis fed directly by {grp,pos} group standings on BOTH sides) neither
    // side is "touched", so classify() calls it 'principal' like any other
    // fresh-seed game. Trusting that classification put these semis in the
    // narrow left column instead of the wide center one, sizing them for a
    // 232px-wide slot when the box itself is 387px wide — the box ended up
    // centered into negative left offsets, clipped off the canvas edge
    // (reported by Ed as cut-off names/numbers on the N=6/7 tree).
    const isCrossover = g => bracketOf(g.num) === 'crossover' || g.fase === 'S/Final';
    const principalGames = games.filter(g => halfOf[g.num] !== 'final' && !isCrossover(g) && bracketOf(g.num) !== 'repescagem');
    const crossoverGames = games.filter(g => halfOf[g.num] !== 'final' && isCrossover(g));
    const repescagemGames = games.filter(g => halfOf[g.num] !== 'final' && !isCrossover(g) && bracketOf(g.num) === 'repescagem');
    const finalGames = games.filter(g => halfOf[g.num] === 'final');

    // LEFT: winners' chain, ascending by round.
    leftRounds = Array.from(new Set(principalGames.map(g => roundOf(g.num)))).sort((a,b) => a-b);
    const leftColOf = {}; leftRounds.forEach((r,i) => { leftColOf[r] = i; });
    principalGames.forEach(g => { colOf[g.num] = leftColOf[roundOf(g.num)]; });

    // CENTER: one shared column for both semifinals AND the Final/3º-4º
    // dispute (stacked between them) — not a separate column each.
    crossoverCol = leftRounds.length;
    crossoverGames.forEach(g => { colOf[g.num] = crossoverCol; });
    finalGames.forEach(g => { colOf[g.num] = crossoverCol; });

    // RIGHT: repescagem chain, descending by round (closest-to-final round
    // sits nearest the center, earliest round sits at the far right edge) —
    // its own dedicated columns, not sharing any column with the winners.
    const rightBaseCol = crossoverCol + 1;
    rightRounds = Array.from(new Set(repescagemGames.map(g => roundOf(g.num)))).sort((a,b) => b-a);
    const rightColOf = {}; rightRounds.forEach((r,i) => { rightColOf[r] = rightBaseCol + i; });
    repescagemGames.forEach(g => { colOf[g.num] = rightColOf[roundOf(g.num)]; });

    numCols = rightBaseCol + rightRounds.length;

    const topGames = games.filter(g => halfOf[g.num] === 'top');
    const bottomGames = games.filter(g => halfOf[g.num] === 'bottom');
    const topL = layoutHalfRows(topGames, bm, roundOf);
    const bottomL = layoutHalfRows(bottomGames, bm, roundOf);
    // Row-unit gap between the top and bottom halves. 2 units is plenty of
    // real pixel room once a half has gone through a few rounds (its own
    // row-stacking already pushes the semifinal well down), but for the
    // small group-only formats (N=6/7) each half is just ONE row (the
    // semifinal itself, no earlier rounds) — 2 units of gap (204px) minus
    // the semifinal box's own height (128px) left only ~76px between the two
    // semifinal boxes, not enough to fit the Final/3º-4º box (144px tall +
    // margins) between them without genuinely overlapping one of them. Only
    // bump the gap for halves that are actually that shallow (topL.maxY < 3,
    // matching N=6/7's single-row case) — larger brackets already have
    // plenty of natural separation from their own row-stacking, so forcing
    // the same +1 there just pushed the two halves needlessly far apart
    // (flagged by Ed on a 17-duplas árvore).
    const gap = topL.maxY < 3 ? 3 : 2;
    const bottomOffset = topL.maxY + gap;
    Object.assign(yOf, topL.y);
    bottomGames.forEach(g => { yOf[g.num] = bottomL.y[g.num] + bottomOffset; });
    const midline = topL.maxY + gap/2;
    // Final and 3º/4º sit SIDE BY SIDE (spec §7.2), both vertically centered
    // between the two semifinals — same row, not stacked. The actual
    // horizontal offset between them is a rendering concern (renderTreeView
    // positions FINAL to the left and 3º/4º to the right within the shared
    // center column), so here they both just get the midline row.
    finalGames.forEach(g => { yOf[g.num] = midline; });

    // Some sizes' repescagem/placement wiring doesn't split evenly between
    // the two halves — its "Venc J" forward-chain traces almost entirely
    // into ONE half instead of two roughly mirrored streams (e.g. N=18,
    // where the structural split came out 1 game "top" vs 13 "bottom"). The
    // per-half layout above squeezes nearly the whole placement bracket into
    // one half's narrow row-band while the other half's right-side zone
    // sits almost empty — reported live, mid-tournament (21/08/2026), by Ed
    // as "todos estão na repescagem lá embaixo" (everything crammed down at
    // the bottom of the árvore). This is purely a display concern — who
    // plays whom, results and the ranking/rematch invariants never look at
    // this half split — so when it's this lopsided, override just the
    // repescagem games' rows with ONE unified sequence spread evenly across
    // the full vertical span the two halves already occupy, instead of
    // pinning them to whichever half they happened to structurally trace to.
    const topRepCount = repescagemGames.filter(g => halfOf[g.num] === 'top').length;
    const bottomRepCount = repescagemGames.filter(g => halfOf[g.num] === 'bottom').length;
    const repescagemLopsided = repescagemGames.length >= 4 && Math.min(topRepCount, bottomRepCount) <= 1;
    if(repescagemLopsided){
      const totalSpan = bottomOffset + bottomL.maxY;
      const repL = layoutRowGroup(repescagemGames, bm, 0, roundOf);
      repescagemGames.forEach(g => {
        yOf[g.num] = repL.maxY > 0 ? (repL.y[g.num] / repL.maxY) * totalSpan : totalSpan / 2;
      });
    }
  }
  const posOf = {};
  games.forEach(g => { posOf[g.num] = { col: colOf[g.num] }; });
  return { games, yOf, halfOf, posOf, numCols, crossoverCol, leftRounds, rightRounds };
}

// §9 do doc do Ed — "blocos alternados": nunca duas rodadas seguidas do mesmo
// lado, alterna chave e repescagem pra equilibrar o descanso dos dois lados.
//   bloco 1: chave r1        bloco 2: repescagem r1
//   pra r=2..k: bloco chave r ; bloco repescagem 2(r-1) ; se r<k: bloco repescagem 2r-1
//   bloco: semifinais         bloco: final + 3º lugar
// Indexado por POSIÇÃO (1ª, 2ª, 3ª rodada real presente no desenho — depois
// da poda de W.O.), não pelo número de rodada bruto, pra não deixar buraco
// se alguma rodada inteira tiver sumido por W.O.
function computeBlocoMap(k){
  const chaveBloco = {}, repBloco = {};
  let b = 1;
  chaveBloco[1] = b++;
  repBloco[1] = b++;
  for(let r = 2; r <= k; r++){
    chaveBloco[r] = b++;
    repBloco[2*(r-1)] = b++;
    if(r < k) repBloco[2*r-1] = b++;
  }
  return { chaveBloco, repBloco, semiBloco: b++, finalBloco: b++ };
}

// On a semifinal card specifically, tags each side as either "Invicto" (came
// through undefeated from the chave dos vencedores) or "Repescagem" (survived
// a loss through the repescagem) — that pairing is the whole point of the
// matchup, so it's worth making visible at a glance rather than making
// someone decode the terse "V4 x V9" origin tag.
function sfOriginLabel(chave, ref){
  const n = refGameNum(ref);
  if(n === null) return null;
  const bm = computeBracketMeta(chave.numTimes);
  const meta = bm.meta[n];
  if(!meta) return null;
  return meta.bracket === 'repescagem' ? 'Repescagem' : 'Invicto';
}

// FINAL and 3º/4º reference the two semifinals by name ("Venc. SEMI 1" /
// "Perd. SEMI 2" — spec §9.4), not by the semifinal's own jogo number, even
// though internally it's still tracked as a "Venc J N"/"Perd J N" ref like
// everywhere else. SEMI 1 is whichever semifinal has the LOWER game number
// (it's always numbered first — the bloco that holds the semifinals numbers
// the top half before the bottom half) and SEMI 2 is the other one.
function semiNumLabels(chave){
  const jogos = BRACKETS[chave.numTimes] || [];
  const semis = jogos.filter(x => x.fase === 'S/Final').sort((a,b) => a.num - b.num);
  const map = {};
  if(semis[0]) map[semis[0].num] = 'SEMI 1';
  if(semis[1]) map[semis[1].num] = 'SEMI 2';
  return map;
}
function applySemiLabel(label, semiLabels){
  if(!semiLabels) return label;
  const m = /^(Venc|Perd) jogo (\d+)$/.exec(label);
  if(!m || !semiLabels[m[2]]) return label;
  return m[1] + ' ' + semiLabels[m[2]];
}

function treeMatchBoxHtml(chave, g, top, left, width, height, readOnly, finalLabel){
  const info = matchInfo(chave, g);
  const res = chave.resultados[g.num];
  const done = !!(res && res.vencedorSlot);
  const st = matchStatus(chave, g, info, res);
  const isLive = st.key === 'andamento';
  const origin = originTag(g.a) + ' x ' + originTag(g.b);
  const isFinalOrTerceiro = g.fase === 'Final' || g.fase === '3º/4º';
  const semiLabels = isFinalOrTerceiro ? semiNumLabels(chave) : null;
  const nameA = info.A.resolved ? escapeHtml(info.A.label) : escapeHtml(applySemiLabel(treePlaceholderLabel(info.A.label), semiLabels));
  const nameB = info.B.resolved ? escapeHtml(info.B.label) : escapeHtml(applySemiLabel(treePlaceholderLabel(info.B.label), semiLabels));
  const scoreA = scorePillValue(res,'a'), scoreB = scorePillValue(res,'b');
  const winA = done && res.vencedorSlot==='a', winB = done && res.vencedorSlot==='b';
  const goHash = readOnly ? `/pub/chave/${chave.id}` : `/chave/${chave.id}`;
  const isTerceiro = g.fase === '3º/4º';
  const ribbon = finalLabel ? `<div class="tree-final-ribbon">${escapeHtml(finalLabel)}</div>` : '';
  const liveBadge = isLive ? `<span class="tree-live-badge">● AO VIVO</span>` : '';
  const quadra = (chave.quadras || {})[g.num] || '';
  const quadraBadge = quadra ? `<span class="tree-quadra-badge">🏐${escapeHtml(quadra)}</span>` : '';
  // Duas duplas empilhadas dentro do MESMO card, separadas por uma linha
  // fina — continua sendo "uma partida só" (não duas caixas soltas), mas
  // cada nome usa a largura inteira do card em vez de dividir uma linha só.
  return `<div class="tree-match ${finalLabel && !isTerceiro?'final':''} ${isTerceiro?'terceiro':''} ${isLive?'live':''}" style="top:${top}px; left:${left}px; height:${height}px; width:${width}px;" onclick="location.hash='${goHash}'">
    ${ribbon}
    <div class="tree-match-tag">
      <span class="tree-match-tag-text">${liveBadge}<span class="tree-num">#${g.num}</span> ${escapeHtml(origin)}</span>
      ${quadraBadge}
    </div>
    <div class="tree-team-block">
      <div class="tree-team-row ${winA?'win':''}"><span class="tree-tname">${nameA}</span>${scoreA!=null?'<span class="tree-score">'+escapeHtml(String(scoreA))+'</span>':''}</div>
      <div class="tree-team-row ${winB?'win':''}"><span class="tree-tname">${nameB}</span>${scoreB!=null?'<span class="tree-score">'+escapeHtml(String(scoreB))+'</span>':''}</div>
    </div>
  </div>`;
}

// Semifinal — the ONE box in the whole tree that isn't a normal squarish
// card (spec §7.1): a wide rectangle split by a vertical line into two
// cells. Left cell = the invicto side (arrives from the chave dos
// vencedores, enters the box's left border). Right cell = the repescado
// side (arrives from the repescagem, enters the right border). Each cell
// shows the fixed status line (invicto always has 0 derrotas, repescado
// always has exactly 1) plus the resolved team name once known. No line
// ever leaves this box toward the Final or 3º/4º — the box text on those
// two ("Venc. SEMI 1 x Venc. SEMI 2") already says where they come from.
function treeSemiBoxHtml(chave, g, top, left, width, height, readOnly, title){
  const info = matchInfo(chave, g);
  const res = chave.resultados[g.num];
  const done = !!(res && res.vencedorSlot);
  const st = matchStatus(chave, g, info, res);
  const isLive = st.key === 'andamento';
  const labelA = sfOriginLabel(chave, g.a);
  const aIsInvicto = labelA === 'Invicto';
  const inv = aIsInvicto
    ? { name: info.A.resolved ? escapeHtml(info.A.label) : escapeHtml(treePlaceholderLabel(info.A.label)), win: done && res.vencedorSlot==='a', score: scorePillValue(res,'a') }
    : { name: info.B.resolved ? escapeHtml(info.B.label) : escapeHtml(treePlaceholderLabel(info.B.label)), win: done && res.vencedorSlot==='b', score: scorePillValue(res,'b') };
  const rep = aIsInvicto
    ? { name: info.B.resolved ? escapeHtml(info.B.label) : escapeHtml(treePlaceholderLabel(info.B.label)), win: done && res.vencedorSlot==='b', score: scorePillValue(res,'b') }
    : { name: info.A.resolved ? escapeHtml(info.A.label) : escapeHtml(treePlaceholderLabel(info.A.label)), win: done && res.vencedorSlot==='a', score: scorePillValue(res,'a') };
  const goHash = readOnly ? `/pub/chave/${chave.id}` : `/chave/${chave.id}`;
  const liveBadge = isLive ? `<span class="tree-live-badge">● AO VIVO</span>` : '';
  const quadra = (chave.quadras || {})[g.num] || '';
  const quadraBadge = quadra ? `<span class="tree-quadra-badge">🏐${escapeHtml(quadra)}</span>` : '';
  return `<div class="tree-semi ${isLive?'live':''}" style="top:${top}px; left:${left}px; width:${width}px; height:${height}px;" onclick="location.hash='${goHash}'">
    <div class="tree-semi-title">
      <span class="tree-semi-title-text">${liveBadge}${escapeHtml(title)}</span>
      ${quadraBadge}
    </div>
    <div class="tree-semi-cells">
      <div class="tree-semi-cell inv ${inv.win?'win':''}">
        <div class="origin">${inv.name}</div>
        ${inv.score!=null?'<div class="tree-semi-score">'+escapeHtml(String(inv.score))+'</div>':''}
      </div>
      <div class="tree-semi-cell rep ${rep.win?'win':''}">
        <div class="origin">${rep.name}</div>
        ${rep.score!=null?'<div class="tree-semi-score">'+escapeHtml(String(rep.score))+'</div>':''}
      </div>
    </div>
  </div>`;
}

function renderTreeView(chave, readOnly){
  const { games, yOf, halfOf, posOf, numCols, crossoverCol, leftRounds, rightRounds } = computeTreeCanvas(chave);
  // colW is the full width reserved per round; cardW is narrower, leaving a
  // clear strip on the right of every card for connector lines to route
  // through. The semifinal's column is wider than the rest (§7.1: "a caixa
  // da semifinal tem cerca do dobro da largura de uma caixa comum") since it
  // holds one wide two-cell box per half, plus Final/3º-4º stacked between
  // them — everything else stays a normal column.
  const colW = 232, cardW = 176, rowH = 80, rowUnit = 102, padTop = 44;
  const semiW = Math.round(cardW * 2.2), semiH = Math.round(rowH * 1.6);
  // Final and 3º/4º (§7.2): side by side, ≈1.3× a normal card's width and
  // ≈1.8× its height, with a gap between them of at least half a normal
  // card's width. That pair, laid out horizontally, needs MORE room than
  // the semifinal box alone — the center column has to be wide enough for
  // whichever of the two (semifinal, or final+gap+3º/4º side by side) is
  // wider, plus a little breathing room on each side.
  const finalW = Math.round(cardW * 1.3), finalH = Math.round(rowH * 1.8);
  const finalGap = Math.round(cardW * 0.5);
  const centerColW = Math.max(semiW, finalW * 2 + finalGap) + 40;
  const hasCenter = crossoverCol !== null;
  // Whichever column ends up holding BOTH the Final and the 3º/4º box side
  // by side needs the same extra-wide treatment as the semifinal's center
  // column — not just when there's a two-semifinal halves structure feeding
  // it. The small group-only formats with disputa3 on (N=4/5: Final AND
  // 3º/4º, both fed straight off group standings, no semifinals at all —
  // computeTreeHalves bails out for these, so hasCenter/crossoverCol are
  // never set) still land both boxes in the same lone column, and a plain
  // 232px column is nowhere near enough for two ~230px-wide boxes side by
  // side — the pair got centered on a column too narrow for them and the
  // Final box landed at a large negative offset, off the left edge of the
  // canvas (reported by Ed as the tree showing just a cut-off sliver).
  const finalPairGame = games.find(g => g.fase === 'Final');
  const hasFinalPair = !!finalPairGame && games.some(g => g.fase === '3º/4º');
  const finalPairCol = hasFinalPair ? posOf[finalPairGame.num].col : null;
  function colWidthAt(c){ return (c === crossoverCol && hasCenter) || c === finalPairCol ? centerColW : colW; }
  const colX = [0];
  for(let c = 0; c < numCols; c++) colX.push(colX[c] + colWidthAt(c));
  function centeredLeft(c, w){ return colX[c] + (colWidthAt(c) - w) / 2; }

  // One simple header band at the very top of the whole canvas: just
  // "FASE DOS VENCEDORES" / "FASE DA REPESCAGEM" as plain zone titles — no
  // per-column round/bloco/stage label, and no second band above the BAIXO
  // half either.
  const HEADER_PX = hasCenter ? 26 : 0;
  function topOf(gnum){ return padTop + HEADER_PX + yOf[gnum] * rowUnit; }

  // Per-game box geometry (left/right/top/height), computed once so both the
  // box HTML and the connector lines agree on exactly where every box is —
  // semifinal boxes and Final/3º-4º share the wide center column but are
  // sized/centered differently from a normal card.
  //
  // Final/3º-4º are handled in a SECOND pass, after every semifinal box
  // already has real pixel geometry. The generic row grid (yOf * rowUnit)
  // that positions everything else assumes uniform card-sized boxes; the
  // semifinal box (128px) and Final/3º-4º box (144px) are both taller than
  // one row slot (102px), and the two halves aren't always symmetric (one
  // side's repescagem chain can be much taller than the other's), so a
  // semifinal's actual row can land much closer to the midline than the
  // generic gap heuristic assumes. Trusting that heuristic for Final/3º-4º
  // too caused them to overlap the nearer semifinal box (reported at
  // n=11). Centering Final/3º-4º in the REAL gap between the two already-
  // placed semifinal boxes' facing edges guarantees no overlap regardless.
  const geom = {};
  games.forEach(g => {
    if(g.fase === 'Final' || g.fase === '3º/4º') return;
    const col = posOf[g.num].col;
    const t = topOf(g.num);
    if(g.fase === 'S/Final'){
      const l = centeredLeft(col, semiW);
      geom[g.num] = { left:l, right:l+semiW, top:t, height:semiH, width:semiW, kind:'semi' };
    } else {
      const l = colX[col] + 8;
      geom[g.num] = { left:l, right:l+cardW, top:t, height:rowH, width:cardW, kind:'normal' };
    }
  });

  // Second pass: Final/3º-4º, vertically centered in the real pixel gap
  // between the two semifinal boxes (spec §7.2), side by side within that
  // row (§7.2 horizontal layout unchanged).
  //
  // That side-by-side offset (centerX ± finalGap/2) only makes sense when
  // BOTH boxes actually exist and get centered as a pair — it assumes the
  // Final sits centerGap to the LEFT of center because the 3º/4º is sitting
  // centerGap to the RIGHT balancing it out. Whenever only one of the two is
  // present (N=3 never has a 3º/4º game at all — 3rd place comes straight
  // from the group average per spec; and any size where the organizador
  // turned "disputar 3º lugar" off has effectiveGames() strip the 3º/4º game
  // out), the lone Final box still got shifted by that same half-gap offset
  // as if its absent partner were still there, landing it partway or fully
  // off the left edge of the canvas — reported by Ed as the tree showing
  // just a sliver of a cut-off box. A lone Final/3º-4º box centers on the
  // column instead, using the same centeredLeft() helper every other card
  // uses.
  const semiTopGame = games.find(g => g.fase === 'S/Final' && halfOf[g.num] === 'top');
  const semiBottomGame = games.find(g => g.fase === 'S/Final' && halfOf[g.num] === 'bottom');
  games.forEach(g => {
    if(g.fase !== 'Final' && g.fase !== '3º/4º') return;
    const col = posOf[g.num].col;
    const centerX = colX[col] + colWidthAt(col) / 2;
    const l = !hasFinalPair
      ? centeredLeft(col, finalW)
      : (g.fase === 'Final' ? (centerX - finalGap / 2 - finalW) : (centerX + finalGap / 2));
    let topPx;
    if(hasCenter && semiTopGame && semiBottomGame && geom[semiTopGame.num] && geom[semiBottomGame.num]){
      const bandTop = geom[semiTopGame.num].top + geom[semiTopGame.num].height;
      const bandBottom = geom[semiBottomGame.num].top;
      const bandCenter = (bandTop + bandBottom) / 2;
      const margin = 4;
      if(bandBottom - bandTop < finalH + margin * 2){
        // band too tight to fit with any margin — just center it, splitting
        // the (small) overlap evenly instead of favoring one semifinal.
        topPx = bandCenter - finalH / 2;
      } else {
        topPx = Math.max(bandTop + margin, Math.min(bandCenter - finalH / 2, bandBottom - finalH - margin));
      }
    } else {
      topPx = topOf(g.num);
    }
    geom[g.num] = { left:l, right:l+finalW, top:topPx, height:finalH, width:finalW, kind:'final' };
  });
  function connYCenter(gnum){ return geom[gnum].top + geom[gnum].height / 2; }

  // Only trace the WINNER's path ("Venc J N") — the loser's path ("Perd J N")
  // still positions boxes (via layoutHalfRows' Y-averaging, which uses
  // refGameNum for both), it just doesn't get a drawn line, so the
  // repescagem side doesn't turn into a tangle of extra connectors. Per
  // §7.1, NOTHING is drawn out of a semifinal box toward Final/3º-4º — the
  // box text on those two already says where the teams came from. Each
  // connector enters whichever edge of the destination box actually faces
  // its source (left if the source sits to the left, right if it sits to
  // the right) — that's what correctly routes both the chave's
  // left-to-right flow and the repescagem's right-to-left flow into the
  // semifinal's two different edges without any special-casing.
  function connectAuto(srcNum, dstNum){
    const src = geom[srcNum], dst = geom[dstNum];
    const enterLeft = src.left < dst.left;
    const x2 = enterLeft ? dst.left : dst.right;
    const x1 = enterLeft ? src.right : src.left;
    const y1 = connYCenter(srcNum), y2 = connYCenter(dstNum);
    const midX = Math.round((x1 + x2) / 2);
    return `<path d="M${x1},${y1} H${midX} V${y2} H${x2}" class="tree-line"/>`;
  }
  let connectors = '';
  games.forEach(g => {
    if(g.fase === 'Final' || g.fase === '3º/4º') return;
    [g.a, g.b].forEach(ref => {
      const srcNum = refWinnerGameNum(ref);
      if(srcNum && geom[srcNum]) connectors += connectAuto(srcNum, g.num);
    });
  });

  function finalRibbonFor(g){
    if(g.fase === 'Final') return 'FINAL · JOGO ' + g.num;
    if(g.fase === '3º/4º') return '3º LUGAR · JOGO ' + g.num;
    return null;
  }
  // Games render as absolutely-positioned boxes on one shared canvas (column
  // = structural round, row = position within its half) instead of being
  // grouped into column <div>s — that's what lets a top-half box and a
  // bottom-half box share the very same round/column without fighting over
  // which "zone" owns that column.
  const semiTitleOf = {};
  games.forEach(g => { if(g.fase === 'S/Final') semiTitleOf[g.num] = (halfOf[g.num] === 'top' ? 'SEMIFINAL 1' : 'SEMIFINAL 2') + ' · JOGO ' + g.num; });
  const boxesHtml = games.map(g => {
    const gm = geom[g.num];
    if(gm.kind === 'semi') return treeSemiBoxHtml(chave, g, gm.top, gm.left, gm.width, gm.height, readOnly, semiTitleOf[g.num]);
    return treeMatchBoxHtml(chave, g, gm.top, gm.left, gm.width, gm.height, readOnly, finalRibbonFor(g));
  }).join('');
  const finalNums = games.filter(g => halfOf[g.num] === 'final').map(g => g.num);
  const svgW = colX[numCols];
  const maxBottom = Math.max(0, ...games.map(g => geom[g.num].top + geom[g.num].height));
  const svgH = maxBottom + 40;
  // Dashed divider tracks the actual centered pixel position computed above
  // (not the generic row grid), so it always lines up with where Final/
  // 3º-4º really are.
  const midlineHtml = finalNums.length ?
    `<div class="tree-midline" style="top:${Math.round(finalNums.reduce((s,n)=>s+geom[n].top+geom[n].height/2,0) / finalNums.length)}px; width:${svgW}px;"></div>` : '';

  // Just the one zone title above each side — no per-column round/stage
  // label. A "QUARTAS/OITAVAS" naming per column was tried and dropped:
  // pairing repescagem rounds back-to-front doesn't line up with real
  // elimination stages (two different rounds ended up both labeled
  // "QUARTAS", two others both "OITAVAS"), so it read as wrong rather than
  // helpful. Chave columns and the center column never got a label either.
  let headersHtml = '';
  if(hasCenter){
    headersHtml = `<div class="tree-section-titles" style="top:${padTop}px; width:${svgW}px;">
      <span class="tst chave">FASE DOS VENCEDORES</span>
      <span class="tst rep">FASE DA REPESCAGEM</span>
    </div>`;
  }

  return `<div class="tree-wrap">
    <div class="tree-zoom-bar">
      <button onclick="treeZoom(-1)">−</button>
      <span id="treeZoomPct">100%</span>
      <button onclick="treeZoom(1)">+</button>
      <span class="hint">Arraste para navegar • pinça ou Ctrl+scroll pra zoom</span>
    </div>
    <div class="tree-scroll" id="treeScroll">
      <div class="tree-canvas-wrap" id="treeCanvasWrap" style="width:${svgW}px; height:${svgH}px;">
        <div class="tree-canvas" id="treeCanvas" style="width:${svgW}px; height:${svgH}px;">
          <svg class="tree-svg" width="${svgW}" height="${svgH}">${connectors}</svg>
          ${midlineHtml}
          ${headersHtml}
          ${boxesHtml}
        </div>
      </div>
    </div>
  </div>`;
}

// Zoom da árvore via CSS transform:scale (não a propriedade não-padrão
// "zoom"). O Safari do iPhone tem um bug documentado onde "zoom" escala o
// font-size na direção ERRADA (um texto de 20px com zoom:50% vira 40px em
// vez de 10px) — exatamente o que o Ed reportou: reduzindo o zoom da árvore
// no celular, o texto ficava maior que a caixinha e transbordava pra fora
// dela. transform:scale não tem esse bug e é suportado de forma consistente
// em todo navegador relevante. Como transform não redimensiona a "caixa" do
// elemento pro layout/scroll (só o visual), um wrapper com o tamanho já
// multiplicado pela escala garante que a área de rolagem acompanhe o zoom
// em vez de sobrar/faltar espaço em branco ao redor do canvas encolhido.
let treeZoomLevel = 100;
function applyTreeZoom(){
  const canvas = document.getElementById('treeCanvas');
  const wrap = document.getElementById('treeCanvasWrap');
  const pct = document.getElementById('treeZoomPct');
  const scale = treeZoomLevel / 100;
  if(canvas){
    canvas.style.transform = 'scale(' + scale + ')';
    if(wrap){
      const baseW = canvas.offsetWidth, baseH = canvas.offsetHeight;
      wrap.style.width = (baseW * scale) + 'px';
      wrap.style.height = (baseH * scale) + 'px';
    }
  }
  if(pct) pct.textContent = treeZoomLevel + '%';
}
function treeZoom(dir){
  treeZoomLevel = Math.max(40, Math.min(180, treeZoomLevel + dir*15));
  applyTreeZoom();
}
// Shared (module-level) drag state — setupTreePanZoom re-runs on every render
// of the árvore (a setTimeout(...,0) after each renderChaveView/renderPub-
// ChaveView call), which happens every time Firestore data changes while the
// árvore is on screen. dragging used to be a fresh local per call, which
// forced the mouseup cleanup listener below to also be re-registered via
// window.addEventListener on every single render — and addEventListener
// stacks handlers instead of replacing them, so a long-running session (a
// tablet left open through a whole event, exactly how Ed uses this) could
// pile up hundreds of stale listeners on window and visibly slow things down
// over time. Making dragging shared + registering the mouseup listener once
// (below, outside this function) fixes that leak.
let treeDragging = false;
function setupTreePanZoom(){
  const scrollEl = document.getElementById('treeScroll');
  if(!scrollEl) return;
  applyTreeZoom();
  scrollEl.onwheel = (e) => {
    if(!e.ctrlKey) return;
    e.preventDefault();
    treeZoom(e.deltaY < 0 ? 1 : -1);
  };
  let startX, startY, scrollLeft, scrollTop;
  scrollEl.onmousedown = (e) => { treeDragging = true; startX = e.pageX; startY = e.pageY; scrollLeft = scrollEl.scrollLeft; scrollTop = scrollEl.scrollTop; scrollEl.style.cursor = 'grabbing'; };
  scrollEl.onmousemove = (e) => {
    if(!treeDragging) return;
    scrollEl.scrollLeft = scrollLeft - (e.pageX - startX);
    scrollEl.scrollTop = scrollTop - (e.pageY - startY);
  };
  let pinchStartDist = null, pinchStartZoom = 100;
  scrollEl.ontouchstart = (e) => {
    if(e.touches.length === 2){
      pinchStartDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      pinchStartZoom = treeZoomLevel;
    }
  };
  scrollEl.ontouchmove = (e) => {
    if(e.touches.length === 2 && pinchStartDist){
      e.preventDefault();
      const dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      treeZoomLevel = Math.max(40, Math.min(180, Math.round(pinchStartZoom * (dist/pinchStartDist))));
      applyTreeZoom();
    }
  };
  scrollEl.ontouchend = (e) => { if(e.touches.length < 2) pinchStartDist = null; };
}
// Registered exactly once at script load (not inside setupTreePanZoom) —
// looks up the current #treeScroll fresh each time it fires, so it stays
// correct across re-renders without ever needing a second listener.
window.addEventListener('mouseup', () => {
  treeDragging = false;
  const scrollEl = document.getElementById('treeScroll');
  if(scrollEl) scrollEl.style.cursor = 'grab';
});

// View-mode preference (Lista/Árvore) is a device-level display choice, not

// Lista de atletas/duplas/times na ordem em que entraram no sorteio (R1 =
// cabeça de chave, R2, R3...) — pedido do Ed pra dar pro público uma aba só
// com quem está inscrito, sem precisar catar isso jogo por jogo na lista de
// confrontos ou tentar ler da árvore.
function renderAtletasListHtml(chave){
  const n = chave.times ? chave.times.length : 0;
  if(!n) return `<div class="empty"><div class="big">🧑‍🤝‍🧑</div><div style="font-weight:700;">Nenhum time cadastrado ainda</div></div>`;
  const isQuarteto = chave.modalidade === 'quarteto';
  const rows = Array.from({length:n}, (_,i) => {

    if(isQuarteto){
      const nomeTime = (t.nome||'').trim() || teamLabel(chave, i) || 'A definir';

function treeSectionHtml(chave, readOnly){
  const mode = treeModeFor(chave);
  if(mode === 'grouped'){
    const groupCard = renderGroupCard(chave);

function renderMatchCard(chave, g){
  const info = matchInfo(chave, g);
  const res = chave.resultados[g.num];
  const done = !!(res && res.vencedorSlot);
  const st = matchStatus(chave, g, info, res);
  const cardClass = done ? 'done' : (st.key==='andamento' ? 'live-now' : (st.key==='proximo' ? 'live-now' : 'pending'));
  const badge = `<span class="match-badge ${st.cls}">${st.label}</span>`;
  const chip = chaveBadgeInfo(chave, g);
  const quadra = (chave.quadras || {})[g.num] || '';

  const rowA = teamRow(info.A, done && res.vencedorSlot==='a', scorePillValue(res,'a'), !info.ready && info.A.resolved && !info.B.resolved);
  const rowB = teamRow(info.B, done && res.vencedorSlot==='b', scorePillValue(res,'b'), !info.ready && info.B.resolved && !info.A.resolved);

  let scoreArea = '';
  if(info.ready && !done){
    scoreArea = scoreEntryHtml(chave, g);
  } else if(done && !res.wo){
    scoreArea = `<div class="hint" style="text-align:center;">${formatSetsSummary(res.sets)} · <span style="text-decoration:underline;cursor:pointer;" onclick="editMatch('${chave.id}',${g.num})">editar</span></div>`;
  } else if(done && res.wo){
    scoreArea = `<div class="hint" style="text-align:center;">W.O. · <span style="text-decoration:underline;cursor:pointer;" onclick="editMatch('${chave.id}',${g.num})">editar</span></div>`;
  }

  // Quadra por nome (Ed, 21/08/2026): se o evento tem quadras cadastradas
  // (organizador → editar evento), troca o campo numérico por uma lista com
  // os nomes; sem nenhuma cadastrada, mantém o campo antigo (número livre)
  // pra não quebrar quem ainda não configurou nada.
  const _cat = categoriaByChaveId(chave.id);
  const _ev = _cat ? getEvento(_cat.eventoId) : null;
  const quadraNomes = ((_ev && _ev.quadrasNomes) || []).map(normQuadraNome).map(q => q.nome).filter(Boolean);
  let quadraField;
  if(!done){
    if(quadraNomes.length){
      const opts = quadraNomes.slice();
      if(quadra && !opts.includes(quadra)) opts.push(quadra); // preserva valor antigo que não está mais na lista
      quadraField = `<div class="match-court">🏐
        <select onchange="setQuadra('${chave.id}',${g.num},this.value)">
          <option value="">Selecionar…</option>
          ${opts.map(nome => `<option value="${escapeHtmlAttr(nome)}" ${nome===quadra ? 'selected' : ''}>${escapeHtml(nome)}</option>`).join('')}
        </select>
      </div>`;
    } else {
      quadraField = `<div class="match-court">🏐 Quadra <input type="number" inputmode="numeric" min="1" placeholder="nº" value="${escapeHtmlAttr(quadra)}" onchange="setQuadra('${chave.id}',${g.num},this.value)"></div>`;
    }
  } else {
    quadraField = quadra ? `<div class="match-court">🏐 Quadra ${escapeHtml(quadra)}</div>` : '';
  }
  const andamentoBtn = (!done && info.ready) ? `<button class="andamento-btn ${st.key==='andamento'?'on':''}" onclick="toggleAndamento('${chave.id}',${g.num})">${st.key==='andamento' ? '⏸ Encerrar' : '▶ Iniciar jogo'}</button>` : '';
  const metaRow = (quadraField || andamentoBtn) ? `<div class="match-meta-row">${quadraField}${andamentoBtn}</div>` : '';

  return `<div class="match-card ${cardClass}">
    <div class="match-top">
      <span class="match-num">#${g.num}</span>
      <span class="chave-chip ${chip.cls}">${escapeHtml(chip.label)}</span>
      ${chip.round ? `<span class="match-round">R${chip.round}</span>` : ''}
      <span class="spacer"></span>
      ${badge}
    </div>
    ${metaRow}
    ${rowA}
    ${rowB}
    ${scoreArea}
  </div>`;
}

// "waiting" (Ed, 21/08/2026): a dupla já se classificou pra essa fase (nome
// resolvido, não é mais "Vencedor Jogo X"), mas o jogo ainda não está
// formado porque o OUTRO lado ainda depende de outro resultado — ela fica
// "parada" esperando adversário. Deixa o nome em negrito nesse caso pra
// facilitar localizar rapidinho quem já avançou e está só esperando.
function teamRow(t, isWinner, scoreVal, waiting){
  const cls = 'team-row' + (!t.resolved ? ' placeholder' : '') + (isWinner ? ' winner' : '') + (waiting ? ' waiting-opponent' : '');
  const pill = (scoreVal !== null && scoreVal !== undefined && scoreVal !== '') ? `<span class="score-pill">${escapeHtml(String(scoreVal))}</span>` : '';
  return `<div class="${cls}">
    <div class="tname">${escapeHtml(t.label)}</div>
    ${pill}
  </div>`;
}

function formatSetsSummary(sets){
  if(!sets || !sets.length) return 'Sem placar registrado';
  return sets.map(s => `${s[0]}-${s[1]}`).join(', ');
}

// transient UI state for score entry per game
const setInputs = {};
function scoreEntryHtml(chave, g){
  const fmt = formatForGame(chave, g);
  const key = chave.id+'_'+g.num;
  if(!setInputs[key]) setInputs[key] = { sets: fmt==='unico' ? [['','']] : [['',''],['','']] };
  const st = setInputs[key];
  const nSets = st.sets.length;
  const setsRows = st.sets.map((s,i)=>`
    <div style="display:flex; align-items:center; gap:8px; margin-top:6px;">
      <span style="font-size:12px; color:var(--muted2); width:38px;">Set ${i+1}</span>
      <input class="score-in" type="number" inputmode="numeric" min="0" placeholder="0" value="${s[0]}" oninput="setInputs['${key}'].sets[${i}][0]=this.value">
      <span style="color:var(--muted2);">x</span>
      <input class="score-in" type="number" inputmode="numeric" min="0" placeholder="0" value="${s[1]}" oninput="setInputs['${key}'].sets[${i}][1]=this.value">
    </div>`).join('');

  const canAddSet = fmt==='melhorDe3' && nSets < 3;
  const fmtNote = DECISIVE_FASES.has(g.fase) ? `<div class="hint" style="margin-top:6px;">Fase decisiva · ${fmt==='melhorDe3' ? 'melhor de 3 sets' : 'set único'}</div>` : '';

  return `<div style="margin-top:8px; border-top:1px dashed var(--border); padding-top:8px;">
    ${setsRows}
    ${canAddSet ? `<div style="text-align:center; margin-top:6px;"><span style="font-size:12px; color:var(--primary); text-decoration:underline; cursor:pointer;" onclick="addSetRow('${key}','${chave.id}',${g.num})">+ adicionar set</span></div>` : ''}
    <div class="match-actions">
      <button class="btn small" style="flex:1;" onclick="confirmScore('${chave.id}',${g.num})">Confirmar placar</button>
    </div>
    <div class="wo-link" onclick="woMatch('${chave.id}',${g.num})">Registrar sem placar (W.O.)</div>
    ${fmtNote}
  </div>`;
}
function addSetRow(key, chaveId, gnum){
  setInputs[key].sets.push(['','']);
  renderChaveView(chaveId);
}
function confirmScore(chaveId, gnum){
  const chave = getChave(chaveId);
  const g = BRACKETS[chave.numTimes].find(x => x.num === gnum);
  const fmt = formatForGame(chave, g);
  const key = chaveId+'_'+gnum;
  const st = setInputs[key];
  const sets = st.sets.filter(s => s[0]!=='' || s[1]!=='');
  if(sets.length === 0){ toast('Preencha o placar'); return; }
  for(const s of sets){
    if(s[0]==='' || s[1]===''){ toast('Preencha os dois placares do set'); return; }
    if(parseInt(s[0],10) === parseInt(s[1],10)){ toast('Não pode haver empate no set'); return; }
  }
  const winner = computeMatchWinner(fmt, sets);
  if(!winner){ toast(fmt==='melhorDe3' ? 'Ainda não há vencedor (adicione mais um set)' : 'Preencha o placar'); return; }
  const resultado = { sets: sets.map(s=>[parseInt(s[0],10), parseInt(s[1],10)]), vencedorSlot: winner, wo:false };
  delete setInputs[key];
  salvarResultado(chaveId, gnum, resultado);
  toast('Placar salvo');
}
function woMatch(chaveId, gnum){
  const chave = getChave(chaveId);
  const g = BRACKETS[chave.numTimes].find(x=>x.num===gnum);
  const info = matchInfo(chave, g);
  const choice = prompt(`W.O. — quem venceu?\nDigite "A" para ${info.A.label}\nDigite "B" para ${info.B.label}`);
  if(!choice) return;
  const slot = choice.trim().toUpperCase() === 'A' ? 'a' : (choice.trim().toUpperCase()==='B' ? 'b' : null);
  if(!slot){ toast('Opção inválida'); return; }
  // W.O. ainda precisa de um placar convencional pra entrar certo no average da fase de grupos.
  const fmt = formatForGame(chave, g);
  const setWO = slot === 'a' ? [21,0] : [0,21];
  const sets = fmt === 'melhorDe3' ? [setWO, setWO] : [setWO];
  salvarResultado(chaveId, gnum, { sets, vencedorSlot: slot, wo:true });
  toast('W.O. registrado');
}
function editMatch(chaveId, gnum){
  const chave = getChave(chaveId);
  if(!confirm('Editar este resultado? Isso pode afetar os jogos seguintes que dependem dele.')) return;
  if(chave){
    const r = Object.assign({}, chave.resultados);
    delete r[gnum];
    chave.resultados = r;
    renderChaveView(chaveId);
  }
  fbDb.collection('chaves').doc(chaveId).update({ ['resultados.'+gnum]: firebase.firestore.FieldValue.delete() }).catch(err => {
    console.error('editMatch', err);
    toast('Não deu pra apagar agora — vai sincronizar quando a internet voltar');
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeHtmlAttr(str){ return escapeHtml(str||''); }

route();
</script>
</body>
</html>
