  // Resolução estrutural de bye: se um lado acaba em BYE não depende de quem
  // ganha um jogo real (só da posição dos seeds), então dá pra calcular antes
  // de qualquer partida ter sido jogada — regra da PODA (§3.1 da spec).
  const effCache = {};
  function effective(ref){
    const key = ref.type + ':' + ref.val;
    if(effCache[key]) return effCache[key];
    let result;
    if(ref.type === 'seed'){
      result = ref.val <= N ? { type:'seed', val:ref.val } : { type:'bye' };
    } else {
      const g = byId[ref.val];
      const aEff = effective(g.a), bEff = effective(g.b);
      if(ref.type === 'V'){
        if(aEff.type === 'bye' && bEff.type === 'bye') result = { type:'bye' };
        else if(aEff.type === 'bye') result = bEff;
        else if(bEff.type === 'bye') result = aEff;
        else result = { type:'gameWinner', id:g.id };
      } else {
        if(aEff.type === 'bye' || bEff.type === 'bye') result = { type:'bye' };
        else result = { type:'gameLoser', id:g.id };
      }
    }
    effCache[key] = result;
    return result;
  }
  function isReal(g){
    return effective(g.a).type !== 'bye' && effective(g.b).type !== 'bye';
  }

  // Cada rodada da repescagem é uma rodada de eliminação e decide uma faixa
  // da classificação final. Andando da última rodada pra primeira, cada jogo
  // REAL daquela rodada (CIMA e BAIXO juntos) consome uma posição.
  const repescagemGames = [].concat(repCima.games, repBaixo.games);
  const roundsDesc = Array.from(new Set(repescagemGames.map(g => g.rodada))).sort((a,b) => b - a);
  const faixaByRound = {};
  let proxima = 5;
  roundsDesc.forEach(r => {
    const reais = repescagemGames.filter(g => g.rodada === r && isReal(g));
    if(reais.length){
      faixaByRound[r] = [proxima, proxima + reais.length - 1];
      proxima += reais.length;
    }
  });
  function faseFor(g){
    if(g.fase === 'CHAVE') return 'GRUPO';
    if(g.fase === 'SEMIFINAL') return 'S/Final';
    if(g.fase === 'FINAL') return 'Final';
    if(g.fase === 'TERCEIRO') return '3º/4º';
    const f = faixaByRound[g.rodada];
    return f[0] === f[1] ? (f[0] + 'º') : (f[0] + 'º/' + f[1] + 'º');
  }

  // PODA + NUMERAÇÃO EM CASCATA (§9): os jogos são numerados 1, 2, 3... na
  // ordem OFICIAL do calendário, não na ordem em que foram construídos acima.
  // Essa ordem agrupa os jogos em "blocos" (cada bloco = uma rodada inteira),
  // na sequência fixa da §9.1:
  //   bloco 1: chave r1        bloco 2: chave r2
  //   bloco 3: repescagem r1   bloco 4: repescagem r2 (recepção)
  //   pra r = 3..k: chave rR, repescagem r(2r-3) (sobreviventes),
  //                 repescagem r(2r-2) (recepção)
  //   bloco: semifinais        bloco: final + disputa de 3º
  // Dentro de cada bloco (§9.2), primeiro todos os jogos do grupo de CIMA,
  // depois todos os do grupo de BAIXO, na ordem vertical em que foram
  // construídos (§9.2) — e, dentro disso (§9.3), os jogos cujos dois lados
  // já são nomes conhecidos (seeds, incl. quem passou por bye) vêm ANTES dos
  // que ainda dependem do resultado de outro jogo ("Venc./Perd. jogo X"),
  // cada um dos dois grupos preservando essa mesma ordem cima-depois-baixo.
  // Um bloco sem nenhum jogo REAL (ex.: repescagem r1 pode ser todo W.O. em
  // chaves pequenas) simplesmente não numera nada e a cascata segue pro
  // próximo bloco — não deixa buraco na numeração nem precisa de caso
  // especial.
  const k = chaveCima.roundsIds.length; // === chaveBaixo.roundsIds.length
  const blocoDescs = [
    { fase:'CHAVE', rodada:1 },
    { fase:'CHAVE', rodada:2 },
    { fase:'REPESCAGEM', rodada:1 },
    { fase:'REPESCAGEM', rodada:2 },
  ];
  for(let r = 3; r <= k; r++){
    blocoDescs.push({ fase:'CHAVE', rodada:r });
    blocoDescs.push({ fase:'REPESCAGEM', rodada: 2*r - 3 });
    blocoDescs.push({ fase:'REPESCAGEM', rodada: 2*r - 2 });
  }
  function gamesForBloco(desc){
    const cima = desc.fase === 'CHAVE' ? chaveCima.games : repCima.games;
    const baixo = desc.fase === 'CHAVE' ? chaveBaixo.games : repBaixo.games;
    return [].concat(
      cima.filter(g => g.rodada === desc.rodada),
      baixo.filter(g => g.rodada === desc.rodada)
    );
  }

  let novoNum = 0;
  const novoNumPorId = {};
  const out = [];
  function formatRef(eff){
    if(eff.type === 'seed') return eff.val;
    if(eff.type === 'gameWinner') return 'Venc J ' + novoNumPorId[eff.id];
    return 'Perd J ' + novoNumPorId[eff.id];
  }
  // "Pronto" (§9.3) isn't just "both sides are literal seeds" — a game that
  // depends on another REAL game is only as ready as whichever of its two
  // inputs took the LONGEST to become knowable. blocoOfId tracks which
  // bloco each already-numbered real game landed in; a seed (or a bye
  // resolved all the way down to one) is available immediately (bloco 0).
  // Sorting each bloco's games by that "latest-resolved input" bloco index
  // (ascending, ties broken by the natural cima-then-baixo cascade order)
  // reproduces the official example exactly — including the subtler case
  // where two repescagem "sobreviventes" games are equally un-fed-by-seeds
  // but one of them additionally waits on ANOTHER repescagem game (a later
  // bloco) while the other only traces back to chave games (an earlier
  // bloco): the one anchored to the earlier bloco goes first.
  const blocoOfId = {};
  let blocoCounter = 0;
  function numerarBloco(blocoGames){
    blocoCounter++;
    const myBloco = blocoCounter;
    const reais = blocoGames.filter(isReal);
    function readinessBloco(g){
      const aE = effective(g.a), bE = effective(g.b);
      const ka = aE.type === 'seed' ? 0 : blocoOfId[aE.id];
      const kb = bE.type === 'seed' ? 0 : blocoOfId[bE.id];
      return Math.max(ka, kb);
    }
    const ordenados = reais
      .map((g, i) => ({ g, i, key: readinessBloco(g) }))
      .sort((x, y) => (x.key - y.key) || (x.i - y.i))
      .map(x => x.g);
    ordenados.forEach(g => {
      novoNum++;
      novoNumPorId[g.id] = novoNum;
      blocoOfId[g.id] = myBloco;
      // rodada carries the TRUE (pre-poda) round number — a game whose seeds
      // both arrived via bye (e.g. "#4 x #5" when 4 and 5 both skipped round
      // 1) looks structurally identical to a genuine round-1 game once
      // pruned (both inputs are bare seed numbers either way), but it isn't
      // played at the same time: it's scheduled alongside round 2. Keeping
      // the real round here is what lets the árvore column the two
      // correctly instead of aliasing them together.
      out.push({ fase: faseFor(g), num: novoNum, a: formatRef(effective(g.a)), b: formatRef(effective(g.b)), rodada: g.rodada });
    });
  }
  blocoDescs.forEach(desc => numerarBloco(gamesForBloco(desc)));
  numerarBloco([sfCima, sfBaixo]);
  numerarBloco([final, terceiro]);
  return out;
}
// buildDuplaCruzada() generates a mathematically standard bracket seeding
// (the textbook recursive 1-vs-2^N pattern: seed 1 always paired against the
// theoretical bottom seed, 2 against the next, etc.) — that's NOT the same
// pairing convention as the official CBV draw sheets extracted into
// brackets.json for N=4,5,7-26 (confirmed against a real 17-duplas reference
// sheet on 16/08/2026: the live game 1 was seed 16 x 17, but the official
// sheet has seed 17 x 14, with seed 2 meeting seed 16 — a different,
// non-formulaic seeding chart, not reproducible by a simple recursive rule).
// brackets.json is authoritative for every size from 8 to 30 (confirmed
// against N=17's real reference sheet, and N=11's too — matches the earlier
// byte-for-byte audit). It used to have known problems for 15,19,20,24,25,26
// (broken ranking coverage) and no entries at all for 27-30, both patched at
// runtime with buildDuplaCruzada() below. Ed flagged (20/08/2026, the day
// before a real tournament) that N=11's repescagem could reunite a dupla with
// the SAME opponent it had already lost to earlier ("o perdedor não está
// invertendo") — auditing every size the same way found the identical bug
// (a placement-round game reuniting a pair that already played) baked into
// MANY sizes, brackets.json AND buildDuplaCruzada alike (buildDuplaCruzada's
// own "anti-revanche" reversal heuristic only reliably protects the
// semifinal, not the 9º/12º-7º/8º-5º/6º placement rounds). Every size 8-30
// was re-solved (search_fix.js: local search over which loser/winner lands in
// which placement-round slot, keeping game numbers and every other structural
// invariant fixed) so NO two duplas ever meet twice under realistic results,
// and the fixed tables were baked directly into brackets.json — so
// buildDuplaCruzada is no longer called for any size at build time.
const TABELA_OFICIAL_COM_PROBLEMA = new Set([]);
TABELA_OFICIAL_COM_PROBLEMA.forEach(n => { BRACKETS[n] = buildDuplaCruzada(n); });

const SIZES = Object.keys(BRACKETS).map(Number).sort((a,b)=>a-b);

const PHASE_LABELS = {
  "GP ÚNICO":"Grupo único (todos x todos)",
  "GRUPO":"Fase de grupos / chave",
  "Grupo A":"Grupo A",
  "Grupo B":"Grupo B",
  "S/Final":"Semifinal",
  "3º/4º":"Disputa 3º / 4º lugar",
  "Final":"Final",
};
function phaseLabel(f){
  if(PHASE_LABELS[f]) return PHASE_LABELS[f];
  if(/^Rodada \d+$/.test(f)) return 'Chave — ' + f;
  if(/^LB Rodada \d+$/.test(f)) return 'Repescagem — ' + f.replace('LB ','');
  return "Colocação " + f;
}

// Structural classification: which games belong to the "Chave dos Vencedores"
// (principal) vs the "Chave de Repescagem" (losers bracket) vs are the single
// merge point ("final"). This is derived purely from the a/b references — a
// game is tainted "repescagem" the moment any input traces back to a "Perd J N"
// (loser-of) reference; "Venc J N" (winner-of) inherits its source game's
// classification; a plain rank number or {grp,pos} group standing is a fresh
// seed (principal). A game whose two inputs disagree (one principal-lineage,
// one repescagem-lineage) is the merge/"final" game. This works uniformly for
// the hand-built tables (3-6), the extracted spreadsheet tables (7-26) and the
// generated tables (27-30) without trusting any fase label text — those vary a
// lot between sources (see brackets.json vs generateDoubleElim's "Rodada N").
// "round" is the longest structural path from a fresh seed, used as the column
// a game belongs to in the árvore (tree) view.
const bracketMetaCache = {};
function computeBracketMeta(numTimes){
  if(bracketMetaCache[numTimes]) return bracketMetaCache[numTimes];
  const games = BRACKETS[numTimes];
  const byNum = {};
  games.forEach(g => { byNum[g.num] = g; });
  const memo = {};

  // "touched" = this survivor's lineage has a loss somewhere in its history
  // (fresh rank seeds / group standings are untouched; the winner side of a
  // "Perd J N" reference is always touched; the winner of "Venc J N" inherits
  // whatever that source game already was).
  function touched(gnum){
    if(memo[gnum] && memo[gnum].touched !== undefined) return memo[gnum].touched;
    const g = byNum[gnum];
    const inputTouched = (ref) => {
      if(typeof ref === 'string'){
        const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
        if(m) return m[1] === 'Perd' ? true : touched(parseInt(m[2], 10));
      }
      return false; // rank number or {grp,pos}: fresh seed, never lost
    };
    const t = inputTouched(g.a) || inputTouched(g.b);
    memo[gnum] = Object.assign(memo[gnum] || {}, { touched: t });
    return t;
  }

  function classify(gnum){
    const g = byNum[gnum];
    const sideTouched = (ref) => {
      if(typeof ref === 'string'){
        const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
        if(m) return m[1] === 'Perd' ? true : touched(parseInt(m[2], 10));
      }
      return false;
    };
    const ta = sideTouched(g.a), tb = sideTouched(g.b);
    if(!ta && !tb) return 'principal';       // both sides still fully undefeated
    if(ta && tb) return 'repescagem';        // both sides already carry a loss
    return 'crossover';                       // one undefeated side meets one touched side
  }

  function depth(gnum){
    if(memo[gnum] && memo[gnum].depth !== undefined) return memo[gnum].depth;
    const g = byNum[gnum];
    const inputDepth = (ref) => {
      if(typeof ref === 'string'){
        const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
        if(m) return depth(parseInt(m[2], 10));
      }
      return 0;
    };
    const d = 1 + Math.max(inputDepth(g.a), inputDepth(g.b));
    memo[gnum] = Object.assign(memo[gnum] || {}, { depth: d });
    return d;
  }

  games.forEach(g => { touched(g.num); depth(g.num); });
  const meta = {};
  games.forEach(g => { meta[g.num] = { bracket: classify(g.num), round: memo[g.num].depth }; });
  const crossovers = games.filter(g => meta[g.num].bracket === 'crossover');
  const hasRepescagem = games.some(g => meta[g.num].bracket === 'repescagem' || meta[g.num].bracket === 'crossover');
  // "clean" = the two lineages only ever meet once (the real grand final) — only
  // then does a strict "Chave dos Vencedores" / "Chave de Repescagem" 2-view
  // split make sense. Sizes with several crossover/placement games throughout
  // (common in the CBV-style tables for 7-26) don't decompose that way.
  const isClean = hasRepescagem && crossovers.length === 1;
  const result = { meta, hasRepescagem, isClean, crossovers: crossovers.map(g=>g.num) };
  bracketMetaCache[numTimes] = result;
  return result;
}

// Semifinal, final and the 3rd-place dispute can use a different set format
// (e.g. melhor de 3) than the rest of the chave (e.g. set único).
const DECISIVE_FASES = new Set(['S/Final', 'Final', '3º/4º']);
function formatForGame(chave, g){
  if(DECISIVE_FASES.has(g.fase)) return chave.formatoDecisivo || chave.formato;
  return chave.formato;
}

// ---------- Firestore-backed data layer ----------
// eventos/categorias/chaves now live in Firestore. Realtime listeners
// (onSnapshot) mirror each collection into a plain in-memory array below, so
// every load*/get* function stays a synchronous read exactly like it was with
// localStorage — only update*/delete* now also fire off a Firestore write.
// The local array is updated optimistically (immediately) on every write so
// the screen right after saving always shows fresh data without waiting for
// a round trip; the listener then reconciles it with whatever the server
// confirms (which is what makes multi-organizador sync actually show up).
let _chavesCache = [];
let _eventosCache = [];
let _categoriasCache = [];
// Config geral do site (não é por evento) — hoje só guarda a logo de fundo
// do menu principal. Um único documento fixo (config/geral) em vez de uma
// coleção, porque só existe essa configuração por enquanto.
let _configCache = { menuBgUrl: null };

// Firestore flatly rejects any field that's a nested array — an array whose
// elements are themselves arrays, like sets:[[21,15]] — with "Nested arrays
// are not supported". Every placar in this app has always been stored that
// way, which means every write of a real score has been rejected by the
// REAL Firestore backend since day one (confirmed live on 16/08/2026: the
// optimistic local update made it LOOK saved on screen, but nothing ever
// reached the server — this, not connection quality, is the actual cause of
// the 15/08/2026 incidente). Fixed by storing each set as a plain {a,b}
// object on the wire (Firestore-safe) and converting back to the [a,b]
// tuple every other part of the app already expects (UI, average calc,
// tree view, W.O., conflict comparison) the instant it's read back — only
// these two functions and the write boundary below need to know about the
// wire format.
function setsToFirestore(sets){
  return (sets || []).map(s => ({ a: s[0], b: s[1] }));
}
function setsFromFirestore(sets){
  return (sets || []).map(s => Array.isArray(s) ? s : [s.a, s.b]);
}
function resultadoToFirestore(res){
  if(!res) return res;
  return Object.assign({}, res, { sets: setsToFirestore(res.sets) });
}
function normalizeChaveFromFirestore(chave){
  if(chave.resultados){
    const conv = {};
    Object.keys(chave.resultados).forEach(k => {
      const r = chave.resultados[k];
      conv[k] = r ? Object.assign({}, r, { sets: setsFromFirestore(r.sets) }) : r;
    });
    chave.resultados = conv;
  }
  return chave;
}

// Assina (ou reassina) os três listeners em tempo real. route() roda a cada
// snapshot, então qualquer tela aberta (organizador OU público) já deveria
// se atualizar sozinha sem precisar de navegação — mas o Ed relatou que no
// modo público, quem está assistindo precisa voltar pro menu e abrir a
// categoria de novo pra ver o que mudou. Isso bate com um problema conhecido
// de navegadores mobile: ao trocar de app ou trancar a tela, a conexão em
// tempo real do Firestore (WebSocket/long-polling) pode ficar "adormecida" e
// não se recupera sozinha quando a pessoa volta — o app continua mostrando
// o último estado que tinha antes de ir pro segundo plano. Cancelar os
// listeners antigos e assinar de novo força uma reconexão limpa (que já
// dispara um snapshot fresco na hora), sem precisar trocar de tela nem
// perder o lugar onde a pessoa estava.
let _liveUnsubs = [];
function attachLiveListeners(){
  _liveUnsubs.forEach(unsub => { try{ unsub(); }catch(e){} });
  _liveUnsubs = [];
  _liveUnsubs.push(fbDb.collection('chaves').onSnapshot(snap => {
    _chavesCache = snap.docs.map(d => normalizeChaveFromFirestore(Object.assign({ id: d.id }, d.data())));
    route();
  }, err => { console.error('chaves onSnapshot', err); toast('Sem conexão com o servidor'); }));
  _liveUnsubs.push(fbDb.collection('eventos').onSnapshot(snap => {
    _eventosCache = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    route();
  }, err => console.error('eventos onSnapshot', err)));
  _liveUnsubs.push(fbDb.collection('categorias').onSnapshot(snap => {
    _categoriasCache = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    route();
  }, err => console.error('categorias onSnapshot', err)));
  // 'config' é uma coleção com um único documento fixo ('geral') — usa o
  // mesmo onSnapshot em nível de coleção que chaves/eventos/categorias já
  // usam (em vez de doc().onSnapshot(), que a mesma API do Firestore
  // suporta, mas mantém tudo no mesmo padrão testado nas outras 3).
  _liveUnsubs.push(fbDb.collection('config').onSnapshot(snap => {
    const geral = snap.docs.find(d => d.id === 'geral');
    _configCache = Object.assign({ menuBgUrl:null }, geral ? geral.data() : {});
    route();
  }, err => console.error('config onSnapshot', err)));
}
attachLiveListeners();
// Reabre os listeners quando a aba volta a ficar visível (troca de app,
// desbloqueio de tela), quando a página volta do bfcache do Safari
// (event.persisted — não roda o script de novo do zero, só "acorda" o que já
// estava congelado) e quando a conexão de rede volta depois de cair.
if(typeof document !== 'undefined' && document.addEventListener){
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') attachLiveListeners(); });
}
if(typeof window !== 'undefined' && window.addEventListener){
  window.addEventListener('pageshow', (e) => { if(e && e.persisted) attachLiveListeners(); });
  window.addEventListener('online', attachLiveListeners);
}
// Botão manual "🔄 Atualizar" no modo público — reforça a reconexão
// automática acima pra quem quiser ter certeza que está vendo o mais
// recente, sem sair da tela onde está.
function manualRefreshPub(){
  attachLiveListeners();
  toast('Atualizado');
}
// Logo de fundo do menu principal — configuração do SITE inteiro (não é por
// evento), editável pelo próprio organizador na tela de eventos, sem
// precisar mandar arquivo pra ninguém. Aparece como marca d'água atrás da
// lista de eventos, tanto na tela do organizador quanto na pública.
function getConfig(){ return _configCache; }
function setMenuBg(url){
  _configCache = Object.assign({}, _configCache, { menuBgUrl: url });
  fbDb.collection('config').doc('geral').set({ menuBgUrl: url }, { merge:true }).catch(err => {
    console.error('setMenuBg', err);
    toast('Não deu pra salvar agora — vai sincronizar quando a internet voltar');
  });
  toast(url ? 'Logo de fundo atualizada' : 'Logo de fundo removida');
  route();
}
function removeMenuBg(){ setMenuBg(null); }
// Redimensiona no navegador antes de salvar (mesmo esquema da logomarca do
// evento) — como PNG, pra preservar transparência se a imagem já tiver.
function onMenuBgSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 500;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      setMenuBg(canvas.toDataURL('image/png'));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
// Camada de fundo fixa (position:fixed, atrás de tudo, opacidade baixa) —
// só entra na página quando existe uma logo configurada.
function menuBgLayerHtml(){
  const url = (getConfig() || {}).menuBgUrl;
  return url ? `<div class="menu-bg-layer" style="background-image:url('${url}')"></div>` : '';
}
function toggleRegras(){
  const el = document.getElementById('regrasText');
  const btn = document.getElementById('regrasToggle');
  if(!el || !btn) return;
  const nowCollapsed = el.classList.toggle('collapsed');
  btn.textContent = nowCollapsed ? 'Ler mais ▾' : 'Ler menos ▴';
}

function loadChaves(){ return _chavesCache; }
function getChave(id){ return _chavesCache.find(c => c.id === id); }
function updateChave(chave){
  const idx = _chavesCache.findIndex(c => c.id === chave.id);
  if(idx >= 0) _chavesCache[idx] = chave; else _chavesCache.push(chave);
  const data = Object.assign({}, chave);
  delete data.id;
  // Any full-chave write (renaming a time, editing a categoria, etc.) can
  // carry already-scored resultados along with it — those need the same
  // Firestore-safe {a,b} set shape as salvarResultado(), or the WHOLE write
  // gets rejected (nested arrays), not just the score itself.
  if(data.resultados){
    const conv = {};
    Object.keys(data.resultados).forEach(k => { conv[k] = resultadoToFirestore(data.resultados[k]); });
    data.resultados = conv;
  }
  fbDb.collection('chaves').doc(chave.id).set(data).catch(err => {
    console.error('updateChave', err);
    toast('Não deu pra salvar agora — vai sincronizar quando a internet voltar');
  });
}
function deleteChave(id){
  _chavesCache = _chavesCache.filter(c => c.id !== id);
  fbDb.collection('chaves').doc(id).delete().catch(err => console.error('deleteChave', err));
}
function uid(prefix){ return (prefix||'c') + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// ---------- Evento -> Dia -> Categoria ----------
// A "categoria" is just a thin link between a day of an evento and a chave — the
// chave's own .nome IS the categoria's name, so renaming a categoria is just
// renaming its chave (no duplicated name to keep in sync).
function loadEventos(){ return _eventosCache; }
function getEvento(id){ return _eventosCache.find(e => e.id === id); }
function updateEvento(ev){
  const idx = _eventosCache.findIndex(e => e.id === ev.id);
  if(idx >= 0) _eventosCache[idx] = ev; else _eventosCache.push(ev);
  const data = Object.assign({}, ev);
  delete data.id;
  fbDb.collection('eventos').doc(ev.id).set(data).catch(err => {
    console.error('updateEvento', err);
    toast('Não deu pra salvar agora — vai sincronizar quando a internet voltar');
  });
}
function deleteEvento(id){
  loadCategorias().filter(c => c.eventoId === id).forEach(c => {
    deleteChave(c.chaveId);
    deleteCategoriaRecord(c.id);
  });
  _eventosCache = _eventosCache.filter(e => e.id !== id);
  fbDb.collection('eventos').doc(id).delete().catch(err => console.error('deleteEvento', err));
}
function diasOfEvento(evento){
  const days = [];
  if(!evento.dataInicio || !evento.dataFim) return days;
  let d = new Date(evento.dataInicio + 'T00:00:00');
  const end = new Date(evento.dataFim + 'T00:00:00');
  let guard = 0;
  while(d <= end && guard < 60){
    days.push(d.toISOString().slice(0,10));
    d.setDate(d.getDate() + 1);
    guard++;
  }
  return days;
}
function formatDiaLabel(dataStr){
  const d = new Date(dataStr + 'T00:00:00');
  const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  return dias[d.getDay()] + ' ' + String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}
// Full day-of-week name for the evento's day tabs/list, e.g. "Sexta – 21/08".
function formatDiaLabelFull(dataStr){
  const d = new Date(dataStr + 'T00:00:00');
  const dias = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  return dias[d.getDay()] + ' – ' + String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}
// "31 de julho de 2026" — usado na página pública do evento (estilo arevo).
function formatDateLong(dataStr){
  const d = new Date(dataStr + 'T00:00:00');
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return String(d.getDate()).padStart(2,'0') + ' de ' + meses[d.getMonth()] + ' de ' + d.getFullYear();
}
function formatPeriodoLong(dataInicio, dataFim){
  if(!dataInicio) return '';
  if(!dataFim || dataFim === dataInicio) return formatDateLong(dataInicio);
  return formatDateLong(dataInicio) + ' - ' + formatDateLong(dataFim);
}

function loadCategorias(){ return _categoriasCache; }
function getCategoria(id){ return _categoriasCache.find(c => c.id === id); }
function updateCategoria(cat){
  const idx = _categoriasCache.findIndex(c => c.id === cat.id);
  if(idx >= 0) _categoriasCache[idx] = cat; else _categoriasCache.push(cat);
  const data = Object.assign({}, cat);
  delete data.id;
  fbDb.collection('categorias').doc(cat.id).set(data).catch(err => {
    console.error('updateCategoria', err);
    toast('Não deu pra salvar agora — vai sincronizar quando a internet voltar');
  });
}
// Removes just the categoria LINK record (used both standalone and as part of
// deleteEvento's cascade, which needs to remove links without re-deriving
// the chave a second time).
function deleteCategoriaRecord(id){
  _categoriasCache = _categoriasCache.filter(c => c.id !== id);
  fbDb.collection('categorias').doc(id).delete().catch(err => console.error('deleteCategoriaRecord', err));
}
function deleteCategoria(id){
  const cat = getCategoria(id);
  if(cat) deleteChave(cat.chaveId);
  deleteCategoriaRecord(id);
}
function categoriaByChaveId(chaveId){ return loadCategorias().find(c => c.chaveId === chaveId); }
// Ordem alfabética (PT-BR, ignorando maiúscula/acento) dentro do mesmo dia —
// pedido do Ed pra ficar mais fácil de achar a categoria na grade.
function byNomeChave(a, b){
  return a.chave.nome.localeCompare(b.chave.nome, 'pt-BR', { sensitivity:'base' });
}
function categoriasOfDia(eventoId, data){
  return loadCategorias().filter(c => c.eventoId === eventoId && c.data === data)
    .map(c => ({ cat:c, chave:getChave(c.chaveId) }))
    .filter(x => x.chave)
    .sort(byNomeChave);
}
// Todas as categorias do evento, atravessando os dias — usado na grade de
// categorias da página pública (arevo mostra tudo junto, sem separar por dia).
// Ordenado por dia do evento (cronológico, "YYYY-MM-DD" já ordena certo como
// string) e, dentro do mesmo dia, alfabeticamente pelo nome da categoria.
function categoriasOfEvento(eventoId){
  return loadCategorias().filter(c => c.eventoId === eventoId)
    .map(c => ({ cat:c, chave:getChave(c.chaveId) }))
    .filter(x => x.chave)
    .sort((a,b) => (a.cat.data < b.cat.data ? -1 : a.cat.data > b.cat.data ? 1 : 0) || byNomeChave(a,b));
}
// Status do evento como um todo (badge na página pública), derivado do
// progresso agregado de todas as categorias — não temos inscrição pelo site,
// então "Aberto" (como no arevo) não se aplica; usamos o mesmo vocabulário de
// status já usado nas chaves (Programado / Em andamento / Concluído).
function eventoStatusInfo(ev){
  const items = categoriasOfEvento(ev.id);
  if(!items.length) return { label:'Programado', cls:'status-pending' };
  let anyStarted = false, allDone = true;
  items.forEach(({chave}) => {
    const st = chaveStatus(chave);
    if(st.done > 0) anyStarted = true;
    if(!st.concluded) allDone = false;
  });
  if(allDone) return { label:'Concluído', cls:'status-done' };
  if(anyStarted) return { label:'Em andamento', cls:'status-live' };
  return { label:'Programado', cls:'status-pending' };
}
// Status of a chave's games, used for the at-a-glance badges in both UIs.
function chaveStatus(chave){
  const games = effectiveGames(chave);
  const total = games.length;
  const done = games.filter(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot).length;
  // "Concluída" is based on every game having a result, not on the ranking having
  // zero pending rows — a handful of bracket sizes carry a harmless "não determinado"
  // placeholder row from the source data (flagged dataQuirk) that would otherwise
  // keep the status stuck on "Em andamento" forever even once every match is played.
  const concluded = total > 0 && done === total;
  let label, cls;
  if(done === 0){ label = 'Não iniciada'; cls = 'status-pending'; }
  else if(concluded){ label = 'Concluída'; cls = 'status-done'; }
  else { label = 'Em andamento'; cls = 'status-live'; }
  return { total, done, concluded, label, cls };
}
// Where the back button / breadcrumb from a chave should go: back to its evento
// and day if it belongs to one, otherwise to the organizador home.
function chaveBackHash(chaveId){
  const cat = categoriaByChaveId(chaveId);
  if(cat) return '/evento/' + cat.eventoId + '/' + cat.data;
  return '/organizador';
}

// ---------- quadra + status do jogo (próximo / em andamento / finalizado) ----------
// "quadra" (which court) and "andamento" (organizer manually marking a game as
// currently being played) both live as small num->value maps on the chave doc,
// same pattern as .resultados — cheap to add without a schema migration.
function setQuadra(chaveId, gnum, valor){
  const chave = getChave(chaveId);
  if(!chave) return;
  chave.quadras = Object.assign({}, chave.quadras);
  const v = (valor||'').trim();
  if(v) chave.quadras[gnum] = v; else delete chave.quadras[gnum];
  updateChave(chave);
  // Feedback imediato pra deixar claro que o número foi salvo — o campo é
  // só o número agora (a palavra "Quadra" já vem fixa no rótulo), e o Ed
  // relatou não ter certeza se isso estava confirmando/salvando de fato.
  toast(v ? ('Quadra ' + v + ' salva') : 'Quadra removida');
}
function toggleAndamento(chaveId, gnum){
  const chave = getChave(chaveId);
  if(!chave) return;
  chave.andamento = Object.assign({}, chave.andamento);
  if(chave.andamento[gnum]) delete chave.andamento[gnum]; else chave.andamento[gnum] = true;
  updateChave(chave);
}
// Clears the manual "em andamento" flag once a jogo gets a resultado — a
// finished game shouldn't keep showing as "em andamento".
function clearAndamento(chave, gnum){
  if(chave.andamento && chave.andamento[gnum]){
    chave.andamento = Object.assign({}, chave.andamento);
    delete chave.andamento[gnum];
  }
}
// Single source of truth for the 4-state badge shown on both the organizador
// and público match cards: finalizado (tem resultado) > em andamento (marcado
// manualmente pelo organizador) > próximo (os dois times já são conhecidos,
// pronto pra jogar) > aguardando (ainda depende de outro jogo).
function matchStatus(chave, g, info, res){
  const done = !!(res && res.vencedorSlot);
  if(done) return { key:'finalizado', label:'Finalizado', cls:'done' };
  if(chave.andamento && chave.andamento[g.num]) return { key:'andamento', label:'● Em andamento', cls:'live' };
  if(info.ready) return { key:'proximo', label:'Próximo', cls:'ready' };
  return { key:'aguardando', label:'Aguardando', cls:'wait' };
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

// Persistent (does NOT auto-hide) counter of placares still waiting on a
// server ack — see salvarResultadoDireto(). Unlike toast(), this stays up
// for as long as it's true, so it can't quietly disappear while still
// actually unsynced (see incidente 15/08/2026).
let _syncPendingCount = 0;
function markSyncPending(delta){
  _syncPendingCount = Math.max(0, _syncPendingCount + delta);
  const el = document.getElementById('syncBanner');
  if(!el) return;
  if(_syncPendingCount > 0){
    el.textContent = _syncPendingCount === 1
      ? '🔄 1 placar aguardando confirmação do servidor — não feche o navegador'
      : ('🔄 ' + _syncPendingCount + ' placares aguardando confirmação do servidor — não feche o navegador');
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

// ---------- team modality (dupla / quarteto) ----------
function emptyTeam(modalidade){
  if(modalidade === 'quarteto') return { nome:'', atletas:['','','','','',''] };
  return { atleta1:'', atleta2:'' };
}
// Returns the display label for team at index idx, or null if not filled in yet.
function teamLabel(chave, idx){
  const t = chave.times[idx];
  if(!t) return null;
  if(typeof t === 'string') return t.trim() ? t.trim() : null; // legacy format safety net
  if(chave.modalidade === 'quarteto'){
    return (t.nome && t.nome.trim()) ? t.nome.trim() : null;
  }
  const a1 = (t.atleta1||'').trim(), a2 = (t.atleta2||'').trim();
  if(a1 && a2) return a1 + ' / ' + a2;
  if(a1) return a1;
  if(a2) return a2;
  return null;
}

// ---------- bracket resolution ----------
function resolveTeam(chave, ref){
  // ref: number (rank), "Venc J N" / "Perd J N", or {grp,pos} (group standing)
  if(typeof ref === 'number'){
    const label = teamLabel(chave, ref-1);
    return { label: label || ('Rank ' + ref), resolved: !!label, teamKey: 'R'+ref };
  }
  if(ref && typeof ref === 'object' && ref.grp){
    const st = groupStandings(chave, ref.grp);
    if(!st.complete){
      // Placeholder pra qualquer posição do grupo (1º, 2º, 3º, 4º...), não só
      // 1º/2º — categorias de 4/5 duplas alimentam a disputa de 3º/4º direto
      // da classificação do grupo (pos 3 e 4), e com o texto fixo em "2º" os
      // dois lados apareciam como "2º do Grupo" mesmo sendo 3º x 4º.
      const single = groupNamesOf(chave.numTimes).length === 1;
      return { label: ordinal(ref.pos) + (single ? ' do grupo' : (' do Grupo ' + ref.grp)), resolved:false, teamKey:null };
    }
    const row = st.rows[ref.pos-1];
    if(!row) return { label:'?', resolved:false, teamKey:null };
    return { label: row.label, resolved:true, teamKey:'R'+row.rank };
  }
  const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
  if(!m) return { label: String(ref), resolved:false, teamKey:null };
  const kind = m[1]; const gnum = parseInt(m[2],10);
  const res = chave.resultados[gnum];
  if(!res || !res.vencedorSlot){
    return { label: (kind==='Venc' ? 'Vencedor Jogo ' : 'Perdedor Jogo ') + gnum, resolved:false, teamKey:null };
  }
  const games = BRACKETS[chave.numTimes];
  const g = games.find(x => x.num === gnum);
  const winnerRef = res.vencedorSlot === 'a' ? g.a : g.b;
  const loserRef  = res.vencedorSlot === 'a' ? g.b : g.a;
  return resolveTeam(chave, kind === 'Venc' ? winnerRef : loserRef);
}

// ---------- group-stage standings (average de pontos) ----------
function groupGames(numTimes, grp){
  return BRACKETS[numTimes].filter(g => g.grupo === grp);
}
function groupRanks(numTimes, grp){
  const games = groupGames(numTimes, grp);
  const set = new Set();
  games.forEach(g=>{ if(typeof g.a==='number') set.add(g.a); if(typeof g.b==='number') set.add(g.b); });
  return Array.from(set).sort((x,y)=>x-y);
}
function groupStandings(chave, grp){
  const games = groupGames(chave.numTimes, grp);
  const ranks = groupRanks(chave.numTimes, grp);
  const stats = {};
  ranks.forEach(r => stats[r] = { rank:r, feitos:0, sofridos:0, jogos:0, label: resolveTeam(chave, r).label });
  let playedCount = 0;
  games.forEach(g=>{
    const res = chave.resultados[g.num];
    if(!res || !res.vencedorSlot) return;
    playedCount++;
    let fa=0, fb=0;
    (res.sets||[]).forEach(s=>{ fa+=s[0]; fb+=s[1]; });
    stats[g.a].feitos += fa; stats[g.a].sofridos += fb; stats[g.a].jogos++;
    stats[g.b].feitos += fb; stats[g.b].sofridos += fa; stats[g.b].jogos++;
  });
  const arr = ranks.map(r=>{
    const s = stats[r];
    const average = s.sofridos>0 ? s.feitos/s.sofridos : (s.feitos>0 ? Infinity : 0);
    return Object.assign({}, s, { average });
  });
  arr.sort((x,y)=>{
    if(y.average !== x.average) return y.average - x.average;
    if(y.feitos !== x.feitos) return y.feitos - x.feitos;
    return 0;
  });
  return { rows: arr, complete: playedCount === games.length, totalGames: games.length, played: playedCount };
}

function matchInfo(chave, g){
  const A = resolveTeam(chave, g.a);
  const B = resolveTeam(chave, g.b);
  const res = chave.resultados[g.num] || null;
  return { A, B, res, ready: A.resolved && B.resolved };
}

// ---------- score logic ----------
function setWinner(scoreA, scoreB){
  const a = parseInt(scoreA,10), b = parseInt(scoreB,10);
  if(isNaN(a) || isNaN(b) || a === b) return null;
  return a > b ? 'a' : 'b';
}
function computeMatchWinner(formato, sets){
  // sets: [[a,b], ...]
  if(formato === 'unico'){
    if(sets.length < 1) return null;
    return setWinner(sets[0][0], sets[0][1]);
  }
  // melhorDe3
  let wa=0, wb=0;
  for(const s of sets){
    const w = setWinner(s[0], s[1]);
    if(w === 'a') wa++; else if(w === 'b') wb++;
  }
  if(wa >= 2) return 'a';
  if(wb >= 2) return 'b';
  return null;
}

// ---------- standings ----------
function computeStandings(chave){
  const games = effectiveGames(chave);
  const byFase = {};
  games.forEach(g => { (byFase[g.fase] = byFase[g.fase] || []).push(g); });
  const rows = [];
  function decided(fase){
    const arr = byFase[fase];
    if(!arr || arr.length !== 1) return null;
    const g = arr[0];
    const res = chave.resultados[g.num];
    if(!res || !res.vencedorSlot) return null;
    const info = matchInfo(chave, g);
    return { winner: res.vencedorSlot==='a'?info.A:info.B, loser: res.vencedorSlot==='a'?info.B:info.A };
  }
  const final = decided('Final');
  if(final){
    rows.push({pos:'1º', cls:'p1', name: final.winner.label});
    rows.push({pos:'2º', cls:'p2', name: final.loser.label});
  }
  const isSmall = String(chave.numTimes) === '4' || String(chave.numTimes) === '5';
  const semDisputa3 = isSmall && chave.disputa3 === false;
  const terceiro = decided('3º/4º');
  if(terceiro){
    rows.push({pos:'3º', cls:'p3', name: terceiro.winner.label});
    rows.push({pos:'4º', cls:'p3', name: terceiro.loser.label});
  } else if(semDisputa3){
    const stU = groupStandings(chave, 'UNICO');
    if(stU.complete && stU.rows.length >= 4){
      rows.push({pos:'3º', cls:'p3', name: stU.rows[2].label});
      rows.push({pos:'4º', cls:'p3', name: stU.rows[3].label});
    }
  }
  const quinto = decided('5º/6º');
  if(quinto){
    rows.push({pos:'5º', cls:'p5', name: quinto.winner.label});
    rows.push({pos:'6º', cls:'p5', name: quinto.loser.label});
  }
  const setimo = decided('7º/8º');
  if(setimo){
    rows.push({pos:'7º', cls:'p5', name: setimo.winner.label});
    rows.push({pos:'8º', cls:'p5', name: setimo.loser.label});
  }
  if(String(chave.numTimes) === '6'){
    const stA = groupStandings(chave, 'A');
    const stB = groupStandings(chave, 'B');
    if(stA.complete && stB.complete){
      const c1 = stA.rows[2], c2 = stB.rows[2];
      const pair = [c1, c2].sort((x,y)=> y.average - x.average);
      rows.push({pos:'5º', cls:'p5', name: pair[0].label});
      rows.push({pos:'6º', cls:'p5', name: pair[1].label});
    }
  }
  if(String(chave.numTimes) === '5'){
    const stU = groupStandings(chave, 'UNICO');
    if(stU.complete && rows.some(r=>r.pos==='4º') && stU.rows.length > 4){
      rows.push({pos:'5º', cls:'p5', name: stU.rows[4].label});
    }
  }
  if(String(chave.numTimes) === '3'){
    const stU = groupStandings(chave, 'UNICO');
    if(stU.complete && stU.rows.length >= 3){
      rows.push({pos:'3º', cls:'p3', name: stU.rows[2].label});
    }
  }
  if(String(chave.numTimes) === '7'){
    const stA = groupStandings(chave, 'A');
    const stB = groupStandings(chave, 'B');
    if(stA.complete && stB.complete){
      const cand = [stA.rows[2], stB.rows[2], stB.rows[3]].filter(Boolean);
      cand.sort((x,y) => y.average - x.average);
      const labels = ['5º','6º','7º'];
      cand.forEach((c,i) => rows.push({pos:labels[i], cls:'p5', name:c.label}));
    }
  }
  return rows;
}

// ---------- full 1..N final ranking (progressive: fills in as duplas are eliminated) ----------
function ordinal(n){ return n + 'º'; }
function posNumFromLabel(posStr){ return parseInt(String(posStr).replace('º',''), 10); }

// Structural template: for a given bracket size, which games decide which position
// (or position range, when several teams end up tied). This depends only on the
// bracket's shape — never on results — so it's computed once and cached.
const rankTemplateCache = {};
function buildRankTemplate(numTimes){
  if(rankTemplateCache[numTimes]) return rankTemplateCache[numTimes];
  const games = BRACKETS[numTimes];
  const referencedVenc = new Set(), referencedPerd = new Set();
  games.forEach(g => {
    [g.a, g.b].forEach(ref => {
      if(typeof ref === 'string'){
        const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
        if(m){ (m[1]==='Venc' ? referencedVenc : referencedPerd).add(parseInt(m[2],10)); }
      }
    });
  });
  const cohortsMap = {};
  games.forEach(g => {
    if(!referencedVenc.has(g.num)){
      const key = g.fase + '|venc';
      if(!cohortsMap[key]) cohortsMap[key] = { fase:g.fase, outcome:'venc', maxNum:-1, gameNums:[] };
      cohortsMap[key].maxNum = Math.max(cohortsMap[key].maxNum, g.num);
      cohortsMap[key].gameNums.push(g.num);
    }
    if(!referencedPerd.has(g.num)){
      const key = g.fase + '|perd';
      if(!cohortsMap[key]) cohortsMap[key] = { fase:g.fase, outcome:'perd', maxNum:-1, gameNums:[] };
      cohortsMap[key].maxNum = Math.max(cohortsMap[key].maxNum, g.num);
      cohortsMap[key].gameNums.push(g.num);
    }
  });
  const cohorts = Object.values(cohortsMap).sort((a,b)=>{
    if(b.maxNum !== a.maxNum) return b.maxNum - a.maxNum;
    if(a.outcome !== b.outcome) return a.outcome === 'venc' ? -1 : 1;
    return 0;
  });
  let pos = 1;
  cohorts.forEach(c => {
    c.posStart = pos;
    c.posEnd = pos + c.gameNums.length - 1;
    c.posLabel = c.posStart === c.posEnd ? ordinal(c.posStart) : (ordinal(c.posStart) + '–' + ordinal(c.posEnd));
    pos = c.posEnd + 1;
  });
  rankTemplateCache[numTimes] = cohorts;
  return cohorts;
}

function computeFullRanking(chave){
  const games = BRACKETS[chave.numTimes];
  const hasGroups = games.some(g => g.grupo);
  const N = Number(chave.numTimes);
  if(hasGroups){
    const standingsRows = computeStandings(chave);
    const known = {};
    standingsRows.forEach(r => { known[posNumFromLabel(r.pos)] = r.name; });
    const rows = [];
    for(let p = 1; p <= N; p++){
      if(known[p] !== undefined) rows.push({ posLabel: ordinal(p), posStart:p, name: known[p], tied:false, pending:false });
      else rows.push({ posLabel: ordinal(p), posStart:p, name:null, tied:false, pending:true });
    }
    return rows;
  }
  return computeFinalRankingChain(chave);
}

function computeFinalRankingChain(chave){
  const template = buildRankTemplate(chave.numTimes);
  const games = BRACKETS[chave.numTimes];
  let rows = [];
  template.forEach(c => {
    const allPlayed = c.gameNums.every(gn => chave.resultados[gn] && chave.resultados[gn].vencedorSlot);
    if(!allPlayed){
      rows.push({ posLabel:c.posLabel, posStart:c.posStart, name:null, tied:false, pending:true });
      return;
    }
    const teams = c.gameNums.map(gn => {
      const g = games.find(x => x.num === gn);
      const res = chave.resultados[gn];
      const info = matchInfo(chave, g);
      return c.outcome === 'venc' ? (res.vencedorSlot==='a'?info.A:info.B) : (res.vencedorSlot==='a'?info.B:info.A);
    });
    teams.sort((x,y)=>{
      const rx = parseInt(String(x.teamKey||'R999').replace('R',''),10);
      const ry = parseInt(String(y.teamKey||'R999').replace('R',''),10);
      return rx - ry;
    });
    teams.forEach(team => rows.push({ posLabel:c.posLabel, posStart:c.posStart, name:team.label, teamKey:team.teamKey, tied: teams.length>1, pending:false }));
  });

  // Safety net: a couple of the source spreadsheet's larger tables have a duplicated
  // internal reference that can resolve the same dupla into two different slots.
  // Keep only its best (lowest posStart) slot; the other slot is left without a name.
  const best = {};
  rows.forEach(r => {
    if(r.pending) return;
    const key = r.teamKey || r.name;
    if(!best[key] || r.posStart < best[key].posStart) best[key] = r;
  });
  rows = rows.map(r => {
    if(r.pending) return r;
    const key = r.teamKey || r.name;
    if(best[key] !== r) return { posLabel:r.posLabel, posStart:r.posStart, name:null, tied:false, pending:true, dataQuirk:true };
    return r;
  });

  // Once every game is played, any real dupla still missing from the decided rows
  // (a rarer knock-on effect of the same source-table inconsistency) gets an explicit
  // placeholder so it's never silently absent from the ranking.
  const allPlayed = games.every(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot);
  if(allPlayed){
    const decidedNames = new Set(rows.filter(r=>!r.pending).map(r=>r.name));
    chave.times.forEach((t, i) => {
      const label = teamLabel(chave, i) || ('Rank ' + (i+1));
      if(!decidedNames.has(label)){
        rows.push({ posLabel:'?', posStart:9999, name:null, altName:label, tied:false, pending:true, dataQuirk:true });
      }
    });
  }
  return rows;
}

// For 4/5 duplas the organizer can skip the 3º/4º dispute (goes straight to the
// final, 3º/4º decided by group average instead). This returns the game list a
// given chave should actually use.
function effectiveGames(chave){
  const games = BRACKETS[chave.numTimes];
  const isSmall = String(chave.numTimes) === '4' || String(chave.numTimes) === '5';
  if(isSmall && chave.disputa3 === false){
    return games.filter(g => g.fase !== '3º/4º');
  }
  return games;
}

// ---------- cronograma (planejamento de quadras/horários) ----------
// Pedido do Ed: a partir do nº de quadras disponíveis num dia e da duração
// de cada jogo, montar uma previsão de horário/quadra pra cada jogo de cada
// categoria daquele dia — pra saber se cabe no dia e exportar em PDF pra
// arbitragem. Respeita a ordem real da chave: um jogo só entra na simulação
// depois que os jogos dos quais ele depende (Venc/Perd J N, ou — nos
// formatos com fase de grupos — TODOS os jogos do grupo de que ele puxa a
// classificação) já tiverem, na simulação, terminado. Categorias diferentes
// não dependem entre si — só disputam as mesmas quadras.
function isFaseDecisiva(fase){
  return fase === 'S/Final' || fase === 'Final' || fase === '3º/4º';
}
function duracaoJogo(ev, g){
  const padrao = ev.duracaoPadrao || 30;
  const decisiva = ev.duracaoDecisiva || 40;
  return isFaseDecisiva(g.fase) ? decisiva : padrao;
}
// Números dos jogos (na MESMA chave) dos quais um jogo depende antes de
// poder começar: "Venc/Perd J N" aponta direto pro jogo N; uma referência de
// grupo ({grp,pos}) depende de TODOS os jogos daquele grupo.
function gameDeps(chave, g){
  const deps = new Set();
  [g.a, g.b].forEach(ref => {
    if(typeof ref === 'string'){
      const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
      if(m) deps.add(parseInt(m[2], 10));
    } else if(ref && typeof ref === 'object' && ref.grp){
      effectiveGames(chave).forEach(gg => { if(gg.grupo === ref.grp && gg.num !== g.num) deps.add(gg.num); });
    }
  });
  return Array.from(deps);
}
function hhmmToMin(hhmm){
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm||'');
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function gcdMin(a, b){
  a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b));
  while(b){ const t = b; b = a % b; a = t; }
  return a || 1;
}
// Passo de linha da grade do cronograma, em minutos: se a duração do jogo
// classificatório e a do decisivo forem diferentes (ex: 30 e 40), uma linha
// fixa de 30min faz o fim de um jogo decisivo cair "entre" linhas e some da
// tabela — usar o MDC das duas durações garante que todo início/fim de jogo
// caia exatamente numa linha, qualquer que seja a combinação configurada.
function cronogramaGridStep(ev){
  return Math.max(5, gcdMin(ev.duracaoPadrao || 30, ev.duracaoDecisiva || 40));
}
function minToHHMM(min){
  min = Math.round(min);
  const h = Math.floor(min/60) % 24, m = ((min%60)+60)%60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
// Motor de simulação — puro (sem tocar em estado global nem DOM), pra dar
// pra testar isoladamente. Recebe as categorias do dia (cada uma com sua
// chave), o nº de quadras e o horário de início; devolve os jogos com
// quadra/horário previstos.
function gerarCronograma(ev, items, quadras, horaInicioStr){
  const inicioMin = hhmmToMin(horaInicioStr);
  const inicio = inicioMin == null ? 8*60 : inicioMin;
  if(!quadras || quadras < 1) return { slots: [], fimMin: inicio, ok:false };
  const quadraFreeAt = Array(quadras).fill(inicio);
  const porChave = items.map(({cat, chave}) => ({
    chave, cat,
    pendentes: effectiveGames(chave).slice().sort((a,b)=>a.num-b.num),
    fimDe: {} // gnum -> minuto em que termina (previsto)
  }));
  const slots = [];
  const totalJogos = porChave.reduce((s,pc)=>s+pc.pendentes.length, 0);
  let guard = 0;
  while(slots.length < totalJogos && guard < totalJogos + 500){
    guard++;
    const prontos = [];
    porChave.forEach(pc => {
      pc.pendentes.forEach(g => {
        const deps = gameDeps(pc.chave, g);
        if(deps.every(d => pc.fimDe[d] !== undefined)){
          const depEarliest = deps.length ? Math.max(...deps.map(d => pc.fimDe[d])) : inicio;
          prontos.push({ pc, g, depEarliest });
        }
      });
    });
    if(!prontos.length) break; // dependência não resolvida (não deveria acontecer) — sai pra não travar
    prontos.sort((a,b) => (a.depEarliest - b.depEarliest) || (a.g.num - b.g.num));
    prontos.forEach(({pc, g, depEarliest}) => {
      let earliest = depEarliest;
      // Fases finais (poucos jogos restantes numa categoria — quartas,
      // repescagem, semifinal, final) nunca rodam mais de 2 jogos da MESMA
      // categoria ao mesmo tempo, mesmo sobrando quadra livre — pedido do Ed:
      // com menos de 4 jogos por distribuir, 3+ simultâneos "desconfigura a
      // competição" (essas fases só comportam 2 de verdade). O limite some
      // assim que sobrarem 4+ jogos daquela categoria (cobre quartas com 4
      // jogos em paralelo, por exemplo). slots já reflete o que foi agendado
      // nesta mesma leva até aqui, então também serializa candidatos que
      // ficaram prontos juntos.
      if(pc.pendentes.length < 4){
        const finsDesc = slots.filter(s => s.chaveId === pc.chave.id).map(s => s.fim).sort((a,b) => b-a);
        if(finsDesc.length >= 2) earliest = Math.max(earliest, finsDesc[1]);
      }
      let idx = 0;
      for(let i=1;i<quadraFreeAt.length;i++) if(quadraFreeAt[i] < quadraFreeAt[idx]) idx = i;
      const startAt = Math.max(quadraFreeAt[idx], earliest);
      const dur = duracaoJogo(ev, g);
      const fim = startAt + dur;
      slots.push({ chaveId: pc.chave.id, categoria: pc.chave.nome, gnum: g.num, fase: g.fase, quadraIdx: idx, inicio: startAt, fim });
      quadraFreeAt[idx] = fim;
      pc.fimDe[g.num] = fim;
      pc.pendentes = pc.pendentes.filter(x => x.num !== g.num);
    });
  }
  const fimMin = slots.length ? Math.max(...slots.map(s=>s.fim)) : inicio;
  return { slots, fimMin, ok:true };
}
// ---------- grade por categoria (quadras dedicadas, com "degraus") ----------
// Modelo pedido pelo Ed depois de ver os jogos "misturados" livremente pela
// mesma quadra (categoria A num horário, categoria B no seguinte, categoria
// A de novo): cada categoria usa um NÚMERO DE QUADRAS PRÓPRIO (editável —
// quantas quadras + que horas começa), nunca dividindo a mesma quadra com
// outra categoria NO MESMO INSTANTE. Ago/2026: o Ed pediu pra esse número
// poder MUDAR ao longo do dia por categoria — ex. "Pais e Filhos" começa com
// 2 quadras e ganha uma 3ª a partir das 15h30 (se estiver livre nessa hora);
// "Adulto Iniciante" começa com 4, sobe pra 5 às 10h e desce pra 2 nas fases
// finais. Isso vira uma lista de "degraus" por categoria (cat.quadraSteps —
// [{horaInicio, quadras}, ...]) além do quadras/horaInicio simples de antes
// (que continua funcionando normalmente pra quem não usa degraus).
//
// Pra dar pra "devolver" uma quadra ociosa pra outra categoria pegar assim
// que ela libera (em vez de reservar tudo cego desde o início do dia), as
// quadras de TODAS as categorias do dia são simuladas juntas numa única
// simulação por ondas (como o antigo gerarCronograma fazia antes do pedido
// de quadra dedicada) — só que agora cada categoria tem uma COTA de quadras
// simultâneas que pode variar com o tempo (era fixa em "sempre 2" só nas
// fases finais; virou geral, dirigida pelos degraus). Cada categoria tenta
// primeiro reaproveitar as quadras que "já são dela" (pra não ficar pulando
// de quadra à toa); só reivindica uma quadra nova (sem dono no momento) se
// ainda não bateu a cota — e assim que sua cota cai (fim, degrau de descida,
// fases finais) ou ela termina os jogos, devolve o excesso, que fica livre
// pra qualquer outra categoria reivindicar.
function normalizeCategoriaSteps(cat, quadrasTotais, inicioDia){
  const start = Math.max(inicioDia, hhmmToMin(cat.horaInicio) ?? inicioDia);
  const clampN = n => Math.max(1, Math.min(quadrasTotais, Math.round(n) || 1));
  const custom = (Array.isArray(cat.quadraSteps) ? cat.quadraSteps : [])
    .filter(s => s && s.quadras && hhmmToMin(s.horaInicio) != null)
    .map(s => ({ at: Math.max(inicioDia, hhmmToMin(s.horaInicio)), quadras: clampN(s.quadras) }))
    .sort((a,b) => a.at - b.at);
  let steps;
  if(!custom.length || custom[0].at > start){
    steps = [{ at: start, quadras: clampN(cat.quadras || 1) }].concat(custom);
  } else {
    // já existe um degrau bem na hora de início (ou antes) — ele que manda
    // a partir do início, ajustado pra não começar antes da categoria.
    steps = custom.slice();
    steps[0] = { at: start, quadras: steps[0].quadras };
  }
  // funde degraus repetidos no mesmo horário (o último definido vence) e
  // remove degraus que não mudam nada em relação ao anterior.
  const merged = [];
  steps.forEach(s => {
    if(merged.length && merged[merged.length-1].at === s.at) merged[merged.length-1] = s;
    else if(!merged.length || merged[merged.length-1].quadras !== s.quadras) merged.push(s);
    else if(s.at > merged[merged.length-1].at) { /* mesmo valor, degrau redundante — ignora */ }
  });
  return merged.length ? merged : [{ at: start, quadras: clampN(cat.quadras || 1) }];
}
function quadrasAtStep(steps, t){
  let n = steps[0].quadras;
  for(const s of steps){ if(s.at <= t) n = s.quadras; else break; }
  return n;
}
function gerarGradeDia(ev, items, quadrasTotais, horaInicioDiaStr){
  const inicioDia = hhmmToMin(horaInicioDiaStr) ?? 8*60;
  if(!quadrasTotais || quadrasTotais < 1) return { jogos: [], fimMin: inicioDia };

  // Cada categoria é montada de uma vez só, do primeiro ao último jogo dela,
  // ANTES de passar pra próxima — isso é o que mantém o cronograma
  // "agrupado" (cada quadra real fica reservada pra mesma categoria o dia
  // inteiro, só passando pra outra categoria quando a dona termina de vez).
  // A ordem de montagem é por horário de início (quem começa mais cedo tem
  // preferência de quadra), com empate pela ordem da lista.
  // Dentro da montagem de UMA categoria, se ela tiver degraus de quadra
  // (cat.quadraSteps), ela pode reivindicar quadra(s) extra do que sobrou —
  // livre porque ninguém pegou ainda, ou porque uma categoria já processada
  // terminou antes — e devolve o excesso se a cota cair (fases finais, por
  // exemplo). Categoria sem degrau nunca solta nem invade quadra de outra.
  const porCat = items.map((it, idx) => ({
    cat: it.cat, chave: it.chave,
    steps: normalizeCategoriaSteps(it.cat, quadrasTotais, inicioDia),
    pendentes: effectiveGames(it.chave).slice().sort((a,b) => a.num - b.num),
    _origIdx: idx,
  }));
  porCat.sort((a,b) => (a.steps[0].at - b.steps[0].at) || (a._origIdx - b._origIdx));

  const quadraFreeAt = Array(quadrasTotais).fill(inicioDia);
  const jogos = [];

  porCat.forEach(pc => {
    const fimDe = {};      // gnum -> minuto em que termina (previsto)
    const meusFins = [];   // fins dos jogos já marcados dessa categoria (regra de fases finais)
    let colunas = [];      // índices de quadra REAL "da vez" dessa categoria
    // menor horário em que a categoria já tem direito a N quadras ao mesmo
    // tempo (o primeiro degrau que alcança N) — usado pra nunca deixar a
    // categoria reivindicar uma quadra "extra" antes da hora combinada, nem
    // que essa quadra esteja livre desde cedo por acaso.
    function earliestForQuota(n){
      for(const s of pc.steps){ if(s.quadras >= n) return s.at; }
      return Infinity;
    }

    let guard = 0;
    while(pc.pendentes.length && guard < pc.pendentes.length + 200){
      guard++;
      const prontos = pc.pendentes.filter(g => gameDeps(pc.chave, g).every(d => fimDe[d] !== undefined));
      if(!prontos.length) break; // dependência não resolvida — não deveria acontecer, sai pra não travar
      prontos.sort((a,b) => a.num - b.num);
      const g = prontos[0];
      const deps = gameDeps(pc.chave, g);
      let earliest = deps.length ? Math.max(...deps.map(d => fimDe[d])) : pc.steps[0].at;
      // Fases finais: nunca mais de 2 jogos da MESMA categoria ao mesmo
      // tempo enquanto restam menos de 4 pra fechar (mesma regra de antes).
      if(pc.pendentes.length < 4){
        const finsDesc = meusFins.slice().sort((a,b) => b-a);
        if(finsDesc.length >= 2) earliest = Math.max(earliest, finsDesc[1]);
      }
      // 1) converge a cota "de descida" olhando só pras quadras que já são
      // da categoria (nunca considera quadra nova aqui — só solta excesso
      // se a cota cair antes do jogo realmente poder começar).
      let refTime = earliest;
      for(let iter=0; iter<8; iter++){
        const capNow = quadrasAtStep(pc.steps, refTime);
        if(colunas.length > capNow) colunas = colunas.slice(0, capNow);
        if(!colunas.length) break;
        let bestOwned = colunas[0];
        for(const i of colunas) if(quadraFreeAt[i] < quadraFreeAt[bestOwned]) bestOwned = i;
        const newRef = Math.max(quadraFreeAt[bestOwned], earliest);
        if(newRef === refTime) break;
        refTime = newRef;
      }
      const capNow = quadrasAtStep(pc.steps, refTime);
      if(colunas.length > capNow) colunas = colunas.slice(0, capNow);

      // 2) escolhe entre esperar numa quadra já "da vez" ou reivindicar uma
      // quadra nova — só permitido a partir do horário do degrau que libera
      // essa unidade extra, mesmo que fisicamente já esteja livre antes.
      let idx = null, startAt = Infinity, viaNova = false;
      if(colunas.length){
        let bestOwned = colunas[0];
        for(const i of colunas) if(quadraFreeAt[i] < quadraFreeAt[bestOwned]) bestOwned = i;
        idx = bestOwned;
        startAt = Math.max(quadraFreeAt[bestOwned], earliest);
      }
      if(colunas.length < capNow){
        const threshold = earliestForQuota(colunas.length + 1);
        let bestNovo = null, bestNovoStart = Infinity;
        for(let i=0; i<quadraFreeAt.length; i++){
          if(colunas.includes(i)) continue;
          const st = Math.max(quadraFreeAt[i], earliest, threshold);
          if(st < bestNovoStart){ bestNovoStart = st; bestNovo = i; }
        }
        if(bestNovo !== null && bestNovoStart < startAt){
          idx = bestNovo; startAt = bestNovoStart; viaNova = true;
        }
      }
      if(viaNova) colunas.push(idx);

      const dur = duracaoJogo(ev, g);
      const fim = startAt + dur;
      jogos.push({ chaveId: pc.chave.id, categoria: pc.chave.nome, gnum: g.num, fase: g.fase, quadraIdx: idx, inicio: startAt, fim });
      quadraFreeAt[idx] = fim;
      fimDe[g.num] = fim;
      meusFins.push(fim);
      pc.pendentes = pc.pendentes.filter(x => x.num !== g.num);
    }
  });

  const fimMin = jogos.length ? Math.max(...jogos.map(j => j.fim)) : inicioDia;
  return { jogos, fimMin };
}
function setCategoriaConfig(catId, patch){

  Object.assign(cat, patch);
  updateCategoria(cat);
}
// Degraus de quadras ao longo do dia pra uma categoria (cat.quadraSteps —
// [{horaInicio, quadras}, ...]), além do quadras/horaInicio simples de
// sempre — pedido do Ed pra poder aumentar (ou diminuir, nas fases finais)
// o número de quadras de uma categoria a partir de um horário específico.
function addCategoriaStep(catId){
  const cat = getCategoria(catId);
  if(!cat) return;
  const steps = (cat.quadraSteps || []).slice();
  steps.push({ horaInicio:'', quadras: cat.quadras || 1 });
  setCategoriaConfig(catId, { quadraSteps: steps });
}
function setCategoriaStep(catId, idx, patch){
  const cat = getCategoria(catId);
  if(!cat) return;
  const steps = (cat.quadraSteps || []).slice();
  if(!steps[idx]) return;
  steps[idx] = Object.assign({}, steps[idx], patch);
  setCategoriaConfig(catId, { quadraSteps: steps });
}
function removeCategoriaStep(catId, idx){
  const cat = getCategoria(catId);
  if(!cat) return;
  const steps = (cat.quadraSteps || []).slice();
  steps.splice(idx, 1);
  setCategoriaConfig(catId, { quadraSteps: steps });

function getDiaConfig(ev, data){

  // quadraCategoria: {quadraIdx -> chaveId} — fixação manual de qual
  // categoria aparece em qual quadra no mapa (Ed, 21/08/2026: "a ordem dos
  // jogos e a disposição das categorias está errada", pediu uma opção pra
  // alterar diretamente em vez de depender só do cálculo automático).
  return { quadras: c.quadras || 0, horaInicio: c.horaInicio || '08:00', horaLimite: c.horaLimite || '', quadraCategoria: c.quadraCategoria || {} };

// Fixa (ou libera, se chaveId for '') manualmente qual categoria aparece
// numa quadra específica do mapa daquele dia — sobrepõe o cálculo automático

  setDiaConfig(eventoId, dia, { quadraCategoria });

}

function doLogin(){
  const email = (document.getElementById('loginEmail').value || '').trim();
  const senha = document.getElementById('loginSenha').value || '';
  if(!email || !senha){ toast('Preencha e-mail e senha'); return; }
  fbAuth.signInWithEmailAndPassword(email, senha).catch(err => {
    const el = document.getElementById('loginErro');
    if(el) el.textContent = 'E-mail ou senha incorretos.';
  });
}
function doLogout(){
  fbAuth.signOut();
  location.hash = '/';
}

function route(){
  const hash = location.hash.slice(1) || '/';
  const parts = hash.split('/').filter(Boolean);
  // A raiz "/" agora É o modo público (lista de eventos publicados) — quem
  // acessa o link do evento cai direto lá, sem precisar logar. "/pub" continua
  // funcionando como sinônimo (links/QR codes antigos). Só "/organizador" e as
  // telas de edição (evento, categoria, chave...) exigem login.
  const isPub = hash === '/' || hash === '/pub' || parts[0] === 'pub';

  if(!isPub){
    if(!_authInitialized){
      app.innerHTML = `${header('Chaveamento', null, null)}<div class="wrap"><div class="empty"><div class="big">⏳</div><div style="font-weight:700;">Carregando…</div></div></div>`;
      return; // onAuthStateChanged calls route() again once Firebase reports the auth state
    }
    if(!_authUser) return renderLoginGate();
  }

  // ---- organizador (autenticado) ----
  if(hash === '/organizador') return renderEventosHome();
  if(hash === '/novo-evento') return renderEventoSetup();
  if(parts[0] === 'editar-evento') return renderEventoSetup(parts[1]);
  if(parts[0] === 'evento') return renderEventoView(parts[1], parts[2] ? decodeURIComponent(parts[2]) : null);
  if(parts[0] === 'nova-categoria') return renderSetup(null, { eventoId:parts[1], data:decodeURIComponent(parts[2]) });
  if(parts[0] === 'importar-lista') return renderImportLista(parts[1], decodeURIComponent(parts[2]));
  if(parts[0] === 'cronograma') return renderCronograma(parts[1], decodeURIComponent(parts[2]));
  if(parts[0] === 'chave') return renderChaveView(parts[1]);
  if(parts[0] === 'editar') return renderSetup(parts[1]);

  // ---- público (somente leitura, sem login) ----
  if(hash === '/' || hash === '/pub') return renderPubEventos();
  if(parts[0] === 'pub' && parts[1] === 'evento' && parts.length === 3) return renderPubEventoView(parts[2]);
  if(parts[0] === 'pub' && parts[1] === 'evento' && parts.length >= 4) return renderPubDiaView(parts[2], decodeURIComponent(parts[3]));
  if(parts[0] === 'pub' && parts[1] === 'chave') return renderPubChaveView(parts[2]);

  return renderPubEventos();
}
window.addEventListener('hashchange', route);
// Live-ish updates for the read-only público screens: pick up changes saved by
// the organizador in another tab/window of the same browser (storage event),
// plus a light poll as a fallback so a screen left open keeps refreshing.
window.addEventListener('storage', (e) => {
  if(String(e.key||'').indexOf('chaveamento_v1_') === 0) route();
});
// This is a defensive fallback, not the primary update mechanism — Firestore's
// onSnapshot listeners already push route() reactively the instant data
// changes, in real time. Re-rendering the whole screen from scratch every 4s
// regardless of whether anything changed was wasteful (and visibly janky —
// it could interrupt a scroll or an in-progress pinch-zoom on the árvore), so
// this now just runs occasionally in case a snapshot listener ever misses
// something (dropped connection, etc), not as the normal update path.
setInterval(() => {
  const h = location.hash.slice(1) || '/';
  if(h === '/' || h.indexOf('/pub') === 0) route();
}, 20000);

function normQuadraNome(q){

  return { nome:(q && q.nome) || '', lado:(q && q.lado) === 'direita' ? 'direita' : 'esquerda' };

// Redimensiona no navegador (máx. 640px de largura, JPEG) antes de salvar —
// evita estourar o limite de 1MB por documento do Firestore com foto em base64
// (não usamos Firebase Storage aqui pra não somar mais um SDK/configuração).
function onEventoFotoSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 640;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      eventoSetupState.fotoUrl = canvas.toDataURL('image/jpeg', 0.72);
      renderEventoSetup(eventoSetupState._editId || '');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
// Mesmo esquema de redimensionar no navegador antes de salvar, só que bem
// menor (é um selinho de ~50px no cabeçalho, não uma foto de capa) e como
// PNG em vez de JPEG — logomarca costuma ter fundo transparente, e JPEG não
// tem canal alpha (viraria um fundo branco/preto sólido por trás da logo).
function onEventoLogoSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 300;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      eventoSetupState.logoUrl = canvas.toDataURL('image/png');
      renderEventoSetup(eventoSetupState._editId || '');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
// Logos de patrocinador — pode escolher vários arquivos de uma vez
// (input multiple); cada um passa pelo mesmo redimensionamento pequeno em
// PNG da logomarca do evento, e vai entrando na lista um a um conforme
// termina de carregar (não precisa esperar todos pra ver o primeiro).
function onEventoPatrocinadorSelected(e){
  const files = e.target.files ? Array.from(e.target.files) : [];
  if(!files.length) return;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        const maxW = 300;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        eventoSetupState.patrocinadores = (eventoSetupState.patrocinadores || []).concat([canvas.toDataURL('image/png')]);
        renderEventoSetup(eventoSetupState._editId || '');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}
function removePatrocinador(idx){
  eventoSetupState.patrocinadores = (eventoSetupState.patrocinadores || []).filter((_,i) => i !== idx);
  renderEventoSetup(eventoSetupState._editId || '');
}
// Lista de nomes de quadras do evento (Ed, 21/08/2026) — pedido pra trocar o
// campo "quadra" de cada jogo (que hoje é um número digitado) por uma
// seleção entre nomes cadastrados aqui antes, na edição do evento.
// Adicionar/excluir/trocar lado de uma quadra salva NA HORA (updateEvento
// direto) quando o evento já existe — não fica preso a clicar em "Salvar
// alterações" lá embaixo, que é fácil de esquecer só pra essa lista (Ed,
// 21/08/2026: "eu preciso excluir e adicionar corretamente"). Pra evento
// ainda não criado (sem editId), só existe o estado local mesmo — não tem
// documento no Firestore ainda pra gravar.
function persistQuadrasNomesSeExistir(s){
  if(!s._editId) return;
  const ev = getEvento(s._editId);
  if(!ev) return;
  ev.quadrasNomes = s.quadrasNomes || [];
  updateEvento(ev);
}
function addQuadraNome(){
  const s = eventoSetupState;
  const nome = (s.quadraNomeInput || '').trim();
  if(!nome){ toast('Digite um nome pra quadra'); return; }
  const jaExiste = (s.quadrasNomes || []).some(q => q.nome.toLowerCase() === nome.toLowerCase());
  if(jaExiste){ toast('Essa quadra já está na lista'); return; }
  const lado = s.quadraNomeLado === 'direita' ? 'direita' : 'esquerda';
  s.quadrasNomes = (s.quadrasNomes || []).concat([{ nome, lado }]);
  s.quadraNomeInput = '';
  persistQuadrasNomesSeExistir(s);
  renderEventoSetup(s._editId || '');

function removeQuadraNome(idx){

function toggleQuadraLado(idx){

  persistQuadrasNomesSeExistir(s);
  renderEventoSetup(s._editId || '');
}
// Move uma quadra pra cima/baixo DENTRO do seu próprio lado (Ed, 21/08/2026:
// "quero poder mover a quadra para o lugar e ordem certa, com a categoria e
// quadra") — o array quadrasNomes intercala os dois lados livremente, então
// "vizinho" aqui significa o PRÓXIMO índice na direção pedida que tenha o
// MESMO lado, não necessariamente o índice adjacente no array. Isso faz um
// clique sempre mover uma posição dentro da coluna visual (mapa e editor),
// sem misturar com o outro lado. A ordem final do array é exatamente a ordem
// usada pelo mapa (renderQuadraMapHtml lê nomes[i] em ordem).
function moveQuadraNome(idx, dir){
  const s = eventoSetupState;
  const list = s.quadrasNomes || [];
  const q = list[idx];
  if(!q) return;
  let j = idx + dir;
  while(j >= 0 && j < list.length && list[j].lado !== q.lado) j += dir;
  if(j < 0 || j >= list.length) return; // já é a primeira/última do seu lado
  const tmp = list[j];
  list[j] = list[idx];
  list[idx] = tmp;
  s.quadrasNomes = list;
  persistQuadrasNomesSeExistir(s);
  renderEventoSetup(s._editId || '');
}
function clearQuadrasNomes(){
  const s = eventoSetupState;

  if(!confirm('Excluir todas as ' + s.quadrasNomes.length + ' quadras cadastradas nesse evento?')) return;
  s.quadrasNomes = [];
  persistQuadrasNomesSeExistir(s);
  renderEventoSetup(s._editId || '');
  toast('Todas as quadras foram excluídas');
}

  const groupGames = [];
  const nonGroupGames = [];
  games.forEach(g => { (g.grupo ? groupGames : nonGroupGames).push(g); });
  const runs = groupIntoContiguousFaseRuns(nonGroupGames);

  if(pubActiveTab[id] === undefined) pubActiveTab[id] = 'todas';
  const tab = pubActiveTab[id];
  const fullRanking = computeFullRanking(chave);

  const rankingLink = `<div class="ranking-link" onclick="setPubTab('${id}','__ranking__')">🏁 Ver ranking final</div>`;

  const headerExtra = `<span class="pub-badge">👁 Modo público — só leitura</span>

    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;

  const viewToggle = viewToggleHtml(id, true);

  if(tab === '__ranking__'){
    app.innerHTML = `
      ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (chave.modalidade==='quarteto' ? 'quartetos' : 'duplas') + ' • dupla eliminatória', backHash, headerExtra, logoUrl)}
      <div class="wrap-chave">
        <div class="ranking-link" onclick="setPubTab('${id}','todas')">⬅ Voltar à lista de jogos</div>
        ${renderFinalRankingView(chave, fullRanking, total, done)}
        ${sponsorFooter}
      </div>`;
    return;
  }

  if(getViewMode() === 'atletas'){
    app.innerHTML = `
      ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (chave.modalidade==='quarteto' ? 'quartetos' : 'duplas') + ' • dupla eliminatória', backHash, headerExtra, logoUrl)}
      <div class="wrap-chave">
        ${viewToggle}
        ${renderAtletasListHtml(chave)}
        ${sponsorFooter}
      </div>`;
    return;
  }

  if(getViewMode() === 'arvore'){
    app.innerHTML = `
      ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (chave.modalidade==='quarteto' ? 'quartetos' : 'duplas') + ' • dupla eliminatória', backHash, headerExtra, logoUrl)}
      <div class="wrap-chave">
        ${viewToggle}
        ${treeSectionHtml(chave, true)}
        ${sponsorFooter}
      </div>`;
    setTimeout(setupTreePanZoom, 0);
    return;
  }

  const standings = computeStandings(chave);
  const podium = standings.length ? `<div class="podium">
    <h3>🏆 Classificação (parcial)</h3>
    ${standings.map(r=>`<div class="podium-row"><div class="pos ${r.cls}">${r.pos}</div><div class="name">${escapeHtml(r.name)}</div></div>`).join('')}
  </div>` : '';

  const groupCard = renderGroupCard(chave);

  const groupSection = groupGames.length ? (() => {
    const doneCount = groupGames.filter(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot).length;
    return `<div class="phase-section">
      <div class="phase-title"><span>Fase de grupos</span><span class="count">${doneCount}/${groupGames.length}</span></div>
      ${groupGames.map(g => renderPubMatchCard(chave, g)).join('')}
    </div>`;
  })() : '';

  const sections = groupSection + runs.map(run => {
    const arr = run.arr;
    const doneCount = arr.filter(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot).length;
    return `<div class="phase-section">
      <div class="phase-title"><span>${phaseLabel(run.fase)}</span><span class="count">${doneCount}/${arr.length}</span></div>
      ${arr.map(g => renderPubMatchCard(chave, g)).join('')}
    </div>`;
  }).join('');

  app.innerHTML = `
    ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (chave.modalidade==='quarteto' ? 'quartetos' : 'duplas') + ' • dupla eliminatória', backHash, headerExtra, logoUrl)}
    <div class="wrap-chave">
      ${viewToggle}
      ${rankingLink}
      ${podium}
      ${groupCard}
      ${sections}
      ${sponsorFooter}
    </div>`;
}

function teamRowHasData(t, modalidade){
  if(!t) return false;
  if(modalidade === 'quarteto') return !!(t.nome && t.nome.trim()) || (t.atletas||[]).some(a => a && a.trim());
  return !!(t.atleta1 && t.atleta1.trim()) || !!(t.atleta2 && t.atleta2.trim());
}
